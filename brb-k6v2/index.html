<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--green:#2d3e33;--green2:#3e5546;--cream:#ecebe3;--paper:#f3f2ec;--card:#fbfaf6;--ink:#2d3e33;--soft:#6f7a72;--line:#d9d8ce}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121814;--card:#19211c;--ink:#ecebe3;--soft:#a9b2ab;--line:#28322c;--green:#b9cdbd}}
:root[data-theme="dark"]{--paper:#121814;--card:#19211c;--ink:#ecebe3;--soft:#a9b2ab;--line:#28322c;--green:#b9cdbd}
body{background:var(--paper);color:var(--ink);font-family:"Tajawal","Lexend",system-ui,sans-serif}
html[lang=en] body{font-family:"Lexend","Tajawal",sans-serif}
.demo-note{background:#2d3e33;color:#ecebe3}
header{position:relative;text-align:center;background:#ecebe3;color:#2d3e33;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 1.6rem;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#2d3e33;color:#ecebe3;border:0;border-radius:6px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .78rem "Lexend";z-index:2}
/* coffee branch drawing in the corner, like their menu */
.branch{position:absolute;top:0;left:0;width:96px;height:110px}
html[dir=rtl] .branch{left:auto;right:0;transform:scaleX(-1)}
html[dir=rtl] .lover{right:auto;left:1.1rem}
.lover{position:absolute;top:calc(env(safe-area-inset-top,0px) + 4.2rem);right:1.1rem;font:700 1.15rem/0.95 "Caveat";color:#2d3e33;transform:rotate(-8deg);direction:ltr;text-align:center}
#logo{display:inline-block;padding:.4rem 1.4rem;background:#ecebe3;direction:ltr}
.wm{font:800 4rem/1 "Lexend";letter-spacing:.04em;color:#2d3e33}
.ws{font:500 .78rem "Lexend";letter-spacing:.42em;margin-inline-start:.42em;color:#2d3e33;margin-top:.3rem}
.rule{width:44px;height:3px;background:#2d3e33;margin:.9rem auto 0;border-radius:2px}
.tg{margin:.7rem 0 0;font:500 .95rem "Tajawal";color:#2d3e33}
.info{font-size:.76rem;color:#6f7a72;margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--green);background:none;color:var(--green);border-radius:6px;padding:.28rem 1rem;cursor:pointer;min-height:36px;font:500 .84rem "Tajawal","Lexend"}
.chip[aria-pressed="true"]{background:#2d3e33;border-color:#2d3e33;color:#ecebe3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:#b9cdbd;border-color:#b9cdbd;color:#121814}}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
/* underlined two-language column headers */
h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 .4rem;padding-bottom:.35rem;border-bottom:2.5px solid var(--green);font:700 1.25rem "Tajawal";color:var(--green)}
h2 .en{font:500 1.15rem "Lexend";letter-spacing:.04em;direction:ltr}
.row{display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:baseline;padding:.6rem 0;border-bottom:1px solid var(--line)}
.pr{font:700 1.05rem "Lexend";color:var(--green);min-width:2.2rem;direction:ltr}
.nm{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.nm .a{font-weight:700}
.nm .e{font:500 .84rem "Lexend";color:var(--ink);direction:ltr}
.nm .d{flex-basis:100%;font-size:.7rem;color:var(--soft)}
/* coffee box card, outlined like theirs */
.box{margin:2rem 0 0;border:2px solid var(--green);border-radius:14px;padding:.9rem 1rem}
.box h3{display:flex;justify-content:space-between;margin:0 0 .5rem;font:700 1.15rem "Tajawal";color:var(--green)}
.box h3 span{font:500 1.15rem "Lexend";direction:ltr}
.box .bx{display:grid;grid-template-columns:62px 1fr;gap:.9rem;align-items:center}
.box svg{width:62px;height:62px}
.box .r{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--line);font-weight:700}
.box .r:last-child{border-bottom:0}
.box .r b{font:700 1rem "Lexend";color:var(--green);direction:ltr}
.box .r small{display:block;font:400 .68rem "Tajawal";color:var(--soft)}
.bf{margin:2rem 0 0;display:flex;justify-content:space-between;align-items:flex-end}
.bf .s{font:700 1.3rem/0.95 "Caveat";color:var(--green);direction:ltr;text-align:left}
.bf .m{font:800 1rem "Lexend";letter-spacing:.2em;color:var(--green);display:flex;align-items:center;gap:.5rem;direction:ltr}
.bf .m::before,.bf .m::after{content:"";width:40px;height:2px;background:var(--green)}
.nt{margin:1.2rem 0 0;text-align:center;font-size:.76rem;color:var(--soft)}
.visit a{border-radius:6px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2><span class="en">${esc(c.en.toUpperCase())}</span><span>${esc(c.ar)}</span></h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="pr">${P(i)}</span><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}${(i.dAr||i.dEn)?`<span class="d">${esc(lang==="ar"?i.dAr:i.dEn)}</span>`:""}</span></div>`; }
function afterRender(){ if(query.trim()) return; const c=cur(); $("menu").insertAdjacentHTML("beforeend",`<div class="box"><h3><span>COFFEE BOX</span>${T[lang].bx}</h3><div class="bx">${'<svg viewBox="0 0 62 62" aria-hidden="true"><path d="M10 22h42v32H10z" fill="#2d3e33"/><path d="M10 22l6-10h30l6 10" fill="#3e5546"/><path d="M24 12c0-6 14-6 14 0" fill="none" stroke="#2d3e33" stroke-width="3"/><text x="31" y="44" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="9" fill="#ecebe3">BRB</text></svg>'}<div><div class="r"><span>${T[lang].bh}<small>${T[lang].bl}</small></span><b>${fmt(37)} <small>${c}</small></b></div><div class="r"><span>${T[lang].bi}<small>${T[lang].bl}</small></span><b>${fmt(39)} <small>${c}</small></b></div></div></div></div><div class="bf"><span class="s">but<br>first,<br>coffee</span><span class="m">BRB</span></div><p class="nt">${T[lang].nt}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
