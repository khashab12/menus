<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو بروڤ</title>
<meta name="description" content="كل تفصيلة في بروڤ مصممة لمحبين القهوة">
<meta property="og:title" content="منيو بروڤ">
<meta property="og:description" content="كل تفصيلة في بروڤ مصممة لمحبين القهوة">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/brov-t6m3/">
<meta property="og:image" content="https://khashab12.github.io/menus/brov-t6m3/logo.png">
<meta name="theme-color" content="#45482f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Almarai:wght@300;400;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--olive:#45482f;--olive2:#55583b;--cream:#f3efe2;--ink:#f6f3ea;--soft:#c9c6ad;--line:rgba(246,243,234,.18);--gold:#d8cfa6;--card:rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--olive:#2c2e1e;--olive2:#35382545}}
:root[data-theme="dark"]{--olive:#2c2e1e}
/* woven linen texture like the menu board */
body{background:var(--olive);color:var(--ink);font-family:"Almarai","DM Sans",system-ui,sans-serif;
 background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
html[lang=en] body{font-family:"DM Sans","Almarai",sans-serif}
.demo-note{background:#2a2c1c;color:#f3efe2}
header{position:relative;text-align:center;background:#45482f;color:#f6f3ea;padding:calc(env(safe-area-inset-top,0px) + 3.4rem) 1.2rem 2rem}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:none;color:#f6f3ea;border:1px solid rgba(246,243,234,.5);border-radius:0;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .78rem "DM Sans";letter-spacing:.1em;z-index:2}
#logo{display:inline-block;padding:.6rem 1.4rem;background:#45482f;direction:ltr}
.wm{font:600 4rem/.9 "Fraunces";font-variation-settings:"opsz" 144;letter-spacing:-.01em;color:#f6f3ea}
.sub{font:500 .8rem "DM Sans";letter-spacing:.32em;margin-top:.3rem;margin-inline-start:.32em;color:#f6f3ea}
/* the arched shopfront from their photos */
.arch{display:block;width:180px;height:16px;margin:1.2rem auto 0}
.tg{margin:.9rem auto 0;max-width:290px;font:300 .92rem/1.7 "Almarai";color:#d8cfa6}
html[lang=en] .tg{font:italic 400 .95rem/1.5 "Fraunces"}
.info{font-size:.76rem;color:#c9c6ad;margin:.4rem 0 0;letter-spacing:.02em}
.bar{position:sticky;top:0;z-index:5;background:var(--olive);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:0;border-bottom:1px solid var(--soft);background:transparent;color:var(--ink);border-radius:0;padding:.55rem .2rem;font:inherit}
.search input::placeholder{color:var(--soft)}
.chips{display:flex;gap:1.2rem;overflow-x:auto;padding:.6rem 0 .2rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:none;color:var(--soft);padding:.3rem 0;cursor:pointer;min-height:36px;font:500 .8rem "DM Sans","Almarai";letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2.2rem;scroll-margin-top:120px}
/* bilingual header like the board: EN left, AR right */
h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 .6rem;padding-bottom:.45rem;border-bottom:1px solid var(--line);direction:ltr}
h2 .e{font:600 .9rem "DM Sans";letter-spacing:.14em;text-transform:uppercase}
h2 .a{font:700 1rem "Almarai";direction:rtl}
/* three columns: EN · price · AR, like their printed board */
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:baseline;padding:.42rem 0;direction:ltr}
.row .e{font:500 .86rem "DM Sans";letter-spacing:.06em;text-transform:uppercase}
.row .a{font:400 .95rem "Almarai";text-align:right;direction:rtl}
.row .pr{font:600 1.02rem "Fraunces";color:var(--gold);text-align:center;min-width:3.4rem;white-space:nowrap}
.row .pr small{font:400 .6rem "Almarai";color:var(--soft);margin-inline-start:.2rem}
.row .c{display:block;font:400 .62rem "DM Sans";color:var(--soft);letter-spacing:.08em;text-transform:none;margin-top:.1rem}
html[lang=en] .row{grid-template-columns:1fr auto}
html[lang=en] .row .a{display:none}
.orn{display:block;width:150px;height:8px;margin:2rem auto 0}
.visit a{border-radius:0;border-color:var(--soft);color:var(--ink)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><div class="wm">BROV</div><div class="sub">COFFEE</div></div>
  <svg class="arch" viewBox="0 0 180 16" aria-hidden="true"><path d="M0 15h60M120 15h60" stroke="#d8cfa6" stroke-width="1"/><path d="M66 15a24 12 0 0 1 48 0" fill="none" stroke="#d8cfa6" stroke-width="1"/><circle cx="90" cy="9" r="1.6" fill="#d8cfa6"/></svg>
  <p class="tg" id="tg"></p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<nav class="visit" id="visit" hidden></nav>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>

    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
