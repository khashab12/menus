<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو أوركِــت</title>
<meta name="description" content="Specialty coffee &amp; bakery">
<meta property="og:title" content="منيو أوركِــت">
<meta property="og:description" content="Specialty coffee &amp; bakery">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/orkt-m2k8/">
<meta name="theme-color" content="#1B1A17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--ivory:#F4F0E6;--stone:#DCCFBA;--ink:#1B1A17;--walnut:#6B4A33;--terra:#8E3B2A;--muted:#7a7064;--line:rgba(27,26,23,.14);
 --display:"Cormorant Garamond",serif;--body:"Tajawal",system-ui,sans-serif;--sign:"Barlow Condensed","Tajawal",sans-serif}
body{background:var(--ivory);color:var(--ink);font-family:var(--body)}
.demo-note{background:var(--ink);color:var(--ivory)}
header.hero{position:relative;max-width:640px;margin:0 auto;padding:1rem 1rem 0}
.lang{position:absolute;top:1.6rem;inset-inline-end:1.6rem;z-index:3;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:.15rem .7rem;font:700 .75rem var(--body);cursor:pointer}
.sign{position:relative;background:var(--ink);color:#fff;border-radius:10px;padding:1.1rem 1rem 1rem;overflow:hidden}
.sign .top{display:flex;align-items:center;gap:.6rem}
.m{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--terra);display:grid;place-items:center}
.m svg{width:26px;height:26px}
.sign .st{font:700 1.35rem/1.1 var(--body)}
.sign .st small{display:block;direction:ltr;text-align:start;font:600 .8rem var(--sign);letter-spacing:.14em;color:#cfc6b6;text-transform:uppercase}
.sign .lines{display:flex;gap:.35rem;margin-top:.9rem;flex-wrap:wrap}
.sign .lines span{font:700 .72rem var(--body);padding:.15rem .55rem;border-radius:4px;color:#fff}
.walk{margin-top:.9rem;display:flex;align-items:center;gap:.6rem;border-top:1px solid rgba(255,255,255,.15);padding-top:.7rem;font-size:.85rem;color:#e9e2d4}
.walk svg{flex:0 0 auto;width:30px;height:30px}
.brand{text-align:center;margin:1.4rem 0 .2rem}
.brand .wm{direction:ltr;font:600 clamp(2.8rem,13vw,3.8rem)/1 var(--display);letter-spacing:.12em;margin:0}
.brand .sub{direction:ltr;font:italic 500 1rem var(--display);color:var(--walnut);margin:.15rem 0 0}
.brand .ar{font:700 1rem var(--body);color:var(--muted);margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:rgba(244,240,230,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem;margin-top:.8rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:.6rem .9rem;font:1rem var(--body)}
.search input:focus-visible{outline:2px solid var(--terra)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:#e8e0d0;color:var(--ink);border-radius:6px;padding:.3rem .8rem;font:700 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.6rem}
.lh{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.lh .pill{font:700 .78rem var(--body);color:#fff;border-radius:4px;padding:.2rem .6rem}
.lh h2{margin:0;font:700 1.3rem var(--body)}
.lh .en{direction:ltr;font:600 .85rem var(--sign);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.track{position:relative;padding-inline-start:30px}
.track::before{content:"";position:absolute;top:10px;bottom:10px;inset-inline-start:10px;width:6px;border-radius:3px;background:var(--lc)}
.stop{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.stop::before{content:"";position:absolute;inset-inline-start:-26px;top:.85rem;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--lc)}
.stop.pk::before{background:var(--lc)}
.stop .nm{font-weight:700}
.stop .en{direction:ltr;display:block;font:500 .82rem var(--display);font-style:italic;color:var(--muted)}
.stop .pr{font:700 1rem var(--body);white-space:nowrap}
.pick{display:inline-block;margin-inline-start:.4rem;font-size:.62rem;font-weight:700;border:1px solid var(--ink);border-radius:3px;padding:0 .3rem;vertical-align:middle}
.visit a{background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:8px}
.visit a.wa{background:var(--ink);color:#fff}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem;border-top:1px solid var(--line)}
footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "ORKT", "nameAr": "أوركِــت", "tagline": {"ar": "Specialty coffee & bakery", "en": "Specialty coffee & bakery"}, "info": {"ar": "طريق الشيخ حسن بن حسين بن علي، الحمراء", "en": "Sheikh Hassan bin Hussein bin Ali Rd, Al Hamra"}, "logo": null, "colors": {"primary": "#1B1A17", "onPrimary": "#F4F0E6", "secondary": "#6B4A33", "background": "#F4F0E6", "accent": "#8E3B2A"}, "fonts": {"display": "Cormorant Garamond", "body": "Tajawal"}, "pattern": "none", "currency": {"ar": "ر.س", "en": "SAR"}, "demoBanner": true, "credit": "محمد", "whatsapp": "966535635368", "mapsUrl": "https://maps.google.com/?cid=3229608441976102085", "reviewUrl": "https://maps.google.com/?cid=3229608441976102085", "instagram": "https://www.instagram.com/orkt.cafe/", "categories": [{"id": "coffee", "ar": "القهوة", "en": "Coffee", "line": "#8E3B2A", "items": [{"ar": "اسبريسو", "en": "Espresso", "p": 10}, {"ar": "قهوة اليوم", "en": "Today's Coffee", "p": 10}, {"ar": "كورتادو", "en": "Cortado", "p": 12}, {"ar": "امريكانو", "en": "Americano", "p": 12}, {"ar": "فلات وايت", "en": "Flat White", "p": 14}, {"ar": "كابتشينو", "en": "Cappuccino", "p": 14}, {"ar": "لاتيه", "en": "Latte", "p": 14}, {"ar": "ميكاتو", "en": "Macchiato", "p": 14}, {"ar": "V60", "en": "V60", "p": 19}, {"ar": "هوت شوكلت", "en": "Hot Chocolate", "p": 19}, {"ar": "سبانيش لاتيه", "en": "Spanish Latte", "p": 20}, {"ar": "ماتشا ORKT", "en": "Matcha ORKT", "p": 24, "pick": true}]}, {"id": "iced", "ar": "المشروبات الباردة", "en": "Iced Drinks", "line": "#3E6B5A", "items": [{"ar": "ايس قهوة اليوم", "en": "Iced Coffee of the Day", "p": 13}, {"ar": "ايس امريكانو", "en": "Iced Americano", "p": 14}, {"ar": "ايس لاتيه", "en": "Iced Latte", "p": 16}, {"ar": "ايس كركديه", "en": "Iced Hibiscus", "p": 18}, {"ar": "ايستي", "en": "Iced Esti", "p": 19}, {"ar": "ايس سبانيش لاتيه", "en": "Iced Spanish Latte", "p": 22}, {"ar": "بلاك فورست موهيتو", "en": "Black Forest Mojito", "p": 22}, {"ar": "باشن فروت موهيتو", "en": "Passion Fruit Mojito", "p": 22}, {"ar": "ايس V60", "en": "Iced V60", "p": 22}, {"ar": "ايس سولتد كراميل", "en": "Iced Salted Caramel", "p": 24}, {"ar": "ايس ماتشا ORKT", "en": "Iced ORKT Matcha", "p": 24, "pick": true}, {"ar": "ماتشا توت فوم", "en": "Matcha Strawberry Foam", "p": 24}]}, {"id": "sweet", "ar": "الحلويات", "en": "Desserts", "line": "#B8862F", "items": [{"ar": "زبدة الفول السوداني", "en": "Peanut Butter", "p": 9}, {"ar": "ماجيك بار", "en": "Magic Bar", "p": 12}, {"ar": "أصابع الوافل", "en": "Waffle Sticks", "p": 21}, {"ar": "كيك الشوكولاتة", "en": "Chocolate Cake", "p": 24}, {"ar": "كيك الجزر", "en": "Carrot Cake", "p": 24, "pick": true}, {"ar": "تشيز كيك كيندر", "en": "Kinder Cheesecake", "p": 24}, {"ar": "مانجو ترفل", "en": "Mango Truffle", "p": 26}, {"ar": "كيك بومب", "en": "Bomb Cake", "p": 26}, {"ar": "سان سيباستيان", "en": "San Sebastian", "p": 28}]}, {"id": "bev", "ar": "المشروبات", "en": "Beverages", "line": "#6B4A33", "items": [{"ar": "ماء", "en": "Water", "p": 2}, {"ar": "شوكولاتة", "en": "Chocolate", "p": 3}, {"ar": "اسبريسو شوت", "en": "Espresso Shot", "p": 6}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const WALKER=(c)=>`<svg viewBox="0 0 40 40" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="21" cy="7" r="3.2" fill="${c}" stroke="none"/><path d="M20 12l-3 11 7 5 2 9"/><path d="M17 23l-6 12"/><path d="M19 15l-7 4M20 14l8 3"/></svg>`;
function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`<div class="sign"><div class="top"><span class="m">${WALKER("#fff")}</span><div class="st">${ar?"محطة أوركِت":"ORKT Station"}<small>Al Hamra · Riyadh</small></div></div>
   <div class="lines">${C.categories.map(c=>`<span style="background:${c.line}">${esc(L(c,"ar","en"))}</span>`).join("")}</div>
   <div class="walk">${WALKER("#e9e2d4")}<span>${ar?"جاي من المترو؟ اختار طلبك وأنت بالطريق، وأول ما توصل اطلبه على طول":"Coming from the metro? Pick your order on the way"}</span></div></div>
   <div class="brand"><p class="wm">ORKT</p><p class="sub">Specialty coffee &amp; bakery</p><p class="ar">One cup · Real smile</p></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}" style="--lc:${c.line}"><div class="lh"><span class="pill" style="background:${c.line}">${esc(L(c,"ar","en"))}</span>${lang==="ar"?`<span class="en">${esc(c.en)}</span>`:""}</div><div class="track">`;
    for(const i of items){
      html+=`<div class="stop${i.pick?" pk":""}"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}${lang==="ar"?`<span class="en">${esc(i.en)}</span>`:""}</div><span class="pr">${i.p.toFixed?fmt(i.p):i.p} ${cur()}</span></div>`;}
    html+="</div></section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف والأسعار من منيوكم المطبوع (صورة زبون على جوجل)";
T.en.note="Preview: items and prices from your printed menu (a guest's photo on Google)";
T.ar.search="وش بتطلب اليوم؟";
T.ar.pick="محطة مميزة";T.en.pick="Must-stop";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"orkt-m2k8"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
