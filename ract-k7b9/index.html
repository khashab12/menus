<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو راكِت</title>
<meta name="description" content="حيث تمتزج الثقافات في فنجان">
<meta property="og:title" content="منيو راكِت">
<meta property="og:description" content="حيث تمتزج الثقافات في فنجان">
<meta property="og:type" content="website">
<meta property="og:image" content="https://khashab12.github.io/menus/ract-k7b9/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://khashab12.github.io/menus/ract-k7b9/og.png">
<meta property="og:url" content="https://khashab12.github.io/menus/ract-k7b9/">
<meta name="theme-color" content="#1E1B18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bar{position:sticky;top:0;z-index:5;backdrop-filter:blur(6px);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;padding:.55rem .9rem;font:1rem var(--body)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;cursor:pointer;font:600 .84rem var(--body)}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
footer{text-align:center;font-size:.85rem;padding:1.2rem 1rem 2.5rem}
.lang{position:absolute;top:.9rem;inset-inline-end:1rem;z-index:3;border-radius:999px;padding:.2rem .8rem;font:600 .78rem var(--body);cursor:pointer}

:root{--ink:#1E1B18;--sand:#EFE6D6;--sand2:#E4D7C1;--red:#8E2A1E;--card:#F8F2E7;--muted:#7a6e60;--line:rgba(30,27,24,.15);
 --serif:"Cinzel",Georgia,serif;--body:"Readex Pro",system-ui,sans-serif}
body{background:var(--sand);color:var(--ink);font-family:var(--body)}
.demo-note{background:var(--ink);color:var(--sand)}
header.hero{position:relative;background:var(--sand);padding:2rem 1rem 0;text-align:center;overflow:hidden}
.lang{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.emb{width:96px;height:96px}
.wm{direction:ltr;font:700 2.3rem/1 var(--serif);letter-spacing:.18em;margin:.5rem 0 0;padding-left:.18em}
.ar{font:600 1.15rem var(--body);margin:.15rem 0 0}
.tag{font-size:.86rem;color:var(--red);margin:.6rem 0 0;font-weight:600}
.info{font-size:.78rem;color:var(--muted);margin:.3rem 0 0}
.sky{display:block;width:100%;max-width:560px;margin:.9rem auto 0;height:auto}
.ground{height:14px;background:var(--red)}
.bar{background:rgba(239,230,214,.96);border-bottom:1px solid var(--line)}
.search input{border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:0}
.search input:focus-visible{outline:2px solid var(--red)}
.chip{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;padding:.25rem .95rem;transform:skewX(-8deg)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sand)}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.legend{display:flex;gap:.5rem;align-items:center;background:var(--card);border:1px dashed var(--red);padding:.6rem .8rem;margin-top:1.1rem;font-size:.78rem;color:var(--ink)}
.legend b{background:var(--red);color:#fff;font-size:.66rem;padding:.05rem .45rem;white-space:nowrap}
section.cat{margin-top:1.6rem}
.ch{text-align:center;margin-bottom:.6rem}
.ch h2{margin:0;font:600 1.2rem var(--body)}
.ch span{direction:ltr;display:block;font:600 .72rem var(--serif);letter-spacing:.3em;color:var(--red)}
.ch i{display:block;width:70px;height:10px;margin:.3rem auto 0;background:radial-gradient(circle,var(--ink) 2px,transparent 2.5px) 0 50%/14px 10px repeat-x}
.r{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;padding:.75rem .9rem;background:var(--card);margin-bottom:.45rem;border-inline-start:3px solid var(--ink)}
.r .nm{font:600 1rem var(--body)}
.r .en{direction:ltr;display:block;font:500 .72rem var(--serif);color:var(--muted);letter-spacing:.05em}
.r .ds{display:block;font-size:.72rem;color:var(--red)}
.r .pr{font:700 1.02rem var(--body);align-self:center;text-align:end}
.r .pr small{display:block;font-size:.6rem;color:var(--muted);font-weight:500}
.r.pk{border-inline-start-color:var(--red)}
.r .dm{color:var(--red);margin-inline-start:.3rem;font-size:.8rem}
.r.out{opacity:.55}
.r.out .nm{text-decoration:line-through}
.r .so{display:inline-block;background:var(--red);color:#fff;font-size:.62rem;padding:0 .4rem;margin-inline-start:.4rem;text-decoration:none}
.visit a{background:var(--card);color:var(--ink);border:1px solid var(--ink);border-radius:0}
footer{color:var(--muted)} footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "RACT", "nameAr": "راكِت", "tagline": {"ar": "حيث تمتزج الثقافات في فنجان", "en": "Where cultures blend in a cup"}, "info": {"ar": "طريق الخير الفرعي، القيروان، الرياض", "en": "Al Khair Rd, Al Qirawan, Riyadh"}, "logo": null, "colors": {"primary": "#1E1B18", "onPrimary": "#EFE6D6", "secondary": "#8E2A1E", "background": "#EFE6D6", "accent": "#8E2A1E"}, "fonts": {"display": "Cinzel", "body": "Readex Pro"}, "pattern": "none", "currency": {"ar": "ر.س", "en": "SAR"}, "demoBanner": true, "credit": "محمد", "mapsUrl": "https://maps.google.com/?cid=9631506710879976585", "reviewUrl": "https://maps.google.com/?cid=9631506710879976585", "instagram": "https://www.instagram.com/ractcafe.sa/", "categories": [{"id": "coffee", "ar": "القهوة", "en": "Coffee", "items": [{"ar": "قهوة اليوم", "en": "Coffee of the Day", "p": 9, "pick": true, "dAr": "أكثر شي يطلبونه زباينكم", "dEn": "Your customers' most ordered", "sample": true}, {"ar": "V60 إثيوبي", "en": "Ethiopian V60", "p": 16, "sample": true}, {"ar": "V60 كولومبي", "en": "Colombian V60", "p": 17, "sample": true}, {"ar": "آيس دريب إثيوبي", "en": "Ethiopian Iced Drip", "p": 18, "sample": true}, {"ar": "إسبريسو بليند", "en": "Espresso Blend", "p": 11, "sample": true}, {"ar": "فلات وايت", "en": "Flat White", "p": 15, "sample": true}, {"ar": "ماتشا", "en": "Matcha", "p": 19, "sample": true}]}, {"id": "sweet", "ar": "الحلا", "en": "Sweets", "items": [{"ar": "دولتشي كيك", "en": "Dolce Cake", "p": 24, "pick": true, "sample": true}, {"ar": "كراميلا كرانش", "en": "Caramella Crunch", "p": 22, "sample": true}, {"ar": "سميد", "en": "Semolina Cake", "p": 18, "soldout": true, "sample": true}, {"ar": "بسبوسة", "en": "Basbousa", "p": 16, "sample": true}, {"ar": "تشيز كيك التوت", "en": "Berry Cheesecake", "p": 22, "sample": true}, {"ar": "كيكة الليمون", "en": "Lemon Cake", "p": 18, "sample": true}, {"ar": "تيراميسو حساوي", "en": "Hasawi Tiramisu", "p": 24, "sample": true}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`<svg class="emb" viewBox="0 0 100 100" fill="none" stroke="#1E1B18" stroke-width="2.4" aria-hidden="true"><circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="34"/><path d="M50 4l5 6-5 6-5-6zM50 84l5 6-5 6-5-6zM4 50l6-5 6 5-6 5zM84 50l6-5 6 5-6 5z" fill="#1E1B18" stroke="none"/><rect x="38" y="62" width="24" height="10"/><rect x="41" y="51" width="18" height="11"/><rect x="44" y="40" width="12" height="11"/><rect x="46" y="31" width="8" height="9"/><path d="M48 31v-4h4v4"/></svg><p class="wm">RACT</p><p class="ar">راكِت</p><p class="tag">${esc(C.tagline[lang])}</p><p class="info">${esc((C.info||{})[lang]||"")}</p><svg class="sky" viewBox="0 0 560 90" fill="none" stroke="#1E1B18" stroke-width="1.6" aria-hidden="true"><path d="M0 88h560"/><path d="M20 88l40-46 40 46"/><path d="M80 88l26-30 26 30"/><path d="M150 88V52h80v36M150 52h80M150 64h80M160 88V72a6 6 0 0 1 12 0v16M184 88V72a6 6 0 0 1 12 0v16M208 88V72a6 6 0 0 1 12 0v16M160 64V56M176 64V56M192 64V56M208 64V56M224 64V56"/><path d="M262 88V40c0-6 12-6 12 0v48M268 34v-10"/><path d="M290 88c0-30 4-46 10-56M300 32c-8-2-16 2-20 8M300 32c6-6 14-6 20-2M300 32c-2-8 2-14 8-16"/><path d="M340 88V58h14V48h22v10h14v30M365 48V30l-6-6h12l-6 6"/><path d="M420 88V70h30v18M425 70l10-14 10 14"/><path d="M480 88V22l14-14 14 14v66M494 8V2M486 40h16M486 60h16"/><path d="M520 88c4-14 10-22 18-26M538 62c4 6 6 16 6 26"/></svg><div class="ground"></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0; const ar=lang==="ar";
  html+=`<div class="legend"><b>${ar?"خلص اليوم":"Sold out"}</b><span>${ar?"تقدرون تقفلون أي صنف خلص بضغطة، عشان الزبون يعرف قبل لا يطلب":"Mark any item as sold out in one tap, so guests know before they order"}</span></div>`;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch"><h2>${esc(L(c,"ar","en"))}</h2>${ar?`<span>${esc(c.en.toUpperCase())}</span>`:""}<i></i></div>`;
    for(const i of items){const ds=L(i,"dAr","dEn");
      html+=`<div class="r${i.pick?" pk":""}${i.soldout?" out":""}"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="dm" title="${T[lang].pick}">◆</span>`:""}${i.soldout?`<span class="so">${ar?"خلص اليوم":"Sold out"}</span>`:""}${ar?`<span class="en">${esc(i.en)}</span>`:""}${ds?`<span class="ds">${esc(ds)}</span>`:""}</div><span class="pr">${fmt(i.p)} ${cur()}<small>${ar?"سعر مثال":"sample price"}</small></span></div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف من تجارب زباينكم بقوقل، والأسعار أمثلة لين نحط منيوكم";
T.en.note="Preview: items taken from your Google reviews, prices are samples until we add your menu";
T.ar.search="وش تبي اليوم؟";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"ract-k7b9"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
