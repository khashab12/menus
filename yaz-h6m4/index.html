<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو ياز سبيشالتي كوفي</title>
<meta name="description" content="Crafted with passion &amp; served with love">
<meta property="og:title" content="منيو ياز سبيشالتي كوفي">
<meta property="og:description" content="Crafted with passion &amp; served with love">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/yaz-h6m4/">
<meta name="theme-color" content="#1E1F1D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--board:#1E1F1D;--board2:#272926;--chalk:#F5F2EA;--chalk2:#cfccc4;--red:#C8262C;--leaf:#4F7A3A;--wood:#9B6B43;--paper:#F5F2EA;--muted:#6c6a64;--line:rgba(30,31,29,.14);
 --display:"Pacifico",cursive;--body:"Cairo",system-ui,sans-serif}
body{background:var(--paper);color:var(--board);font-family:var(--body)}
.demo-note{background:var(--red);color:#fff}
header.hero{position:relative;overflow:hidden;padding:0 0 1rem;background:var(--paper)}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;background:var(--chalk);color:var(--board);border:0;border-radius:999px;padding:.2rem .8rem;font:700 .78rem var(--body);cursor:pointer}
.pergola{height:26px;background:repeating-linear-gradient(90deg,var(--wood) 0 14px,transparent 14px 40px),var(--board);border-bottom:6px solid var(--wood)}
.board{position:relative;margin:0 .8rem;background:radial-gradient(ellipse at 30% 20%,var(--board2),var(--board) 70%);color:var(--chalk);border:8px solid var(--wood);border-top:0;border-radius:0 0 14px 14px;padding:2rem 1rem 1.3rem;text-align:center}
.board svg.dood{position:absolute;opacity:.55}
.sign{display:inline-block;background:#fff;border-radius:10px;padding:.2rem 1.2rem .5rem;box-shadow:0 6px 20px -8px #000}
.wm{direction:ltr;font:400 clamp(3rem,15vw,4.2rem)/1.15 var(--display);color:var(--red);margin:0;display:flex;align-items:center;gap:.3rem;justify-content:center}
.wm svg{width:38px;height:38px}
.sub{direction:ltr;font:700 .66rem var(--body);letter-spacing:.35em;color:var(--board);margin:0}
.motto{direction:ltr;font:400 1.05rem var(--display);margin:1rem 0 0;color:var(--chalk)}
.info{font-size:.85rem;color:var(--chalk2);margin:.4rem 0 0}
.turf{height:12px;margin:0 .8rem;background:repeating-linear-gradient(90deg,var(--leaf) 0 3px,#5d8c45 3px 6px);border-radius:0 0 6px 6px}
.bar{position:sticky;top:0;z-index:5;background:rgba(245,242,234,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:2px solid var(--board);background:#fff;color:var(--board);border-radius:10px;padding:.5rem .9rem;font:1rem var(--body)}
.search input:focus-visible{outline:2px solid var(--red)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--board);background:transparent;color:var(--board);border-radius:8px;padding:.2rem .85rem;font:700 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--board);color:var(--chalk)}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.4rem;background:var(--board);color:var(--chalk);border-radius:14px;padding:1rem 1rem .6rem;border:6px solid var(--wood)}
.ch{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1.5px dashed rgba(245,242,234,.4);padding-bottom:.4rem;margin-bottom:.3rem}
.ch h2{margin:0;font:800 1.2rem var(--body)}
.ch span{direction:ltr;font:400 1rem var(--display);color:#f0b4b6}
.hd{display:grid;grid-template-columns:1fr 3.4rem 3.4rem;font-size:.68rem;color:var(--chalk2);text-align:center;padding:.2rem 0}
.hd b:first-child{text-align:start;font-weight:400}
.it{display:grid;grid-template-columns:1fr 3.4rem 3.4rem;align-items:center;padding:.45rem 0;border-bottom:1px solid rgba(245,242,234,.12)}
.it:last-child{border-bottom:0}
.it .nm{font:700 .98rem var(--body)}
.it .en{direction:ltr;display:block;font:600 .74rem var(--body);color:var(--chalk2)}
.it .p{text-align:center;font:800 1rem var(--body)}
.it .p.one{grid-column:2/4}
.heart{color:#6fa8dc;font-size:.8rem;margin-inline-start:.3rem}
.visit a{background:#fff;color:var(--board);border:2px solid var(--board);border-radius:10px}
.visit a.wa{background:var(--leaf);border-color:var(--leaf);color:#fff}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem}
footer strong{color:var(--board)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <div class="pergola" aria-hidden="true"></div>
  <div id="heroInner"></div>
  <div class="turf" aria-hidden="true"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "Yaz Specialty Coffee", "nameAr": "ياز سبيشالتي كوفي", "tagline": {"ar": "Crafted with passion & served with love", "en": "Crafted with passion & served with love"}, "info": {"ar": "شارع ٣٠٠، المعادي الجديدة", "en": "Street 300, New Maadi"}, "logo": null, "colors": {"primary": "#1E1F1D", "onPrimary": "#F5F2EA", "secondary": "#C8262C", "background": "#F5F2EA", "accent": "#4F7A3A"}, "fonts": {"display": "Pacifico", "body": "Cairo"}, "pattern": "none", "currency": {"ar": "ج.م", "en": "EGP"}, "demoBanner": true, "credit": "محمد", "whatsapp": "201240018108", "mapsUrl": "https://maps.google.com/?cid=14165650462110530390", "reviewUrl": "https://maps.google.com/?cid=14165650462110530390", "instagram": "https://www.instagram.com/yaz.specialty_coffee/", "categories": [{"id": "espresso", "ar": "إسبريسو", "en": "Espresso", "items": [{"ar": "دبل إسبريسو", "en": "Double Espresso", "p": 80}, {"ar": "ماكياتو", "en": "Macchiato", "p": 85}, {"ar": "كورتادو", "en": "Cortado", "p": 90}, {"ar": "فلات وايت", "en": "Flat White", "p": 95}, {"ar": "أفوجاتو", "en": "Affogato", "p": 100}, {"ar": "أمريكانو", "en": "Americano", "p": 90, "ice": 85}]}, {"id": "milk", "ar": "بالحليب", "en": "Milk Based", "items": [{"ar": "كابتشينو", "en": "Cappuccino", "p": 100, "ice": 110}, {"ar": "لاتيه", "en": "Latte", "p": 100, "ice": 100}, {"ar": "سبانش لاتيه", "en": "Spanish Latte", "p": 110, "ice": 115, "pick": true}, {"ar": "موكا", "en": "Mocha", "p": 105, "ice": 110}, {"ar": "وايت موكا", "en": "White Mocha", "p": 105, "ice": 110}, {"ar": "بستاشيو لاتيه", "en": "Pistachio Latte", "p": 105, "ice": 115, "pick": true}, {"ar": "كراميل ماكياتو", "en": "Caramel Macchiato", "p": 110, "ice": 115}, {"ar": "سولتد كراميل لاتيه", "en": "Salted Caramel Latte", "p": 105, "ice": 110}, {"ar": "توفي نت لاتيه", "en": "Toffee Nut Latte", "p": 105, "ice": 110}]}, {"id": "classic", "ar": "قهوة وشاي", "en": "Coffee & Tea", "items": [{"ar": "قهوة تركي سنجل", "en": "Turkish Coffee · Single", "p": 45}, {"ar": "قهوة تركي دبل", "en": "Turkish Coffee · Double", "p": 60}, {"ar": "قهوة فرنساوي", "en": "French Coffee", "p": 60}, {"ar": "قهوة بندق", "en": "Hazelnut Coffee", "p": 65}, {"ar": "قهوة فانيليا", "en": "Vanilla Coffee", "p": 65}, {"ar": "نسكافيه بلاك", "en": "Nescafé Black", "p": 40}, {"ar": "نسكافيه باللبن", "en": "Nescafé with Milk", "p": 65}, {"ar": "شاي", "en": "Tea", "p": 35}, {"ar": "شاي باللبن", "en": "Tea with Milk", "p": 50}, {"ar": "شاي فليفر", "en": "Flavored Tea", "p": 45}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const CUPI=`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 16h20v8a10 10 0 0 1-20 0z" fill="none" stroke="#C8262C" stroke-width="3"/><path d="M28 18h3a4 4 0 0 1 0 8h-3" fill="none" stroke="#C8262C" stroke-width="3"/><path d="M14 6c-2 3 2 4 0 7M20 6c-2 3 2 4 0 7" fill="none" stroke="#C8262C" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const STAR=`<svg class="dood" style="top:12px;left:14px;width:34px" viewBox="0 0 30 30"><path d="M15 2l3 9h9l-7 6 3 10-8-6-8 6 3-10-7-6h9z" fill="none" stroke="#fff" stroke-width="1.4"/></svg>`;
const LEAF=`<svg class="dood" style="bottom:12px;right:14px;width:40px" viewBox="0 0 40 40"><path d="M6 34C8 16 20 6 34 6c0 16-12 28-28 28zM6 34L26 14" fill="none" stroke="#fff" stroke-width="1.4"/></svg>`;
function renderHero(){
  $("heroInner").innerHTML=`<div class="board">${STAR}${LEAF}<div class="sign"><p class="wm">${CUPI}yaz</p><p class="sub">SPECIALTY COFFEE</p></div>
   <p class="motto">Crafted with passion &amp; served with love</p><p class="info">${esc((C.info||{})[lang]||"")}</p></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0; const ar=lang==="ar";
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const dual=items.some(i=>i.ice!=null);
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch"><h2>${esc(L(c,"ar","en"))}</h2><span>${esc(c.en)}</span></div>`;
    if(dual) html+=`<div class="hd"><b></b><b>${ar?"سخن":"Hot"}</b><b>${ar?"ساقع":"Iced"}</b></div>`;
    for(const i of items){
      const pr=i.ice!=null?`<span class="p">${fmt(i.p)}</span><span class="p">${fmt(i.ice)}</span>`:`<span class="p one">${fmt(i.p)} ${cur()}</span>`;
      html+=`<article class="it"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="heart" title="${T[lang].pick}">💙</span>`:""}${ar?`<span class="en">${esc(i.en)}</span>`:""}</div>${pr}</article>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${ar?"مفيش صنف بالاسم ده، جرب كلمة تانية.":T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف والأسعار من المنيو بتاعكم على Canva، وأي حاجة تتعدل";
T.en.note="Preview: items and prices from your Canva menu, anything can be changed";
T.ar.search="عايز تشرب ايه؟";
T.ar.pick="ترشيحنا";
T.ar.updated="آخر تحديث للأسعار: النهارده";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"yaz-h6m4"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
