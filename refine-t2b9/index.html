<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--navy:#13223f;--royal:#0b3fd0;--cream:#efe6d8;--paper:#f6f3ee;--card:#ffffff;--ink:#13223f;--soft:#66708a;--line:#e3e1db;--matcha:#8fb15a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0b1426;--card:#121e36;--ink:#efe6d8;--soft:#a8b1c6;--line:#22304d;--royal:#7d9cff}}
:root[data-theme="dark"]{--paper:#0b1426;--card:#121e36;--ink:#efe6d8;--soft:#a8b1c6;--line:#22304d;--royal:#7d9cff}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.demo-note{background:#0b3fd0;color:#fff}
/* navy sky with the cream arch + star from their logo */
header{position:relative;text-align:center;background:#13223f;color:#efe6d8;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 0;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#efe6d8;color:#13223f;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "IBM Plex Sans Arabic";z-index:2}
#logo{display:inline-block;padding:.4rem 1.4rem;background:#13223f;direction:ltr}
.wm{font:500 3.6rem/1 "Playfair Display";color:#fff}
.ws{font:500 .66rem "IBM Plex Sans Arabic";letter-spacing:.38em;margin-inline-start:.38em;color:#cfd6e4;margin-top:.35rem;border-top:1px solid #4a5878;border-bottom:1px solid #4a5878;padding:.2rem 0}
.tg{margin:.9rem 0 0;font:500 .95rem "Playfair Display";font-style:italic;color:#efe6d8;direction:ltr}
.info{font-size:.76rem;color:#aab4c9;margin:.2rem 0 0}
.arch{display:block;width:220px;height:70px;margin:1.2rem auto 0;background:#efe6d8;border-radius:110px 110px 0 0;position:relative}
.arch::after{content:"✦";position:absolute;left:50%;top:28px;transform:translateX(-50%);color:#13223f;font-size:1.1rem}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .84rem "IBM Plex Sans Arabic"}
.chip[aria-pressed="true"]{background:#13223f;border-color:#13223f;color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
/* the royal-blue promo card with the curved line, like their coffee-day post */
.promo{position:relative;overflow:hidden;margin:1.4rem 0 0;background:#0b3fd0;color:#fff;border-radius:18px;padding:1.1rem 1.1rem;display:flex;align-items:center;gap:1rem}
.promo svg{position:absolute;inset:0;width:100%;height:100%}
.promo b{position:relative;font:700 2rem/1 "Playfair Display";direction:ltr;background:#efe6d8;color:#0b3fd0;border-radius:50%;width:82px;height:82px;display:grid;place-items:center;flex:0 0 auto}
.promo span{position:relative;font-weight:600;line-height:1.6}
.promo small{display:block;font-weight:400;opacity:.85}
section{margin-top:2rem;scroll-margin-top:120px}
h2{margin:0 0 .5rem;text-align:center;font:600 1.6rem "Playfair Display";color:var(--ink);direction:ltr}
h2 small{display:block;font:500 .85rem "IBM Plex Sans Arabic";color:var(--soft)}
h2::after{content:"✦";display:block;font-size:.8rem;color:var(--royal);margin-top:.2rem}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:baseline;padding:.55rem 0;border-bottom:1px solid var(--line)}
.nm .a{font-weight:600}
.nm .e{display:block;font:500 .82rem "Playfair Display";color:var(--soft);direction:ltr;text-align:right}
html[dir=ltr] .nm .e{text-align:left}
.pr{font:600 1rem "Playfair Display";white-space:nowrap;direction:ltr}
.pr small{font:400 .62rem "IBM Plex Sans Arabic";color:var(--soft);margin-inline-start:.2rem}
.end{margin:2.2rem 0 0;text-align:center;font:500 1.2rem "Playfair Display";font-style:italic;direction:ltr}
.end span{display:block;font:500 .85rem "IBM Plex Sans Arabic";font-style:normal;color:var(--soft)}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "تصور تجريبي — الأصناف والأسعار أمثلة وليست منيو ريفاين", "note": "", "tg": "Coffee. Matcha. Good days.", "pt": "قهوة · ماتشا · أيام حلوة", "ps": "صنع في طويق 💙", "end": "Refine Roast", "ends": "طويق · الرياض"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — items and prices are examples, not Refine's menu", "note": "", "tg": "Coffee. Matcha. Good days.", "pt": "Coffee · Matcha · Good days", "ps": "Made in Tuwaiq 💙", "end": "Refine Roast", "ends": "Tuwaiq · Riyadh"}};
let lang="ar", active="all", query="";
const KEY="refine-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(c.en)}${lang==="ar"?`<small>${esc(c.ar)}</small>`:""}</h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}</span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("afterbegin",`<div class="promo"><svg viewBox="0 0 300 110" preserveAspectRatio="none" aria-hidden="true"><path d="M-10 90C60 20 140 120 210 50S300 20 320 40" fill="none" stroke="#fff" stroke-width="2" opacity=".55"/></svg><b>✦</b><span>${T[lang].pt}<small>${T[lang].ps}</small></span></div>`); $("menu").insertAdjacentHTML("beforeend",`<div class="end">${T[lang].end}<span>${T[lang].ends}</span></div>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
