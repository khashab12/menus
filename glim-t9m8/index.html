<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو GLIM</title>
<meta name="description" content="A spark in the everyday">
<meta property="og:title" content="منيو GLIM">
<meta property="og:description" content="A spark in the everyday">
<meta property="og:type" content="website">
<meta property="og:image" content="https://khashab12.github.io/menus/glim-t9m8/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://khashab12.github.io/menus/glim-t9m8/og.png">
<meta property="og:url" content="https://khashab12.github.io/menus/glim-t9m8/">
<meta name="theme-color" content="#3A1D22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bar{position:sticky;top:0;z-index:5;backdrop-filter:blur(6px);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;padding:.55rem .9rem;font:1rem var(--body)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;cursor:pointer;font:600 .84rem var(--body)}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
footer{text-align:center;font-size:.85rem;padding:1.2rem 1rem 2.5rem}
.lang{position:absolute;top:.9rem;inset-inline-end:1rem;z-index:3;border-radius:999px;padding:.2rem .8rem;font:600 .78rem var(--body);cursor:pointer}

:root{--aub:#3A1D22;--aub2:#2A1417;--aub3:#4A262C;--mint:#9FE0C9;--cream:#F3E7D3;--wood:#A9764B;--muted:#C9B5A6;--line:rgba(243,231,211,.14);
 --script:"Pacifico",cursive;--body:"IBM Plex Sans Arabic",system-ui,sans-serif}
body{background:var(--aub2);color:var(--cream);font-family:var(--body)}
.demo-note{background:var(--mint);color:var(--aub)}
header.hero{position:relative;background:radial-gradient(120% 90% at 50% 0%,#55303A 0%,var(--aub) 55%,var(--aub2) 100%);padding:2.4rem 1rem 1.6rem;text-align:center;overflow:hidden}
.lang{background:transparent;color:var(--mint);border:1px solid var(--mint)}
.spark{position:absolute;color:var(--mint);opacity:.7}
.wm{direction:ltr;font:400 4.4rem/1.1 var(--script);color:var(--mint);margin:.2rem 0 0;text-shadow:0 0 22px rgba(159,224,201,.35)}
.cubes{direction:ltr;display:flex;justify-content:center;gap:.35rem;margin-top:.9rem}
.cubes b{width:34px;height:34px;display:grid;place-items:center;background:var(--cream);color:var(--aub);font:700 1rem var(--body);border-radius:4px;box-shadow:0 4px 0 #cdbfa8}
.tag{direction:ltr;font:500 .78rem var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--cream);opacity:.85;margin:1rem 0 0}
.info{font-size:.82rem;color:var(--muted);margin:.4rem 0 0}
.bar{background:rgba(42,20,23,.94);border-bottom:1px solid var(--line)}
.search input{border:1px solid var(--line);background:var(--aub3);color:var(--cream);border-radius:12px}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline:2px solid var(--mint)}
.chip{border:0;background:var(--aub3);color:var(--cream);border-radius:10px;padding:.3rem .9rem}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--aub)}
.chip:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
section.cat{margin-top:1.6rem;background:var(--aub);border-radius:18px;padding:1rem 1rem .4rem;border:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem}
.ch h2{margin:0;font:700 1.1rem var(--body);color:var(--cream)}
.ch span{direction:ltr;font:400 1.4rem var(--script);color:var(--mint)}
.r{display:flex;align-items:baseline;gap:.5rem;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.r:last-child{border-bottom:0}
.r .tx{flex:0 1 auto}
.r .nm{font:600 1rem var(--body)}
.r .en{direction:ltr;display:block;font-size:.76rem;color:var(--muted)}
.r .ds{display:block;font-size:.72rem;color:var(--mint)}
.r .sm{display:inline-block;font-size:.6rem;border:1px solid var(--mint);color:var(--mint);border-radius:6px;padding:0 .3rem;margin-inline-start:.3rem}
.r .dots{flex:1;border-bottom:1px dotted rgba(243,231,211,.3);transform:translateY(-.3rem)}
.r .pr{font:700 1.05rem var(--body);color:var(--cream);white-space:nowrap}
.r .pr small{font-size:.66rem;color:var(--muted)}
.r .st{color:var(--mint);margin-inline-start:.25rem}
.milk{font-size:.74rem;color:var(--muted);margin:.2rem 0 .7rem}
.visit a{background:var(--aub);color:var(--mint);border:1px solid var(--mint)}
footer{color:var(--muted)} footer strong{color:var(--cream)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <span class="spark" style="top:22%;left:12%"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg></span><span class="spark" style="top:58%;right:10%"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg></span><span class="spark" style="top:76%;left:20%"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg></span>
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "GLIM", "nameAr": "GLIM", "tagline": {"ar": "A spark in the everyday", "en": "A spark in the everyday"}, "info": {"ar": "شارع التخصصي، الرياض", "en": "Takhassusi St, Riyadh"}, "logo": null, "colors": {"primary": "#3A1D22", "onPrimary": "#F3E7D3", "secondary": "#9FE0C9", "background": "#2A1417", "accent": "#9FE0C9"}, "fonts": {"display": "Pacifico", "body": "IBM Plex Sans Arabic"}, "pattern": "none", "currency": {"ar": "ر.س", "en": "SAR"}, "demoBanner": true, "credit": "محمد", "mapsUrl": "https://maps.google.com/?cid=11654993593024510342", "reviewUrl": "https://maps.google.com/?cid=11654993593024510342", "instagram": "https://www.instagram.com/glim.coffee/", "categories": [{"id": "hot", "ar": "مشروبات حارة", "en": "Hot", "items": [{"ar": "سيقنتشر", "en": "Signature", "p": 25, "pick": true}, {"ar": "قهوة اليوم", "en": "Coffee of the Day", "p": 14}, {"ar": "قهوة مقطرة", "en": "Drip Coffee", "p": 20}, {"ar": "لاتيه", "en": "Latte", "p": 20}, {"ar": "فلات وايت", "en": "Flat White", "p": 18}, {"ar": "كابتشينو", "en": "Cappuccino", "p": 18}, {"ar": "كورتادو", "en": "Cortado", "p": 15}, {"ar": "أمريكانو", "en": "Americano", "p": 15}, {"ar": "إسبريسو", "en": "Espresso", "p": 13}]}, {"id": "cold", "ar": "مشروبات باردة", "en": "Cold", "items": [{"ar": "آيس سيقنتشر", "en": "Ice Signature", "p": 25}, {"ar": "إسبريسو ألفريدو", "en": "Espresso Alfredo", "p": 15, "dAr": "الفريدو ينذكر بكثرة بريفيوهاتكم", "dEn": "Freddo keeps coming up in your reviews"}, {"ar": "آيس دريب", "en": "Ice Drip", "p": 23}, {"ar": "آيس لاتيه", "en": "Ice Latte", "p": 20}, {"ar": "آيس ماتشا", "en": "Ice Matcha", "p": 25}, {"ar": "آيس فلات وايت", "en": "Ice Flat White", "p": 18}, {"ar": "آيس أمريكانو", "en": "Ice Americano", "p": 15}, {"ar": "شاي كركديه", "en": "Hibiscus Tea", "p": 23}]}, {"id": "sweet", "ar": "الحلا", "en": "Sweets", "items": [{"ar": "تيراميسو", "en": "Tiramisu", "p": 24, "sample": true, "pick": true, "dAr": "أكثر حلا ينذكر بريفيوهاتكم", "dEn": "Your most mentioned dessert"}, {"ar": "شوكو بايتس", "en": "Choco Bites", "p": 18, "sample": true}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


function renderHero(){
  $("heroInner").innerHTML=`<p class="wm">glim</p><div class="cubes" aria-hidden="true"><b>G</b><b>L</b><b>I</b><b>M</b></div><p class="tag">A spark in the everyday</p><p class="info">${esc((C.info||{})[lang]||"")}</p>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0; const ar=lang==="ar";
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch"><h2>${esc(L(c,"ar","en"))}</h2>${ar?`<span>${esc(c.en.toLowerCase())}</span>`:""}</div>`;
    if(c.id==="hot") html+=`<p class="milk">${ar?"حليب نباتي +٣ ر.س":"Vegan milk +3 SAR"}</p>`;
    for(const i of items){const ds=L(i,"dAr","dEn");
      html+=`<div class="r"><div class="tx"><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="st" title="${T[lang].pick}">✦</span>`:""}${i.sample?`<span class="sm">${ar?"سعر مثال":"sample"}</span>`:""}${ar?`<span class="en">${esc(i.en)}</span>`:""}${ds?`<span class="ds">${esc(ds)}</span>`:""}</div><span class="dots"></span><span class="pr">${fmt(i.p)} <small>${cur()}</small></span></div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: المشروبات والأسعار من منيوكم، وأسعار الحلا أمثلة لين نحط أسعاركم";
T.en.note="Preview: drinks and prices from your menu, dessert prices are samples until we add yours";
T.ar.search="وش مزاجك اليوم؟";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"glim-t9m8"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
