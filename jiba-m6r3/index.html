<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--terra:#a8653f;--terra2:#8a4f2f;--sand:#efe7dc;--paper:#f7f3ee;--card:#fffdf9;--ink:#2a211b;--soft:#867466;--line:#e7ddd0;--grey:#8f8a84}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15110e;--card:#1e1814;--ink:#f1e9df;--soft:#bba996;--line:#30271f;--terra:#d08a5f}}
:root[data-theme="dark"]{--paper:#15110e;--card:#1e1814;--ink:#f1e9df;--soft:#bba996;--line:#30271f;--terra:#d08a5f}
body{background:var(--paper);color:var(--ink);font-family:"Tajawal","Jost",system-ui,sans-serif}
html[lang=en] body{font-family:"Jost","Tajawal",sans-serif}
.demo-note{background:#2a211b;color:#efe7dc}
/* beige wall + dark round table + the cinnamon cup */
header{position:relative;text-align:center;background:#efe7dc;color:#2a211b;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 0;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#2a211b;color:#efe7dc;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "Jost";z-index:2}
#logo{display:inline-block;padding:.4rem 1.4rem;background:#efe7dc;direction:ltr}
.wm{font:500 3.6rem/1 "Jost";color:#8f8a84;letter-spacing:-.01em}
.wm i{font-style:normal;color:#a8653f}
.tg{margin:.6rem 0 0;font:500 .98rem "Tajawal"}
.info{font-size:.76rem;color:#867466;margin:.2rem 0 0}
.scene{display:block;width:200px;height:120px;margin:.8rem auto 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .86rem "Tajawal","Jost"}
.chip[aria-pressed="true"]{background:#a8653f;border-color:#a8653f;color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{display:flex;align-items:center;gap:.6rem;margin:0 0 .6rem;font:700 1.2rem "Tajawal","Jost"}
h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--terra);flex:0 0 auto}
h2 small{margin-inline-start:auto;font:400 .78rem "Jost";letter-spacing:.14em;color:var(--soft);text-transform:uppercase;direction:ltr}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:baseline;padding:.55rem 0;border-bottom:1px solid var(--line)}
.nm .a{font-weight:500}
.nm .e{display:block;font:400 .8rem "Jost";color:var(--soft);direction:ltr;text-align:right}
html[dir=ltr] .nm .e{text-align:left}
.pr{font:500 1rem "Jost";white-space:nowrap;direction:ltr;color:var(--terra)}
.pr small{font:400 .6rem "Tajawal";color:var(--soft);margin-inline-start:.2rem}
/* their dessert cards: name on a small card held by a fork */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.cd{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .4rem .5rem;text-align:center;position:relative}
.cd i{display:block;font:italic 500 .82rem "Jost";direction:ltr}
.cd .ar{display:block;font-size:.72rem;color:var(--soft)}
.cd svg{display:block;width:22px;height:34px;margin:.4rem auto 0}
.cd .pr{display:block;margin-top:.2rem;font-size:.9rem}
.h24{margin:2rem 0 0;text-align:center;font:500 .95rem "Tajawal";color:var(--soft)}
.h24 b{display:block;font:600 1.6rem "Jost";color:var(--terra);direction:ltr}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "تصور تجريبي — الأسعار والمشروبات أمثلة، أسماء الحلى من حساب جيبا", "note": "", "tg": "قهوة مختصة تصنع الفرق في يومك", "sw": "الحلى", "hl": "مفتوحين", "hr": "24 ساعة"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — prices and drinks are examples; dessert names are from Jiba's posts", "note": "", "tg": "Specialty coffee that makes a difference in your day", "sw": "Desserts", "hl": "Open", "hr": "24 hours"}};
let lang="ar", active="all", query="";
const KEY="jiba-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

const FK='<svg viewBox="0 0 22 34" aria-hidden="true" fill="none" stroke="#8f8a84" stroke-width="1.6" stroke-linecap="round"><path d="M5 2v8a6 6 0 0 0 12 0V2M11 2v8M11 16v16"/></svg>';
function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return c.id==="sweets" ? `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}${lang==="ar"?`<small>${esc(c.en)}</small>`:""}</h2><div class="cards">${body}</div></section>` : `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}${lang==="ar"?`<small>${esc(c.en)}</small>`:""}</h2>${body}</section>`; }
function item(i){ return i.card ? `<div class="cd"><i>${esc(i.en)}</i>${lang==="ar"?`<span class="ar">${esc(i.ar)}</span>`:""}${FK}<span class="pr">${P(i)}<small>${cur()}</small></span></div>` : `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}</span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<div class="h24">${T[lang].hl}<b>${T[lang].hr}</b></div>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
