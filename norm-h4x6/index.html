<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--bg:#3d3935;--bg2:#46423d;--ink:#ece6dc;--soft:#a79f93;--line:rgba(236,230,220,.14);--tag:#d9cfbf}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efebe4;--bg2:#e6e0d6;--ink:#2d2a27;--soft:#7c756b;--line:rgba(45,42,39,.14);--tag:#3d3935}}
:root[data-theme="light"]{--bg:#efebe4;--bg2:#e6e0d6;--ink:#2d2a27;--soft:#7c756b;--line:rgba(45,42,39,.14);--tag:#3d3935}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Space Mono",system-ui,sans-serif;font-weight:300}
html[lang=en] body{font-family:"Space Mono","IBM Plex Sans Arabic",monospace;font-size:15px}
.demo-note{background:var(--ink);color:var(--bg)}
header{position:relative;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.4rem 1.4rem;background:#3d3935;color:#ece6dc;text-align:start}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1.2rem;background:none;color:#ece6dc;border:1px solid #ece6dc;border-radius:0;padding:.2rem .8rem;cursor:pointer;min-height:36px;font:400 .76rem "Space Mono";z-index:2}
/* wide-tracked lowercase mono wordmark, the way they set everything */
#logo{display:inline-block;padding:.3rem .2rem;background:#3d3935;direction:ltr}
.wm{font:700 2.8rem/1 "Space Mono",monospace;letter-spacing:.02em}
.wm i{font-style:normal;color:#a79f93}
.sub{font:400 .72rem "Space Mono";letter-spacing:.5em;color:#a79f93;margin-top:.3rem}
.hrs{font:400 .78rem "Space Mono";letter-spacing:.18em;margin:1rem 0 0;color:#d9cfbf;direction:ltr;text-align:left}
.info{font-size:.8rem;color:#a79f93;margin:.35rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px dashed var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.4rem .4rem}
.search input{width:100%;border:1px dashed var(--soft);background:transparent;color:var(--ink);border-radius:0;padding:.5rem .8rem;font:inherit}
.search input::placeholder{color:var(--soft)}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--soft);padding:.25rem .6rem;cursor:pointer;min-height:36px;font:400 .8rem "Space Mono","IBM Plex Sans Arabic";text-transform:lowercase}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--ink)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:1px dashed var(--ink);outline-offset:3px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.4rem 1.5rem}
section{margin-top:2.2rem;scroll-margin-top:110px}
h2{margin:0 0 .7rem;font:700 .8rem "Space Mono";letter-spacing:.14em;text-transform:uppercase;color:var(--tag);direction:ltr;text-align:start}
h2 small{display:block;font:500 1.05rem "IBM Plex Sans Arabic";letter-spacing:0;text-transform:none;color:var(--ink);margin-top:.2rem;direction:rtl;text-align:start}
html[dir=rtl] h2{text-align:right}
html[dir=rtl] h2 small{text-align:right}
/* one line per item, spaced-out letters like their board */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.3rem 0}
.row .e{font:400 .88rem "Space Mono";letter-spacing:.22em;text-transform:lowercase;direction:ltr}
.row .a{font:400 .95rem "IBM Plex Sans Arabic";color:var(--soft)}
.pn{margin:2rem 0 0;font:400 .72rem "Space Mono";color:var(--soft);letter-spacing:.06em;border-top:1px dashed var(--line);padding-top:1rem}
html[lang=ar] .pn{font-family:"IBM Plex Sans Arabic";letter-spacing:0;font-size:.8rem}
.visit a{border-radius:0;border-style:dashed}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

const T = {"ar": {"dir": "rtl", "lang": "english", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "pn": "الأصناف من منيو نورم · الأسعار تنضاف في النسخة النهائية"}, "en": {"dir": "ltr", "lang": "العربية", "search": "what would you like?", "empty": "nothing matches that.", "all": "all", "demo": "", "note": "", "pn": "items from norm's menu · prices get added in the final version"}};
let lang="ar", active="all", query="";
const KEY="norm-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(c.en)}${lang==="ar"?`<small>${esc(c.ar)}</small>`:""}</h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="e">${esc(i.en)}</span>${lang==="ar"?`<span class="a">${esc(i.ar)}</span>`:""}</div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="pn">${T[lang].pn}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;

  renderChips(); renderMenu();
}

apply();
