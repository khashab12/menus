<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#8c8178">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--grey:#8c8178;--grey2:#6b6158;--cream:#f4efe7;--paper:#faf7f2;--card:#ffffff;--ink:#3d3731;--soft:#8c8178;--line:#ebe3d8;--glow:#f3d9a4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15130f;--card:#1e1b17;--ink:#f4efe7;--soft:#b9ada1;--line:#2e2a24;--grey2:#d8c9b6}}
:root[data-theme="dark"]{--paper:#15130f;--card:#1e1b17;--ink:#f4efe7;--soft:#b9ada1;--line:#2e2a24;--grey2:#d8c9b6}
body{background:var(--paper);color:var(--ink);font-family:"Tajawal","Cormorant Garamond",system-ui,sans-serif}
.demo-note{background:#6b6158;color:#f4efe7}
/* soft light rays fanning down from above the wordmark */
header{position:relative;text-align:center;color:#3d3731;padding:calc(env(safe-area-inset-top,0px) + 3.6rem) 1.2rem 2.2rem;overflow:hidden;
 background:radial-gradient(ellipse 60% 55% at 50% 0%,rgba(243,217,164,.75),transparent 70%),repeating-conic-gradient(from 160deg at 50% -10%,rgba(243,217,164,.35) 0 3deg,transparent 3deg 9deg),#f4efe7}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#3d3731;color:#f4efe7;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "Tajawal";z-index:2}
#logo{display:inline-block;padding:.6rem 1.4rem;background:transparent;direction:ltr}
.wm{font:500 3.1rem/1 "Cormorant Garamond";letter-spacing:.42em;margin-inline-start:.42em;color:#8c8178}
.ws{font:500 .72rem "Tajawal";letter-spacing:.5em;margin-inline-start:.5em;color:#8c8178;margin-top:.45rem}
.tg{margin:1rem 0 0;font:500 1.05rem "Tajawal";color:#3d3731}
.info{font-size:.76rem;color:#8c8178;margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .85rem "Tajawal"}
.chip[aria-pressed="true"]{background:#8c8178;border-color:#8c8178;color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--grey);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2.2rem;scroll-margin-top:120px}
/* each heading sits under a small sunrise of rays */
h2{text-align:center;margin:0 0 .8rem;font:500 1.6rem "Cormorant Garamond";letter-spacing:.3em;text-transform:uppercase;color:var(--grey2);direction:ltr}
h2 svg{display:block;width:56px;height:22px;margin:0 auto .3rem}
h2 small{display:block;font:500 .9rem "Tajawal";letter-spacing:0;text-transform:none;color:var(--soft)}
.row{display:flex;align-items:baseline;gap:.5rem;padding:.55rem .2rem}
.nm{flex:0 1 auto}
.nm .a{display:block;font-weight:500}
.nm .e{display:block;font:500 .88rem "Cormorant Garamond";color:var(--soft);direction:ltr;text-align:right}
html[dir=ltr] .nm .e{text-align:left}
.dots{flex:1;border-bottom:1px dotted var(--grey);opacity:.6;transform:translateY(-4px)}
.pr{font:600 1.15rem "Cormorant Garamond";white-space:nowrap;direction:ltr}
.pr small{font:400 .62rem "Tajawal";color:var(--soft);margin-inline-start:.2rem}
.hrs{margin:2.2rem 0 0;text-align:center;font:500 .9rem "Tajawal";color:var(--soft)}
.hrs b{display:block;font:500 1.5rem "Cormorant Garamond";letter-spacing:.2em;color:var(--grey2);direction:ltr}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<nav class="visit" id="visit" hidden></nav>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>

const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "تصور تجريبي — الأصناف والأسعار أمثلة وليست منيو لايت", "note": "", "tg": "لايت كونسبت كوفي", "hl": "مفتوحين يوميًا", "hrs": "6AM – 12AM"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — items and prices are examples, not LIGHT's menu", "note": "", "tg": "Light Concept Coffee", "hl": "Open daily", "hrs": "6AM – 12AM"}};
let lang="ar", active="all", query="";
const KEY="light-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

const RAYS='<svg viewBox="0 0 56 22" aria-hidden="true"><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".7"><path d="M28 2v6M14 6l3 5M42 6l-3 5M4 14l6 3M52 14l-6 3"/></g><path d="M16 21a12 12 0 0 1 24 0" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${RAYS}${esc(c.en)}${lang==="ar"?`<small>${esc(c.ar)}</small>`:""}</h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}</span><span class="dots"></span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<div class="hrs">${T[lang].hl}<b>${T[lang].hrs}</b></div>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
