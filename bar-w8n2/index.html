<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو بار</title>
<meta name="description" content="Meet Me In BAR!">
<meta property="og:title" content="منيو بار">
<meta property="og:description" content="Meet Me In BAR!">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/bar-w8n2/">
<meta property="og:image" content="https://khashab12.github.io/menus/bar-w8n2/logo.png">
<meta name="theme-color" content="#4a1f1b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Alexandria:wght@200;300;400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--choc:#2a1a14;--leather:#4a1f1b;--wood:#6b3a22;--cream:#efe6da;--ink:#efe6da;--soft:#b9a595;--line:rgba(239,230,218,.16);--card:rgba(255,255,255,.04);--tan:#c79a6f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--choc:#1a100c;--card:rgba(255,255,255,.035)}}
:root[data-theme="dark"]{--choc:#1a100c}
body{background:var(--choc);color:var(--ink);font-family:"Alexandria","Jost",system-ui,sans-serif;font-weight:300}
html[lang=en] body{font-family:"Jost","Alexandria",sans-serif}
.demo-note{background:var(--leather);color:var(--cream)}
/* oxblood leather header: stitched panels like their sofa */
header{position:relative;text-align:center;color:#efe6da;padding:calc(env(safe-area-inset-top,0px) + 3.4rem) 1.2rem 2.2rem;
 background:radial-gradient(120% 80% at 50% 0%,#5b2620 0%,#3d1915 60%,#2a1a14 100%)}
header::after{content:"";position:absolute;left:1.2rem;right:1.2rem;bottom:1rem;height:0;border-top:1.5px dashed rgba(239,230,218,.25)}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:none;color:#efe6da;border:1px solid rgba(239,230,218,.35);border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:400 .8rem "Jost";letter-spacing:.06em;z-index:2}
#logo{display:inline-grid;place-items:center;width:150px;height:150px;border-radius:50%;background:#2a1a14;border:1px solid rgba(239,230,218,.25);direction:ltr}
.wm{font:300 2.6rem/1 "Jost";letter-spacing:.06em;color:#efe6da;position:relative}
.wm sup{font-size:.32em;position:absolute;top:.1em;right:-.7em}
.stool{display:block;width:22px;height:22px;margin:.3rem auto 0}
.tg{margin:1.2rem 0 0;font:300 1.35rem "Jost";letter-spacing:.02em;direction:ltr}
.info{font-size:.76rem;color:#b9a595;margin:.4rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--choc);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.search input::placeholder{color:var(--soft)}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:none;color:var(--soft);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:400 .84rem "Jost","Alexandria"}
.chip[aria-pressed="true"]{background:var(--cream);color:#2a1a14;border-color:var(--cream)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{margin:0 0 1rem;font:300 .78rem "Jost";letter-spacing:.3em;text-transform:uppercase;color:var(--soft);direction:ltr;text-align:center}
h2 span{display:block;font:300 .95rem "Alexandria";letter-spacing:0;text-transform:none;margin-top:.2rem}
/* each dessert is a "plate card": wood/leather/stone surfaces from their menu photos */
.plate{position:relative;border-radius:18px;padding:1.3rem 1.2rem 1.4rem;margin-bottom:.8rem;overflow:hidden;direction:ltr;min-height:150px}
.plate:nth-child(4n+1){background:linear-gradient(160deg,#5a2520,#3a1714)}
.plate:nth-child(4n+2){background:linear-gradient(160deg,#5d5753,#2f2b29)}
.plate:nth-child(4n+3){background:linear-gradient(160deg,#3a241b,#1f130e)}
.plate:nth-child(4n+4){background:linear-gradient(160deg,#cfc6bb,#a89c90);color:#2a1a14}
.plate .n{font:300 .78rem "Jost";opacity:.85;position:absolute;top:1.45rem;left:1.2rem}
.plate .t{font:300 1.9rem/1.05 "Jost";margin-left:2rem;max-width:12ch}
.plate .ta{display:block;font:300 1rem "Alexandria";margin:.45rem 0 0 2rem;direction:rtl;text-align:left}
.plate .d{font:300 .74rem "Jost";margin:.6rem 0 0 2rem;opacity:.85;letter-spacing:.02em}
.plate .da{font:300 .74rem "Alexandria";margin:.4rem 0 0 2rem;opacity:.85;direction:rtl;text-align:left}
/* a plate drawn in the corner */
.plate::after{content:"";position:absolute;right:-26px;bottom:-26px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14) 0 44%,rgba(255,255,255,.28) 45% 50%,rgba(255,255,255,.08) 51% 100%)}
.plate .ic{position:absolute;right:16px;bottom:14px;width:18px;height:18px;opacity:.75;z-index:1}
.hours{border:1px solid var(--line);border-radius:18px;padding:1.2rem;background:linear-gradient(160deg,#6b3a22,#4a2617);direction:ltr}
.hours .n{font:300 .78rem "Jost";opacity:.85}
.hours .t{font:300 1.7rem "Jost";margin:.2rem 0 .1rem}
.hours .s{font:300 .8rem "Jost";opacity:.8}
.hours .g{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1rem}
.hours b{display:block;font:400 .82rem "Jost"}
.hours i{font-style:normal;font:300 .82rem "Jost";opacity:.9}
.nt{margin:1.4rem 0 0;text-align:center;font-size:.76rem;color:var(--soft);line-height:1.9}
.visit a{border-radius:999px;border-color:var(--line);color:var(--ink)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><div><div class="wm">BAR<sup>®</sup></div><svg class="stool" viewBox="0 0 24 24" fill="none" stroke="#efe6da" stroke-width="1.6" aria-hidden="true"><path d="M5 6h14M7 6l-2 14M17 6l2 14M10 6l-1 14M14 6l1 14M6.4 13h11.2"/></svg></div></div>
  <p class="tg">Meet Me In BAR!</p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<nav class="visit" id="visit" hidden></nav>

  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;

  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
