<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--peach:#fdeee3;--beige:#ede3d6;--lav:#b3b0ee;--lav2:#cdcaf5;--brick:#97493b;--orange:#f47a2a;--ink:#1c1a1a;--soft:#6e6560;--card:#fff9f4;--line:#eadbcf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--peach:#1d1a1f;--beige:#171518;--card:#242027;--ink:#f5ece4;--soft:#b5aba4;--line:#36303a;--lav2:#3a3761}}
:root[data-theme="dark"]{--peach:#1d1a1f;--beige:#171518;--card:#242027;--ink:#f5ece4;--soft:#b5aba4;--line:#36303a;--lav2:#3a3761}
body{background:var(--peach);color:var(--ink);font-family:"Tajawal","Barlow",system-ui,sans-serif}
html[lang=en] body{font-family:"Barlow","Tajawal",sans-serif}
.demo-note{background:var(--brick);color:#fff}
header{position:relative;text-align:center;background:#ede3d6;color:#1c1a1a;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 1.4rem;overflow:hidden}
/* their side color strips: black / brick / orange */
header::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:10px;background:linear-gradient(#1c1a1a 0 30%,#97493b 30% 70%,#f47a2a 70%)}
header::after{content:"";position:absolute;inset-inline-end:0;top:0;bottom:0;width:10px;background:#b3b0ee}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1.4rem;background:#1c1a1a;color:#ede3d6;border:0;border-radius:3px;padding:.25rem .9rem;cursor:pointer;min-height:36px;font:600 .8rem "Barlow";z-index:2}
#logo{display:inline-block;padding:.4rem 1rem;background:#ede3d6;direction:ltr}
.wm{font:800 3.6rem/1 "Barlow";letter-spacing:.01em;color:#1c1a1a}
.wm span{position:relative;display:inline-block}
.wm span::before{content:"";position:absolute;left:52%;top:.02em;width:.17em;height:.2em;background:#1c1a1a;transform:skewX(-18deg)}
.mt{font:800 1.2rem/1 "Barlow";letter-spacing:.06em;color:#b3b0ee;margin-top:.1rem}
.tg{margin:.8rem 0 0;font:600 1rem "Barlow";letter-spacing:.14em;text-transform:uppercase;direction:ltr}
.info{font-size:.8rem;color:#6e6560;margin:.3rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--peach);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:3px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--lav2);color:var(--ink);border-radius:3px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:600 .84rem "Barlow","Tajawal";position:relative}
.chip[aria-pressed="true"]{background:var(--brick);color:#fff}
.chip[aria-pressed="true"]::before{content:"";position:absolute;top:-5px;inset-inline-start:0;width:40%;height:5px;background:var(--orange)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:1.9rem;scroll-margin-top:120px;background:var(--card);border-radius:4px;padding:0 0 .4rem;box-shadow:0 1px 0 var(--line)}
/* header bar exactly like their menu: orange tab on top of a solid bar, then a two-tone rule */
h2{position:relative;display:flex;justify-content:space-between;align-items:center;margin:0 0 .5rem;padding:.55rem .9rem;color:#fff;font:700 1rem "Tajawal";border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--orange) 0 55%,var(--ink) 55%) 1}
h2::before{content:"";position:absolute;top:-7px;inset-inline-start:0;width:62px;height:7px;background:var(--orange)}
h2 small{font:600 .85rem "Barlow";letter-spacing:.08em;text-transform:uppercase;direction:ltr}
section:nth-of-type(3n+1) h2{background:var(--lav);color:#1c1a1a}
section:nth-of-type(3n+2) h2{background:var(--brick)}
section:nth-of-type(3n) h2{background:#1c1a1a}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:center;padding:.5rem .9rem;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.nm .a{display:block;font-weight:500}
.nm .e{display:block;font:500 .8rem "Barlow";color:var(--soft);direction:ltr;text-align:start}
html[dir=rtl] .nm .e{text-align:right}
.nm .c{display:block;font:500 .66rem "Barlow";color:var(--soft);letter-spacing:.06em;margin-top:.05rem}
.pr{font:700 1.05rem "Barlow";white-space:nowrap;direction:ltr}
.pr small{font:500 .64rem "Barlow";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.qt{margin:1.6rem .4rem 0;text-align:center;font-size:.85rem;color:var(--brick)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qt{color:#e59a8c}}
.qt span{display:block;font:600 .66rem "Barlow";letter-spacing:.12em;margin-top:.3rem;color:var(--orange)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "cal": "سعرة"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "cal": "CAL"}};
let lang="ar", active="all", query="";
const KEY="hezi-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2><span>${esc(c.ar)}</span><small>${esc(c.en)}</small></h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}${i.c!=null?`<span class="c">${fmt(i.c)} ${T[lang].cal}</span>`:""}</span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="qt">صنعت كل تفصيلة بحب، لتكون قهوتك هي ملاذك الهادي<span>EVERY DETAIL CRAFTED WITH LOVE, TO BE YOUR QUIET REFUGE</span></p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;

  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;

  renderChips(); renderMenu();
}

apply();
