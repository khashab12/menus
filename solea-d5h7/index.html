<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو سوليا</title>
<meta name="description" content="لحظات من السعادة.. تُصنع بحب">
<meta property="og:title" content="منيو سوليا">
<meta property="og:description" content="لحظات من السعادة.. تُصنع بحب">
<meta property="og:type" content="website">
<meta property="og:image" content="https://khashab12.github.io/menus/solea-d5h7/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://khashab12.github.io/menus/solea-d5h7/og.png">
<meta property="og:url" content="https://khashab12.github.io/menus/solea-d5h7/">
<meta name="theme-color" content="#B5576A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--rose:#B5576A;--rose2:#9e4558;--blush:#E9C6C2;--blush2:#F6E1DE;--grey:#5E6166;--grey2:#45484c;--paper:#fff;--bg:#FBF3F1;--ink:#2b2224;--muted:#7b6a6d;--line:rgba(181,87,106,.18);
 --script:"Great Vibes",cursive;--body:"Tajawal",system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);font-family:var(--body)}
.demo-note{background:var(--grey2);color:#fff}
header.hero{position:relative;overflow:hidden;background:var(--grey);color:#fff;padding:1.2rem 1rem 1.1rem}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:.2rem .8rem;font:600 .78rem var(--body);cursor:pointer}
.hero-c{text-align:center;padding-top:1.4rem}
.sun{width:46px;height:46px;margin:0 auto -6px;display:block}
.wm{direction:ltr;font:400 3.6rem/1.1 var(--script);margin:0;color:#ffe9e5;text-shadow:0 0 18px rgba(255,200,190,.5)}
.tag{margin:.2rem 0 0;color:var(--blush);font-weight:700}
.lane{display:flex;align-items:center;gap:.6rem;max-width:360px;margin:1rem auto 0;background:rgba(255,255,255,.1);border-radius:999px;padding:.4rem .5rem .4rem .9rem}
.lane .car{width:40px;height:22px;flex:0 0 auto}
.lane p{margin:0;font-size:.82rem;text-align:start}
.dash{flex:1;height:2px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 14px);opacity:.6}
.dt{flex:0 0 auto;background:var(--rose);border-radius:8px;padding:.1rem .45rem;font:800 .62rem var(--body);line-height:1.2}
.info{font-size:.8rem;color:#e8dfe0;margin:.7rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:rgba(251,243,241,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1.5px solid var(--rose);background:#fff;color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:1rem var(--body)}
.search input:focus-visible{outline:2px solid var(--grey)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--rose);background:transparent;color:var(--rose);border-radius:999px;padding:.25rem .85rem;font:700 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--rose);color:#fff}
.chip:focus-visible{outline:2px solid var(--grey);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.5rem}
.ch{text-align:center;margin-bottom:.8rem}
.ch h2{margin:0;font:800 1.2rem var(--body);color:var(--rose)}
.ch h2::before,.ch h2::after{content:"♥";font-size:.7rem;margin:0 .45rem;vertical-align:middle}
.ch span{direction:ltr;display:block;font:400 1.2rem var(--script);color:var(--grey)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.box{position:relative;background:#fff;border:1.5px solid var(--blush);border-radius:14px;padding:.8rem .75rem .7rem;display:flex;flex-direction:column}
.box .no{position:absolute;top:-.6rem;inset-inline-start:.6rem;background:var(--rose);color:#fff;border-radius:6px;padding:0 .4rem;font:800 .72rem var(--body)}
.box .best{position:absolute;top:-.6rem;inset-inline-end:.6rem;background:var(--grey);color:#fff;border-radius:999px;padding:0 .45rem;font:700 .64rem var(--body)}
.box .nm{font:800 .95rem/1.35 var(--body);margin-top:.2rem}
.box .en{direction:ltr;display:block;font-size:.7rem;color:var(--muted)}
.box .ds{font-size:.74rem;color:var(--muted);margin:.25rem 0 0}
.box .pr{margin-top:auto;padding-top:.5rem;align-self:flex-end;background:var(--rose);color:#fff;border-radius:8px;padding:.15rem .55rem;font:800 .9rem var(--body)}
.box .sm{font-size:.6rem;color:var(--rose);font-weight:700}
.list .row{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;background:#fff;border-radius:12px;padding:.6rem .8rem;margin-bottom:.45rem;border:1px solid var(--line);align-items:center}
.list .nm{font:700 .98rem var(--body)}
.list .en{direction:ltr;display:block;font-size:.72rem;color:var(--muted)}
.list .ds{grid-column:1/-1;font-size:.74rem;color:var(--muted)}
.list .pr{font:800 1rem var(--body);color:var(--rose)}
.list .sm{font-size:.6rem;color:var(--rose);font-weight:700;margin-inline-start:.3rem}
.heart{color:var(--rose);margin-inline-start:.3rem}
.visit a{background:#fff;color:var(--rose);border:1.5px solid var(--rose);border-radius:999px}
.visit a.wa{background:var(--rose);color:#fff}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem}
footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "Solea", "nameAr": "سوليا", "tagline": {"ar": "لحظات من السعادة.. تُصنع بحب", "en": "Moments of happiness, made with love"}, "info": {"ar": "درايف ثرو · شارع الأمير متعب بن عبدالعزيز، الصفا، الرياض", "en": "Drive-thru · Prince Mutaib St, Al Safa, Riyadh"}, "logo": null, "colors": {"primary": "#B5576A", "onPrimary": "#FFFFFF", "secondary": "#5E6166", "background": "#FBF3F1", "accent": "#E9C6C2"}, "fonts": {"display": "Great Vibes", "body": "Tajawal"}, "pattern": "none", "currency": {"ar": "ر.س", "en": "SAR"}, "demoBanner": true, "credit": "محمد", "whatsapp": "966543630066", "mapsUrl": "https://maps.google.com/?cid=11513468935962156545", "reviewUrl": "https://maps.google.com/?cid=11513468935962156545", "categories": [{"id": "boxes", "ar": "البوكسات", "en": "Boxes", "items": [{"ar": "بوكس ميني كوكيز + ٤ قهوة", "en": "Mini Cookies Box + 4 coffees", "p": 50, "n": "02", "best": true, "dAr": "ميني كوكيز طازج مع ٤ أكواب قهوة", "dEn": "Fresh mini cookies with 4 cups of coffee"}, {"ar": "بوكس سكوب كوكيز + ٤ قهوة", "en": "Scoop Cookies Box + 4 coffees", "p": 55, "n": "04", "dAr": "سكوب كوكيز دافئ مع ٤ أكواب قهوة", "dEn": "Warm scoop cookies with 4 cups of coffee"}, {"ar": "ميني بولز بيتفور بالشوكولاته والفستق", "en": "Mini Petit Four Balls, chocolate & pistachio", "p": 55, "n": "03", "dAr": "تشكيلة بولز بيتفور فاخرة", "dEn": "A fine assortment of petit four balls"}, {"ar": "بوكس مكس تشيز", "en": "Mixed Cheesecake Box", "p": 70, "n": "01", "dAr": "تشكيلة فاخرة من التشيز كيك بنكهات متنوعة", "dEn": "Assorted cheesecakes in different flavours"}]}, {"id": "coffee", "ar": "القهوة", "en": "Coffee", "items": [{"ar": "قهوة اليوم", "en": "Coffee of the Day", "p": 9, "sample": true}, {"ar": "آيس تيراميسو", "en": "Iced Tiramisu", "p": 18, "sample": true, "pick": true}, {"ar": "سبانش لاتيه", "en": "Spanish Latte", "p": 16, "sample": true}, {"ar": "اسبريسو", "en": "Espresso", "p": 9, "sample": true}]}, {"id": "sweet", "ar": "الحلا", "en": "Desserts", "items": [{"ar": "كوكيز", "en": "Cookies", "p": 8, "sample": true, "pick": true, "dAr": "أكثر شي ينذكر بريفيوهاتكم", "dEn": "The most mentioned item in your reviews"}, {"ar": "تيراميسو كوكونت", "en": "Coconut Tiramisu", "p": 16, "sample": true}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const SUN=`<svg class="sun" viewBox="0 0 46 46" aria-hidden="true"><g stroke="#E9C6C2" stroke-width="2" stroke-linecap="round"><path d="M23 6v6M14 9l3 5M32 9l-3 5M8 16l5 3M38 16l-5 3"/></g><path d="M11 28a12 12 0 0 1 24 0z" fill="#E9C6C2"/></svg>`;
const CAR=`<svg class="car" viewBox="0 0 40 22" aria-hidden="true"><path d="M4 15l3-7c1-2 2-3 4-3h14c2 0 3 1 4 3l3 7v4H4z" fill="#E9C6C2"/><circle cx="11" cy="19" r="3" fill="#fff"/><circle cx="29" cy="19" r="3" fill="#fff"/><path d="M11 7h7v5H9zM21 7h6l2 5h-8z" fill="#5E6166"/></svg>`;
function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`<div class="hero-c">${SUN}<p class="wm">Solea</p><p class="tag">${esc((C.tagline||{})[lang]||"")}</p>
   <div class="lane">${CAR}<p>${ar?"اختار طلبك وأنت بالسيارة قبل توصل الشباك":"Pick your order from the car before you reach the window"}</p><span class="dash"></span><span class="dt">DRIVE<br>THRU</span></div>
   <p class="info">${esc((C.info||{})[lang]||"")}</p></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0; const ar=lang==="ar";
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch"><h2>${esc(L(c,"ar","en"))}</h2>${ar?`<span>${esc(c.en)}</span>`:""}</div>`;
    if(c.id==="boxes"){
      html+=`<div class="grid">`+items.map(i=>`<article class="box"><span class="no">${esc(i.n)}</span>${i.best?`<span class="best">${ar?"الأكثر طلباً":"Most ordered"}</span>`:""}<span class="nm">${esc(L(i,"ar","en"))}</span>${ar?`<span class="en">${esc(i.en)}</span>`:""}<p class="ds">${esc(L(i,"dAr","dEn"))}</p><span class="pr">${fmt(i.p)} ${cur()}</span></article>`).join("")+`</div>`;
    } else {
      html+=`<div class="list">`+items.map(i=>{const ds=L(i,"dAr","dEn");return `<div class="row"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="heart" title="${T[lang].pick}">♥</span>`:""}${i.sample?`<span class="sm">${ar?"سعر مثال":"sample"}</span>`:""}${ar?`<span class="en">${esc(i.en)}</span>`:""}</div><span class="pr">${fmt(i.p)} ${cur()}</span>${ds?`<span class="ds">${esc(ds)}</span>`:""}</div>`}).join("")+`</div>`;
    }
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: البوكسات وأسعارها من شاشة الدرايف ثرو عندكم، والقهوة والحلا من الريفيوهات وأسعارها أمثلة لين نحط أسعاركم";
T.en.note="Preview: boxes and prices from your drive-thru screen; coffee and desserts from reviews with sample prices until we add yours";
T.ar.search="وش تبي اليوم؟";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"solea-d5h7"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
