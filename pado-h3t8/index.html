<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--green:#2f5a3a;--green2:#244a2e;--sage:#d5ddd3;--paper:#ffffff;--card:#ffffff;--ink:#1f2a22;--soft:#6b766d;--line:#e3e8e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1611;--card:#162019;--ink:#eef2ec;--soft:#a6b2a8;--line:#24302a;--green:#8fc29b;--sage:#223027}}
:root[data-theme="dark"]{--paper:#0f1611;--card:#162019;--ink:#eef2ec;--soft:#a6b2a8;--line:#24302a;--green:#8fc29b;--sage:#223027}
body{background:var(--paper);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif}
html[lang=en] body{font-family:"Tajawal",sans-serif}
.demo-note{background:#2f5a3a;color:#fff}
header{position:relative;text-align:center;background:#fff;color:#2f5a3a;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.4rem;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#2f5a3a;color:#fff;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "Tajawal";z-index:2}
/* the loose swirl lines from their menu corners */
.sw{position:absolute;pointer-events:none;fill:none;stroke:#2f5a3a;stroke-width:2.2}
.sw.a{top:6px;inset-inline-start:-18px;width:120px;height:90px}
.sw.b{bottom:-10px;inset-inline-end:-14px;width:120px;height:80px}
#logo{display:inline-block;padding:.4rem 1.4rem;background:#fff;direction:ltr}
.pour{display:block;width:84px;height:56px;margin:0 auto -.2rem}
.wm{font:900 3.6rem/1 "Fraunces";color:#2f5a3a;letter-spacing:-.01em}
.wa{font:700 1rem "Tajawal";color:#2f5a3a;margin-top:.15rem}
.slog{display:flex;align-items:center;gap:.7rem;max-width:300px;margin:1rem auto 0;font:500 .72rem "Bricolage Grotesque";letter-spacing:.12em;color:#4a554c;direction:ltr}
.slog i{flex:1;height:1px;background:#2f5a3a}
.info{font-size:.76rem;color:#6b766d;margin:.5rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--green);background:none;color:var(--green);border-radius:999px;padding:.28rem 1rem;cursor:pointer;min-height:36px;font:500 .86rem "Tajawal"}
.chip[aria-pressed="true"]{background:#2f5a3a;border-color:#2f5a3a;color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
/* big bold MENU wordmark */
.big{margin:1.2rem 0 0;text-align:center;font:800 4.4rem/0.9 "Bricolage Grotesque";color:var(--green);letter-spacing:-.02em;direction:ltr}
section{margin-top:1.8rem;scroll-margin-top:120px}
/* sage band headers, EN left / AR right like their board */
h2{display:flex;justify-content:center;gap:1.4rem;margin:0 -1.2rem .6rem;padding:.35rem 1rem;background:var(--sage);font:700 1.05rem "Tajawal";color:var(--ink)}
h2 .en{font:700 1rem "Bricolage Grotesque";direction:ltr}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:baseline;padding:.5rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm .a{display:block;font-weight:700}
.nm .e{display:block;font:500 .78rem "Bricolage Grotesque";color:var(--soft);direction:ltr;text-align:right}
html[dir=ltr] .nm .e{text-align:left}
.pr{font:700 1rem "Bricolage Grotesque";color:var(--green);white-space:nowrap;direction:ltr}
.pr small{font:400 .6rem "Tajawal";color:var(--soft);margin-inline-start:.2rem}
.sz{display:block;font-size:.66rem;color:var(--soft);text-align:end}
.sl{margin:0 .15rem;color:var(--soft)}
.nt{margin:1.6rem 0 0;text-align:center;font-size:.76rem;color:var(--soft)}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "nt": "الأصناف والأسعار من منيو بادو المنشور"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "nt": "Items and prices from Pado's published menu"}};
let lang="ar", active="all", query="";
const KEY="pado-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2><span class="en">${esc(c.en)}</span><span>${esc(c.ar)}</span></h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}</span><span><span class="pr">${P(i)}<small>${cur()}</small></span>${i.p2!=null?`<span class="sz">M / L</span>`:""}</span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("afterbegin",`<div class="big">MENU</div>`); $("menu").insertAdjacentHTML("beforeend",`<p class="nt">${T[lang].nt}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));

function apply(){

    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);

  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
