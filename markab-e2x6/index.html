<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو مَركب</title>
<!--__META__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<style>
:root{--primary:#2a2826;--on-primary:#efe7d8;--secondary:#c2a064;--bg:#1d1c1a;--accent:#c2a064;--ink:#efe7d8;--muted:#a79f92;--card:#262422;--line:#3a3733;
--display:system-ui;--body:system-ui;color-scheme:dark}
:root[data-theme="light"]{--bg:#f3eee5;--ink:#22201d;--muted:#6f675c;--card:#fbf8f2;--line:#e0d8ca;--primary:#2a2826}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lang:focus-visible,.chip:focus-visible,.search input:focus-visible,.visit a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;max-width:720px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;cursor:pointer;white-space:nowrap}
.search{max-width:720px;margin:0 auto;padding:0 1rem}
.search input{width:100%;font:1rem var(--body)}
main{max-width:720px;margin:0 auto}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem}
.cal{color:var(--muted);font-size:.78rem;margin:0}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.85rem 1rem;font-weight:600;text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:1.4rem 1rem 2.4rem}
footer strong{color:var(--ink)}
.pat{display:none}

body{counter-reset:cat}
.demo-note{background:var(--secondary);color:#1d1c1a;text-align:center;font-size:.8rem;padding:.45rem 1rem}
header.hero{position:relative;padding:3rem 1.25rem 2rem;text-align:center;background:#2a2826;color:#efe7d8}
.hero-inner{max-width:560px;margin:0 auto}
.logo{width:120px;height:120px;border-radius:0;object-fit:cover;display:block;margin:0 auto .6rem}
.brand{font-family:var(--display);font-weight:400;letter-spacing:.35em;font-size:1rem;margin:.4rem 0 0;color:var(--secondary);text-transform:uppercase}
.tag{margin:.6rem 0 0;font-size:.9rem;color:#cfc6b6}
.info{margin:.5rem auto 0;font-size:.8rem;color:#a79f92}
.wave{display:block;width:180px;height:18px;margin:1.2rem auto 0}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;background:transparent;color:#c2a064;border:1px solid #c2a064;border-radius:0;padding:.3rem .8rem;font:500 .8rem var(--body);cursor:pointer;letter-spacing:.08em}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:.8rem 0 .5rem;border-bottom:1px solid var(--line)}
.search input{border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:.55rem .2rem}
.chips{gap:1.2rem;padding:.55rem 1rem 0}
.chip{border:0;background:none;color:var(--muted);padding:.2rem 0;font:500 .9rem var(--body);border-bottom:1px solid transparent}
.chip[aria-pressed="true"]{color:var(--secondary);border-bottom-color:var(--secondary)}
main{padding:.5rem 1.2rem 2rem}
section.cat{margin-top:2.6rem;counter-increment:cat}
.cat h2{font-family:var(--display);font-weight:300;font-size:2.3rem;line-height:1;margin:0 0 1rem;display:flex;align-items:flex-end;gap:.8rem}
.cat h2::before{content:counter(cat,decimal-leading-zero);font-size:.8rem;color:var(--secondary);letter-spacing:.15em;padding-bottom:.35rem}
.cat .sub{color:var(--muted);font-size:.85rem;margin:-.6rem 0 .6rem}
.item{display:grid;grid-template-columns:1fr auto;gap:.1rem 1rem;padding:.95rem 0;border-bottom:1px solid var(--line)}
.name{font-weight:500;font-size:1.05rem}
.desc{grid-column:1/2;color:var(--muted);font-size:.84rem;margin:0}
.price{font-family:var(--display);color:var(--secondary);white-space:nowrap}
.cal{grid-column:1/-1}
.pick{display:inline-block;margin-inline-start:.45rem;font-size:.64rem;letter-spacing:.12em;color:var(--secondary);border:1px solid var(--secondary);padding:0 .4rem;vertical-align:middle}
.visit a{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:0;letter-spacing:.04em}
.visit a.wa{border-color:var(--secondary);color:var(--secondary)}
</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<header class="hero">
  <div class="pat" id="pat" aria-hidden="true"></div>
  <button class="lang" id="langBtn">English</button>
  <div class="hero-inner" id="heroInner"></div>
  <svg class="wave" viewBox="0 0 180 18" aria-hidden="true"><path d="M0 9 Q15 0 30 9 T60 9 T90 9 T120 9 T150 9 T180 9" fill="none" stroke="#c2a064" stroke-width="1.5"/></svg>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

function renderHero(){

  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>

}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}

  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
