<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو ألِز</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<style>
:root{color-scheme:light}
:root{--primary:#683838;--on-primary:#faf6ea;--secondary:#8a4c4c;--bg:#faf6ea;--accent:#d9b99b;--ink:#2d1818;--muted:#6c534c;--card:#ffffff;--line:#eee3d3;
--display:system-ui;--body:system-ui}
:root[data-theme="dark"]{--bg:#171010;--ink:#f6ecde;--muted:#bba49b;--card:#221818;--line:#352626}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lang:focus-visible,.chip:focus-visible,.search input:focus-visible,.visit a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;max-width:720px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;cursor:pointer;white-space:nowrap}
.search{max-width:720px;margin:0 auto;padding:0 1rem}
.search input{width:100%;font:1rem var(--body)}
main{max-width:720px;margin:0 auto}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem}
.cal{color:var(--muted);font-size:.78rem;margin:0}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.85rem 1rem;font-weight:600;text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:1.4rem 1rem 2.4rem}
footer strong{color:var(--ink)}
.pat{display:none}

body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
.demo-note{background:var(--accent);color:#2d1818;text-align:center;font-size:.8rem;padding:.45rem 1rem}
header.hero{position:relative;padding:1.2rem 1rem 1rem}
.hero-inner{display:flex;align-items:center;gap:.9rem;max-width:720px;margin:0 auto}
.logo{width:74px;height:74px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:3px solid var(--primary)}
.brand{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;color:var(--primary)}
:root[data-theme="dark"]{}
.brand.small{font-size:1.5rem}
.tag{margin:0;color:var(--muted);font-size:.9rem}
.info{margin:.1rem 0 0;font-size:.8rem;color:var(--muted)}
.open{display:inline-block;margin-top:.25rem;background:#e7f4e8;color:#1f6a2a;font-size:.72rem;font-weight:700;border-radius:999px;padding:.1rem .55rem}
.lang{position:absolute;top:1.2rem;left:1rem;background:var(--card);color:var(--primary);border:1px solid var(--line);border-radius:10px;padding:.3rem .7rem;font:600 .8rem var(--body);cursor:pointer}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--primary);padding:.55rem 0 calc(env(safe-area-inset-bottom,0px) + .55rem);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.bar .search{display:none}
.chips{padding:0 .8rem}
.chip{border:0;background:transparent;color:rgba(250,246,234,.7);border-radius:12px;padding:.55rem .95rem;font:700 .9rem var(--body)}
.chip[aria-pressed="true"]{background:var(--on-primary);color:var(--primary)}
.search2{max-width:720px;margin:0 auto;padding:0 1rem}
.search2 input{width:100%;border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:.8rem 1rem;font:1rem var(--body);box-shadow:0 1px 0 var(--line)}
main{padding:.2rem 1rem 1.5rem}
section.cat{margin-top:1.4rem}
.cat h2{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0 0 .5rem;color:var(--primary)}
.cat .sub{color:var(--muted);font-size:.84rem;margin:-.3rem 0 .5rem}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:.05rem .8rem;align-items:center;background:var(--card);border-radius:16px;padding:.75rem .85rem;margin-bottom:.55rem;box-shadow:0 1px 0 var(--line)}
.item::before{content:"";grid-row:span 3;width:44px;height:44px;border-radius:12px;background:var(--line) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23683838' stroke-width='1.6' stroke-linecap='round'><path d='M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z'/><path d='M16 10h1.5a2.5 2.5 0 0 1 0 5H16'/><path d='M9 3c0 1.2 1 1.8 1 3M12 3c0 1.2 1 1.8 1 3'/></svg>") center/24px no-repeat}
.name{font-weight:700}
.desc{grid-column:2/3;color:var(--muted);font-size:.82rem;margin:0}
.price{grid-row:1/span 2;grid-column:3;font-weight:800;color:var(--primary);background:var(--bg);border-radius:10px;padding:.3rem .55rem;white-space:nowrap;font-size:.92rem}

.cal{grid-column:2/4}
.pick{display:inline-block;margin-inline-start:.35rem;font-size:.66rem;font-weight:800;color:var(--on-primary);background:var(--primary);border-radius:6px;padding:.05rem .4rem;vertical-align:middle}
.visit a{border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.visit a.wa{background:#17703d;color:#fff}
</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<header class="hero">
  <div class="pat" id="pat" aria-hidden="true"></div>
  <button class="lang" id="langBtn">English</button>
  <div class="hero-inner" id="heroInner"></div>
</header>
<div class="search2"><input id="q2" type="search" aria-label="Search"></div>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<div><h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}<span class="open">${lang==="ar"?"مفتوح ٢٤ ساعة":"Open 24h"}</span></div>`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search; $("q2").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
$("q2").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
