<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="تيفاني كلينك – ليزر، بشرة، جلدية وتجميل، وطب أسنان في فروع الياسمين والواحة وقرطبة.">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Tiffany Clinic | تيفاني كلينك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: home = hero + dark branch band + departments + FAQ. Each branch = its own page: dark hero, sticky department nav,
   one band per department (prices + its doctor), then booking (dark) and location. Bands alternate ivory / sand / blush / espresso.
   Deliberately single-look (light page with dark bands), all colors set explicitly. */
:root{
  color-scheme:light;
  --ivory:#F7F1E8; --sand:#EADCC8; --blush:#EFDDD3; --paper:#FFFCF7;
  --espresso:#1F1712; --espresso-2:#2C2119;
  --ink:#2A201A; --muted:#7A6A5D; --line:rgba(122,96,62,.2);
  --gold:#B08A4F; --gold-hi:#DCC08A; --gold-deep:#8E6C38; --rose:#C49A8A;
  --on-dark:#F3E8D8; --on-dark-muted:rgba(243,232,216,.62); --line-dark:rgba(220,192,138,.22);
  --display-ar:"Amiri","Cormorant Garamond",Georgia,serif;
  --display-en:"Cormorant Garamond","Amiri",Georgia,serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:var(--display-ar);
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
html[lang="en"]{--display:var(--display-en)}
*{box-sizing:border-box}
body{background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--ivory)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
html[lang="en"] :is(h1,h2,h3,h4){font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* Bands: full-width colored strips, inner wrap carries the gutter */
.band{position:relative;overflow:hidden}
.band > .wrap{position:relative;z-index:1}
.wrap{max-width:1200px;margin-inline:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.b-ivory{background:var(--ivory)} .b-sand{background:var(--sand)} .b-blush{background:var(--blush)}
.b-dark{background:var(--espresso);color:var(--on-dark)}
.b-dark .muted{color:var(--on-dark-muted)}
.muted{color:var(--muted)}
.pad{padding-block:96px}
@media (max-width:760px){.pad{padding-block:64px}}
canvas.dust{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--gold-deep);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
html[lang="ar"] .eyebrow{letter-spacing:.03em;font-size:.92rem}
.eyebrow::before{content:"";width:30px;height:1px;background:currentColor}
.b-dark .eyebrow{color:var(--gold-hi)}
.title{font-size:clamp(2.1rem,4.6vw,3.4rem)}
.gold-text{background:linear-gradient(110deg,var(--gold-deep),var(--gold) 35%,var(--gold-hi) 55%,var(--gold) 75%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
@media (hover:none){.gold-text{animation:none;background-position:30% 0}}
.rule{display:block;height:1px;width:140px;background:linear-gradient(90deg,var(--gold),transparent);transform-origin:left}
html[dir="rtl"] .rule{background:linear-gradient(-90deg,var(--gold),transparent);transform-origin:right}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 28px;cursor:pointer;text-decoration:none;font-weight:500;white-space:nowrap;
  background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:var(--espresso);box-shadow:0 14px 34px -16px rgba(142,108,56,.9);position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn:hover::after{transform:translateX(120%)}
.btn.line{background:transparent;color:inherit;border:1px solid var(--gold);box-shadow:none}
.btn.sm{padding:9px 18px;font-size:.88rem}
.arrow{display:inline-block;transition:transform .3s}
html[dir="rtl"] .arrow{transform:scaleX(-1)}
a:hover .arrow,button:hover .arrow{transform:translateX(4px)}
html[dir="rtl"] a:hover .arrow,html[dir="rtl"] button:hover .arrow{transform:scaleX(-1) translateX(4px)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;background:rgba(247,241,232,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:12px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo-slot{width:48px;height:48px;border-radius:50%;border:1.5px dashed var(--gold);display:grid;place-items:center;font-size:.6rem;letter-spacing:.2em;color:var(--gold-deep);font-weight:600;flex:none}
.logo-word{display:flex;flex-direction:column;line-height:1.05;text-align:start}
.logo-word b{font-family:var(--display-en);font-size:1.4rem;font-weight:600;letter-spacing:.14em}
.logo-word small{font-family:var(--display-ar);color:var(--muted);font-size:.85rem}
.top nav{display:flex;gap:6px;margin-inline-start:auto;align-items:center}
.top nav a{text-decoration:none;font-size:.92rem;color:var(--muted);padding:6px 12px;border-radius:999px}
.top nav a:hover{color:var(--ink);background:var(--sand)}
.lang{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.85rem}
@media (max-width:820px){.top nav a{display:none}.top .btn{display:none}header.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--ivory)}.subnav{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--paper)}}

/* Curtain (page transitions + preloader) */
.curtain{position:fixed;inset:0;z-index:100;pointer-events:none;display:grid}
.curtain i{grid-area:1/1;display:block;transform:scaleY(0);transform-origin:bottom}
.curtain i:nth-child(1){background:var(--gold)}
.curtain i:nth-child(2){background:var(--espresso)}
.curtain .mark{grid-area:1/1;place-self:center;font-family:var(--display-en);color:var(--gold-hi);font-size:clamp(2rem,6vw,3.4rem);letter-spacing:.3em;opacity:0;padding-inline-start:.3em}

/* HOME — hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding-block:72px 88px}
.hero h1{font-size:clamp(2.7rem,6.4vw,5rem);margin-top:18px}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em}
.hero h1 .w>span{display:inline-block}
.hero .lead{max-width:50ch;font-size:1.08rem;margin:22px 0 32px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:40px;margin-top:44px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--display-en);font-size:2.6rem;line-height:1;color:var(--gold-deep);font-weight:600}
.stats span{font-size:.86rem;color:var(--muted)}
.arch{position:relative;width:100%;max-width:440px;aspect-ratio:4/5;justify-self:center}
.arch .frame{position:absolute;inset:0;border-radius:999px 999px 26px 26px;overflow:hidden;
  background:radial-gradient(90% 60% at 50% 8%,var(--gold-hi),transparent 70%),linear-gradient(175deg,var(--sand),var(--rose) 150%);box-shadow:0 40px 80px -40px rgba(60,40,20,.55)}
.arch .frame::after{content:"";position:absolute;inset:14px;border-radius:999px 999px 16px 16px;border:1px solid rgba(255,252,247,.6)}
.arch .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:rgba(42,32,26,.5);font-size:.78rem;letter-spacing:.14em}
.arch .ph svg{width:40%;margin:0 auto 8px;display:block}
.arch .ring{position:absolute;width:58%;aspect-ratio:1;inset-inline-start:-12%;bottom:-7%}
.arch .card{position:absolute;inset-inline-end:-5%;top:14%;background:var(--paper);border-radius:18px;padding:14px 18px;box-shadow:0 20px 40px -20px rgba(60,40,20,.45);max-width:210px;font-size:.85rem}
.arch .card b{display:block;font-family:var(--display);font-size:1.2rem;color:var(--gold-deep)}
.arch .card2{top:auto;bottom:16%;inset-inline-end:auto;inset-inline-start:-8%;background:var(--espresso);color:var(--on-dark)}
.arch .card2 b{color:var(--gold-hi)}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:44px;padding-top:40px}.arch{max-width:330px}.arch .card2{inset-inline-start:-2%}.arch .card{inset-inline-end:-2%}}

.marquee{overflow:hidden;padding-block:20px;background:var(--espresso);color:var(--gold-hi);border-block:1px solid var(--line-dark)}
.marquee .track{will-change:transform;display:flex;width:max-content;animation:mq 50s linear infinite;font-family:var(--display);font-size:1.4rem}
.marquee span{display:inline-flex;align-items:center;gap:36px;padding-inline-end:36px;white-space:nowrap}
.marquee span::after{content:"✦";font-size:.75rem;color:var(--gold)}
html[dir="rtl"] .marquee .track{animation-name:mqr}
@keyframes mq{to{transform:translateX(-50%)}} @keyframes mqr{to{transform:translateX(50%)}}

/* HOME — branches */
.sec-head{display:flex;flex-direction:column;gap:14px;max-width:660px;margin-bottom:48px}
.sec-head p{margin:0}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.bcard{position:relative;display:flex;flex-direction:column;gap:14px;text-decoration:none;padding:30px 26px 26px;border-radius:26px;background:var(--espresso-2);border:1px solid var(--line-dark);min-height:340px;overflow:hidden;isolation:isolate;transition:border-color .4s}
.bcard::before{content:"";position:absolute;inset:auto -30% -60% -30%;height:80%;background:radial-gradient(closest-side,rgba(220,192,138,.28),transparent);z-index:-1;transition:transform .6s}
.bcard:hover{border-color:var(--gold)}
.bcard:hover::before{transform:translateY(-25%)}
.bcard .no{font-family:var(--display-en);font-size:3.6rem;line-height:1;color:transparent;-webkit-text-stroke:1px var(--gold-hi)}
.bcard h3{font-size:2rem;color:var(--on-dark)}
.bcard p{margin:0;color:var(--on-dark-muted);font-size:.92rem}
.bcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.bcard .tags span{font-size:.75rem;border:1px solid var(--line-dark);color:var(--gold-hi);border-radius:999px;padding:2px 10px}
.bcard .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-dark);padding-top:16px;color:var(--gold-hi);font-weight:500}
.bcard .go .circle{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;transition:background .3s,color .3s}
.bcard:hover .go .circle{background:var(--gold);color:var(--espresso)}
@media (max-width:900px){.bgrid{grid-template-columns:1fr}.bcard{min-height:0}}

/* HOME — departments overview */
.dgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.dtile{background:var(--paper);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.dtile .ic{width:48px;height:48px;border-radius:14px;background:var(--blush);display:grid;place-items:center;color:var(--gold-deep)}
.dtile .ic svg{width:24px;height:24px}
.dtile h3{font-size:1.3rem}
.dtile p{margin:0;font-size:.86rem;color:var(--muted)}
.dtile small{margin-top:auto;color:var(--gold-deep);font-weight:500}
@media (max-width:1000px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.dgrid{grid-template-columns:1fr}}

/* BRANCH — departments overview */
.ov-track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.ov{position:relative;display:flex;flex-direction:column;gap:12px;min-height:330px;padding:22px;border-radius:26px;text-align:start;border:0;cursor:pointer;overflow:hidden;isolation:isolate;font:inherit;transition:transform .5s cubic-bezier(.16,1,.3,1),box-shadow .5s}
.ov:hover,html.js .ov.in:hover{transform:translateY(-8px)!important;box-shadow:0 30px 50px -30px rgba(31,23,18,.6)}
.ov::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;inset-inline-end:-60px;top:-60px;z-index:-1;filter:blur(2px);opacity:.5;transition:transform .8s}
.ov:hover::after{transform:scale(1.4)}
.ov .tp{display:flex;justify-content:space-between;align-items:center}
.ov .no{font-family:var(--display-en);font-size:3rem;line-height:1;color:transparent;-webkit-text-stroke:1px currentColor;opacity:.8}
.ov .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor}
.ov .ic svg{width:22px;height:22px}
.ov h3{font-size:1.55rem;margin-top:auto}
.ov p{font-size:.84rem;margin:0;opacity:.78;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ov .bt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:14px;border-top:1px solid currentColor;border-color:color-mix(in srgb,currentColor 25%,transparent)}
.ov .bt small{display:block;font-size:.72rem;opacity:.7}
.ov .bt b{font-family:var(--display-en);font-size:1.7rem;font-weight:600;line-height:1}
.ov .bt .go{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ov.v1{background:var(--espresso);color:var(--on-dark)} .ov.v1 .no,.ov.v1 .ic,.ov.v1 b{color:var(--gold-hi)} .ov.v1::after{background:radial-gradient(closest-side,rgba(220,192,138,.45),transparent)} .ov.v1 .go{background:var(--gold-hi);color:var(--espresso)}
.ov.v2{background:linear-gradient(150deg,var(--gold-hi),var(--gold) 70%,var(--gold-deep));color:var(--espresso)} .ov.v2::after{background:radial-gradient(closest-side,rgba(255,252,247,.7),transparent)} .ov.v2 .go{background:var(--espresso);color:var(--gold-hi)}
.ov.v3{background:var(--blush);color:var(--ink)} .ov.v3 .no,.ov.v3 .ic,.ov.v3 b{color:var(--gold-deep)} .ov.v3::after{background:radial-gradient(closest-side,rgba(196,154,138,.6),transparent)} .ov.v3 .go{background:var(--espresso);color:var(--gold-hi)}
.ov.v4{background:linear-gradient(160deg,var(--espresso-2),#3A2A1E);color:var(--on-dark)} .ov.v4 .no,.ov.v4 .ic,.ov.v4 b{color:var(--gold-hi)} .ov.v4::after{background:radial-gradient(closest-side,rgba(196,154,138,.5),transparent)} .ov.v4 .go{background:var(--gold-hi);color:var(--espresso)}
.ov.v5{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)} .ov.v5 .no,.ov.v5 .ic,.ov.v5 b{color:var(--gold-deep)} .ov.v5::after{background:radial-gradient(closest-side,rgba(220,192,138,.55),transparent)} .ov.v5 .go{background:var(--gold);color:var(--espresso)}
.swipe{display:none;font-size:.82rem;color:var(--muted);margin-top:14px;align-items:center;gap:8px}
@media (max-width:1000px){
  .ov-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin-inline:calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r));padding-inline:var(--gutter-l) var(--gutter-r);scroll-padding-inline:var(--gutter-l);scrollbar-width:none;padding-block:6px 10px}
  .ov-track::-webkit-scrollbar{display:none}
  .ov{flex:0 0 min(78%,300px);scroll-snap-align:start;min-height:310px}
  .swipe{display:flex}
}

/* Motion — native CSS transitions, triggered by a scroll checker (no external library) */
html.js .rv{opacity:0;transform:translate3d(0,48px,0);transition:opacity 1s ease,transform 1.2s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
html.js .rv-card{opacity:0;transform:translate3d(0,80px,0) scale(.94);transition:opacity 1s ease,transform 1.3s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
html.js .rule{transform:scaleX(0);transition:transform 1.4s cubic-bezier(.65,0,.35,1) .25s}
html.js .rv.in,html.js .rv-card.in{opacity:1;transform:none}
html.js .rule.in{transform:scaleX(1)}
.split .wd{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.14em;margin-bottom:-.14em}
.split .wd>span{display:inline-block}
html.js .split .wd>span{transform:translate3d(0,115%,0) rotate(4deg);transform-origin:left bottom;transition:transform 1.2s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i) * 80ms + var(--d,0s))}
html.js .split.in .wd>span{transform:none}
html.js .prices-card .row{opacity:0;transform:translate3d(0,18px,0);transition:opacity .6s ease,transform .8s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--r,0) * 45ms + .4s)}
html.js .prices-card.in .row{opacity:1;transform:none}
html.js .rv-arch .frame{clip-path:inset(100% 0 0 0 round 999px 999px 26px 26px);transition:clip-path 1.8s cubic-bezier(.16,1,.3,1) .3s}
html.js .rv-arch.in .frame{clip-path:inset(0 0 0 0 round 999px 999px 26px 26px)}
html.js .ringC{stroke-dasharray:578.1;stroke-dashoffset:578.1;transition:stroke-dashoffset 2.8s cubic-bezier(.65,0,.35,1) .6s}
html.js .rv-arch.in .ringC{stroke-dashoffset:0}
html.js .rv-arch .card{opacity:0;transform:translate3d(0,34px,0) scale(.85);transition:opacity .8s ease 1.1s,transform 1.1s cubic-bezier(.34,1.56,.64,1) 1.1s}
html.js .rv-arch .card2{transition-delay:1.4s}
html.js .rv-arch.in .card{opacity:1;transform:none}
.arch .ring{animation:spin 60s linear infinite}
.arch .card{animation:float 5s ease-in-out infinite}
.arch .card2{animation-delay:-2.5s}
@keyframes spin{to{rotate:360deg}}
@keyframes float{50%{translate:0 -12px}}
.mag{transition:transform .5s cubic-bezier(.2,.8,.2,1)}

/* Pinned department chapters (scroll-driven via --p --e --m --x set from JS) */
.pin{--p:1;--e:1;--m:1;--x:0;position:relative}
.pin-in{padding-block:16px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
html.js .pin{height:210vh}
html.js .pin-in{position:sticky;top:var(--stick,132px);height:calc(100vh - var(--stick,132px));display:grid;place-items:center}
@supports (height:100svh){html.js .pin-in{height:calc(100svh - var(--stick,132px))}}
.pin-card{position:relative;width:100%;max-width:1160px;height:100%;min-height:440px;border-radius:calc(28px + var(--x) * 36px);overflow:hidden;isolation:isolate;
  display:flex;flex-direction:column;justify-content:flex-end;gap:18px;padding:clamp(22px,4vw,48px);
  transform:scale(calc(1 - var(--x) * .12));opacity:calc(1 - var(--x) * .55);will-change:transform}
html:not(.js) .pin-card{height:auto}
.pin-card::before{content:"";position:absolute;width:80%;aspect-ratio:1;border-radius:50%;top:-25%;left:calc(-30% + var(--p) * 70%);background:radial-gradient(closest-side,var(--glow),transparent);z-index:-1}
.pin-no{position:absolute;inset-inline-end:-2%;top:20%;font-family:var(--display-en);font-weight:600;line-height:.8;font-size:clamp(9rem,34vw,22rem);color:transparent;-webkit-text-stroke:1.5px var(--acc);
  opacity:calc(.12 + var(--e) * .5);transform:translate3d(0,calc((1 - var(--e)) * 30%),0) scale(calc(1.25 - var(--e) * .25));z-index:-1;pointer-events:none}
.pin-top{display:flex;align-items:center;gap:14px;margin-bottom:auto}
.pin-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--acc);color:var(--acc);
  transform:rotate(calc((1 - var(--e)) * -200deg)) scale(calc(.35 + var(--e) * .65));opacity:var(--e)}
.pin-ic svg{width:28px;height:28px}
.pin-kicker{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);opacity:var(--e)}
html[lang="ar"] .pin-kicker{letter-spacing:.02em;font-size:.95rem}
.pin-title{font-size:clamp(2.9rem,11vw,6.6rem);line-height:1.05}
.pin-title .pw{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.16em;margin-bottom:-.16em}
.pin-title .pw>span{display:inline-block;--k:clamp(0,calc(var(--e) * 2.4 - var(--i) * .4 - .25),1);transform:translate3d(0,calc((1 - var(--k)) * 115%),0)}

function priceGroups(bk,dk,filter){
  const rows=items(bk,dk), groups=[];
  rows.forEach((r,i)=>{let g=groups.find(x=>x.c===r[2]);if(!g){g={c:r[2],rows:[]};groups.push(g)}g.rows.push([r,i])});
  return groups.filter(g=>filter==="all"||g.c===filter).map(g=>`
    <div class="pg"><div class="pg-h">${catName(g.c)}</div>
    ${g.rows.map(([r,i])=>`<div class="row"><div class="n">${lang==="ar"?r[0]:r[1]}</div>

      <button class="bk" type="button" data-book="${dk}:${i}">${t("bookThis")} ←</button></div>`).join("")}
    </div>`).join("");
}

let current=null, timeSel="anyTime";
function routeKey(){const h=location.hash.slice(1);return BRANCHES[h]?h:""}
function chrome(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("#langBtn").textContent=lang==="ar"?"EN":"عربي";
  $("#topnav").innerHTML = current
    ? `<a href="#" data-route="">${t("home")}</a><a href="#" data-jump="#location">${t("toLocation")}</a><a class="btn sm" href="#" data-jump="#booking">${t("book")}</a>`
    : `<a href="#" data-scroll="#branches">${t("navBranches")}</a><a href="#" data-scroll="#faq">${t("navFaq")}</a><a class="btn sm" href="#" data-scroll="#branches">${t("book")}</a>`;
  $("#fab").textContent = current ? t("book") : t("chooseBranch");
  $("#footTxt").textContent=t("footTxt"); $("#footSocial").innerHTML=socialHTML();
}
function render(){
  stopDust(); revealOn=false;
  current=routeKey();
  chrome();
  $("#app").innerHTML = current ? branchView(current) : homeView();
  if(current){ fillSvc(); try{$("#fDate").min=new Date().toISOString().slice(0,10)}catch(e){} }
  window.scrollTo(0,0);
  prepReveal(); startDust(); bindMagnetic();
}
function fillSvc(keepIdx){
  const dk=$("#fDept").value;
  $("#fSvc").innerHTML=`<option value="">${t("chooseSvc")}</option>`+items(current,dk).map((r,i)=>`<option value="${i}">${lang==="ar"?r[0]:r[1]} · ${r[4]?t("from")+" ":""}${fmt(r[3])} ${t("sar")}</option>`).join("");
  if(keepIdx!=null) $("#fSvc").value=keepIdx;
}

/* Page transition with curtain (Web Animations API) */
let busy=false;
const barsEl=()=>$$("#curtain i");
function animBars(to,origin){
  if(!canAnim){ barsEl().forEach(b=>b.style.transform=`scaleY(${to})`); return Promise.resolve(); }
  return Promise.all(barsEl().map((b,i,arr)=>{ const idx=to?i:arr.length-1-i; b.style.transformOrigin=origin;
    const a=b.animate([{transform:`scaleY(${1-to})`},{transform:`scaleY(${to})`}],{duration:to?560:700,delay:idx*100,easing:"cubic-bezier(.76,0,.24,1)",fill:"forwards"});
    return a.finished.then(()=>{b.style.transform=`scaleY(${to})`;a.cancel()}).catch(()=>{b.style.transform=`scaleY(${to})`}); }));
}
async function swap(fn){
  if(busy) return; busy=true; revealOn=false;
  await animBars(1,"bottom");
  fn(); render();
  await new Promise(r=>setTimeout(r,80));
  const out=animBars(0,"top"); setTimeout(startReveal,320); await out; busy=false;
}
function navigate(key){
  swap(()=>{ try{ history.pushState(null,"",key?"#"+key:location.pathname+location.search) }catch(err){ location.hash=key||"" } });
}

/* ================= MOTION ================= */
function splitWords(el){
  if(el.dataset.split) return; el.dataset.split="1"; el.classList.add("split");
  let i=0; const out=[]; const w=h=>`<span class="wd" style="--i:${i++}"><span>${h}</span></span>`;
  [...el.childNodes].forEach(n=>{
    if(n.nodeType===3) n.textContent.split(/(\s+)/).forEach(part=>{ if(!part) return; out.push(/^\s+$/.test(part)?" ":w(part.replace(/&/g,"&amp;").replace(/</g,"&lt;"))) });
    else if(n.nodeType===1) out.push(w(n.outerHTML));
  });
  el.innerHTML=out.join("");
}
let pending=[], revealOn=false, ticking=false, pins=[];
const clamp01=v=>v<0?0:v>1?1:v;
function setStick(){ const hh=($("header.top")?.offsetHeight||0)+($(".subnav")?.offsetHeight||0); document.documentElement.style.setProperty("--stick",hh+"px"); return hh; }
function prepReveal(){
  $$(".rv-t, .bh-title, #heroTitle").forEach(splitWords);
  $$(".stg").forEach(p=>[...p.children].forEach((c,i)=>{c.classList.add("rv");c.style.setProperty("--d",(i*0.11)+"s")}));
  $$(".prices-card").forEach(c=>$$(".row",c).forEach((r,i)=>r.style.setProperty("--r",Math.min(i,14))));
  pending=$$(".rv,.rv-card,.rule,.split,.rv-arch");
  setStick();
  pins = calm ? [] : $$("[data-pin]").map(el=>({el,inner:$(".pin-in",el),nums:$$("[data-n]",el).map(b=>({b,n:+b.dataset.n,last:-1}))}));
  if(calm) $$("[data-pin]").forEach(el=>el.style.height="auto");
}
function startReveal(){ revealOn=true; check(); }
function check(){
  ticking=false; if(!revealOn) return;
  const h=window.innerHeight||document.documentElement.clientHeight;
  pending=pending.filter(e=>{ if(e.getBoundingClientRect().top<h*0.9){ e.classList.add("in"); if(e.classList.contains("stats")) countUp(e); return false } return true });
  const nav=$(".subnav .wrap");
  if(nav){ let act=null; $$(".subnav button[data-jump]").forEach(b=>{const sec=$(b.dataset.jump.replace("#d-","#p-"))||$(b.dataset.jump); if(sec && sec.getBoundingClientRect().top<h*0.5) act=b});
    if(act && !act.classList.contains("on")){ $$(".subnav button").forEach(x=>x.classList.toggle("on",x===act));
      const wr=nav.getBoundingClientRect(), br=act.getBoundingClientRect(); nav.scrollBy({left:(br.left+br.width/2)-(wr.left+wr.width/2),behavior:"smooth"}); } }
  // pinned chapters
  if(pins.length){ const stick=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stick"))||132;
    pins.forEach(pn=>{ const r=pn.el.getBoundingClientRect(); if(r.top>h+50||r.bottom<-50) return;
      const total=Math.max(1,r.height-pn.inner.offsetHeight), pr=clamp01((stick-r.top)/total);
      const e=clamp01((pr+0.12)/0.42), m=clamp01((pr-0.28)/0.32), x=clamp01((pr-0.8)/0.2);
      const st=pn.el.style; st.setProperty("--p",pr.toFixed(4)); st.setProperty("--e",e.toFixed(4)); st.setProperty("--m",m.toFixed(4)); st.setProperty("--x",x.toFixed(4));
      pn.nums.forEach(o=>{ const v=Math.round(o.n*(1-Math.pow(1-m,3))); if(v!==o.last){o.last=v;o.b.textContent=fmt(v)} }); }); }
  // reading progress
  const docH=document.documentElement.scrollHeight-h; const pg=$("#prog"); if(pg) pg.style.transform=`scaleX(${docH>0?clamp01(window.scrollY/docH):0})`;
  if(!calm){ const y=window.scrollY;
    const fr=$(".arch .frame"); if(fr && y<1400) fr.style.transform=`translate3d(0,${(-y*0.08).toFixed(1)}px,0)`;
    const bg=$(".bhero-grid"); if(bg && y<1000){ bg.style.transform=`translate3d(0,${(y*0.2).toFixed(1)}px,0)`; bg.style.opacity=Math.max(0,1-y/700).toFixed(3); } }
}
function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(check) } }
window.addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("resize",()=>{setStick();onScroll()});
function countUp(box){ $$("[data-count]",box).forEach(el=>{ const end=+el.dataset.count, t0=performance.now()+400, dur=1800;
  const step=now=>{ const k=Math.max(0,Math.min(1,(now-t0)/dur)); el.textContent=(el.dataset.plus?"+":"")+Math.round(end*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step) };
  el.textContent=(el.dataset.plus?"+":"")+"0"; requestAnimationFrame(step); }) }
function bindMagnetic(){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  $$(".bcard .circle, .ctas .btn").forEach(m=>{ m.classList.add("mag");
    m.addEventListener("mousemove",e=>{const r=m.getBoundingClientRect();m.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.3}px)`});
    m.addEventListener("mouseleave",()=>m.style.transform="") });
}
function pop(els,opts={}){ if(!canAnim) return; els.forEach((el,i)=>el.animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:opts.d||450,delay:Math.min(i,16)*(opts.s||30),easing:"cubic-bezier(.16,1,.3,1)",fill:"backwards"})) }

/* Gold dust on dark bands — draws only while a band is on screen */
let dustRAF=null, dustSets=[];
function startDust(){
  if(calm) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  dustSets=$$("canvas.dust").map(cv=>{const P=[];for(let i=0;i<30;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.5,s:Math.random()*.0008+.0002,a:Math.random()*6.28});return {cv,ctx:cv.getContext("2d"),P}});
  if(!dustSets.length) return;
  const tick=()=>{ const H=window.innerHeight;
    dustSets.forEach(({cv,ctx,P})=>{ const rc=cv.getBoundingClientRect(); if(rc.bottom<0||rc.top>H) return;
      const w=cv.clientWidth,h=cv.clientHeight;
      if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); ctx.fillStyle="#DCC08A";
      P.forEach(p=>{p.y-=p.s;p.a+=.02;if(p.y<-.02){p.y=1.02;p.x=Math.random()}ctx.globalAlpha=.3+.35*Math.sin(p.a);ctx.beginPath();ctx.arc(p.x*w+Math.sin(p.a)*6,p.y*h,p.r,0,6.28);ctx.fill()}); });
    dustRAF=requestAnimationFrame(tick); };
  dustRAF=requestAnimationFrame(tick);
}
function stopDust(){ if(dustRAF) cancelAnimationFrame(dustRAF); dustRAF=null; dustSets=[]; }

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-route]"); if(r){e.preventDefault();navigate(r.dataset.route);return}
  const s=e.target.closest("[data-scroll]"); if(s){e.preventDefault();goTo($(s.dataset.scroll));return}
  const j=e.target.closest("[data-jump]"); if(j){e.preventDefault();goTo($(j.dataset.jump));return}
  const fab=e.target.closest("#fab"); if(fab){e.preventDefault();goTo($(current?"#booking":"#branches"));return}
  const ch=e.target.closest("[data-chip]"); if(ch){const [dk,c]=ch.dataset.chip.split(":");
    $$(`[data-chip^="${dk}:"]`).forEach(x=>x.classList.toggle("on",x===ch));
    const g=$("#g-"+dk); g.innerHTML=priceGroups(current,dk,c);
    pop($$(".row, .pg-h",g));
    return}
  const bk=e.target.closest("[data-book]"); if(bk){const [dk,i]=bk.dataset.book.split(":");$("#fDept").value=dk;fillSvc(i);goTo($("#booking"));setTimeout(()=>$("#fName").focus({preventScroll:true}),1200);return}
  const bd=e.target.closest("[data-bookdept]"); if(bd){$("#fDept").value=bd.dataset.bookdept;fillSvc();goTo($("#booking"));return}
  const tm=e.target.closest("[data-time]"); if(tm){timeSel=tm.dataset.time;$$("#seg button").forEach(x=>x.classList.toggle("on",x===tm));return}
  if(e.target.closest("#copyPhone")){copy(BRANCHES[current].phone,$("#phoneTxt"));return}
  if(e.target.closest("#rCopy")){copy($("#rMsg").textContent,$("#rMsg"));return}
});
document.addEventListener("change",e=>{ if(e.target.id==="fDept") fillSvc(); });
document.addEventListener("submit",e=>{
  if(e.target.id!=="bkForm") return; e.preventDefault();
  const name=$("#fName").value.trim(), phone=$("#fPhone").value.trim(), si=$("#fSvc").value;
  if(!name||!phone){$("#err").textContent=t("errName");return}
  if(si===""){$("#err").textContent=t("errSvc");return}
  $("#err").textContent="";
  const b=BRANCHES[current], dk=$("#fDept").value, r=items(current,dk)[+si], d=DEPTS.find(x=>x.k===dk);
  const lines=[t("msgHead"),"",`${t("mBranch")}: ${t("branch")} ${nm(b)}`,`${t("mName")}: ${name}`,`${t("mPhone")}: ${phone}`,`${t("mDept")}: ${nm(d)}`,`${t("mSvc")}: ${lang==="ar"?r[0]:r[1]}`,`${t("mPrice")}: ${r[4]?t("from")+" ":""}${fmt(r[3])} ${t("sar")}`];
  if($("#fDate").value) lines.push(`${t("mDate")}: ${$("#fDate").value}`);
  lines.push(`${t("mTime")}: ${t(timeSel)}`);
  if($("#fNotes").value.trim()) lines.push(`${t("mNotes")}: ${$("#fNotes").value.trim()}`);
  const msg=lines.join("\n");
  $("#rMsg").textContent=msg; $("#rWa").href=`https://wa.me/${b.wa}?text=${encodeURIComponent(msg)}`; $("#result").hidden=false;
  pop([$("#result")],{d:600});
});
$("#langBtn").addEventListener("click",()=>swap(()=>{lang=lang==="ar"?"en":"ar";store.set("tf-lang",lang)}));
window.addEventListener("hashchange",()=>{ if(routeKey()!==current) swap(()=>{}); });
window.addEventListener("popstate",()=>{ if(routeKey()!==current) swap(()=>{}); });

/* ================= BOOT ================= */
document.documentElement.classList.add("js");
render();
(async()=>{
  const mark=$("#curtain .mark");
  if(!canAnim){ startReveal(); return; }
  barsEl().forEach(b=>b.style.transform="scaleY(1)");
  mark.style.opacity="1";
  try{
    await mark.animate([{opacity:0,letterSpacing:"0.9em"},{opacity:1,letterSpacing:"0.3em"}],{duration:900,easing:"cubic-bezier(.16,1,.3,1)"}).finished;
    await mark.animate([{opacity:1},{opacity:0}],{duration:300,delay:150,fill:"forwards"}).finished;
  }catch(e){}
  mark.style.opacity="0";
  const out=animBars(0,"top"); setTimeout(startReveal,350); await out;
})();
</script>
