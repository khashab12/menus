<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو كريد</title>
<meta name="description" content="Credibility in Every Cup">
<meta property="og:title" content="منيو كريد">
<meta property="og:description" content="Credibility in Every Cup">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/cred-t8w3/">
<meta property="og:image" content="https://khashab12.github.io/menus/cred-t8w3/logo.png">
<meta name="theme-color" content="#4a1426">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--wine:#4a1426;--wine2:#5c1a31;--wine3:#6a2139;--cream:#f1d9a8;--soft:#cfae86;--ink:#f6e6c6;--paper:#3c0f1e}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--paper:#4a1426}}
:root[data-theme="light"]{--paper:#4a1426}
body{background:var(--paper);color:var(--ink);font-family:"Tajawal","Marcellus",system-ui,sans-serif}
html[lang=en] body{font-family:"Marcellus","Tajawal",serif}
.demo-note{background:var(--cream);color:var(--wine)}
header{position:relative;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.4rem;background:var(--wine)}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:transparent;color:var(--cream);border:1px solid var(--cream);border-radius:2px;padding:.25rem .9rem;cursor:pointer;min-height:36px;font-size:.8rem;z-index:2}
/* stacked CR / ED mark, like their logo */
#logo{display:inline-flex;align-items:center;gap:1rem;padding:.6rem 1rem;background:var(--wine);direction:ltr}
.mk{font:700 2.1rem/.82 "Tajawal";color:var(--cream);letter-spacing:.02em;text-align:left}
.mk span{display:block}
.mk i{font-style:normal;display:inline-block;transform:skewX(-20deg)}
.nm2{text-align:left}
.nm2 b{display:block;font:400 1.9rem/1 "Marcellus";color:var(--cream)}
.nm2 small{display:block;font:500 1.05rem "Tajawal";color:var(--soft);margin-top:.2rem}
.tg{font:400 .95rem "Marcellus";color:var(--soft);margin:.7rem 0 0;letter-spacing:.06em;direction:ltr}
.info{font-size:.8rem;color:var(--soft);margin:.3rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--wine3)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--soft);background:var(--wine2);color:var(--ink);border-radius:2px;padding:.55rem 1rem;font:inherit}
.search input::placeholder{color:var(--soft)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--soft);background:none;color:var(--ink);border-radius:2px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--cream);border-color:var(--cream);color:var(--wine)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1rem 1.5rem}
section{margin-top:1.9rem;scroll-margin-top:120px}
h2{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:0 .2rem .4rem;color:var(--cream);font:700 1.15rem "Tajawal"}
h2 small{font:400 1.05rem "Marcellus";letter-spacing:.06em;direction:ltr}
.sz{display:flex;justify-content:flex-end;gap:1.2rem;padding:0 1rem .35rem;color:var(--soft);font-size:.72rem}
/* every item is a ticket stub with perforated top & bottom edges, like their printed menu */
.tk{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:.8rem;padding:.7rem 1rem;margin:5px 0;background:var(--wine3);
 -webkit-mask:radial-gradient(circle at 50% 0,transparent 3px,#000 3.5px) 0 0/10px 51% repeat-x,radial-gradient(circle at 50% 100%,transparent 3px,#000 3.5px) 0 100%/10px 51% repeat-x;
 mask:radial-gradient(circle at 50% 0,transparent 3px,#000 3.5px) 0 0/10px 51% repeat-x,radial-gradient(circle at 50% 100%,transparent 3px,#000 3.5px) 0 100%/10px 51% repeat-x}
.tk:nth-child(odd){background:var(--wine2)}
.n{line-height:1.3}
.n .a{display:block;font-weight:500}
.n .e{display:block;font:400 .78rem "Marcellus";color:var(--soft);letter-spacing:.05em;text-transform:uppercase;direction:ltr;text-align:start}
html[dir=rtl] .n .e{text-align:right}
.pr{font:400 1.05rem "Marcellus";direction:ltr;white-space:nowrap;color:var(--cream)}
.pr small{font:500 .66rem "Tajawal";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .3rem;color:var(--soft)}
.tax{margin:1.6rem auto 0;max-width:320px;background:var(--cream);color:var(--wine);text-align:center;font-size:.78rem;padding:.7rem 1rem;line-height:1.6;
 -webkit-mask:radial-gradient(circle at 0 50%,transparent 4px,#000 4.5px) 0 0/100% 10px repeat-y;mask:radial-gradient(circle,transparent 3px,#000 3.5px) -5px -5px/10px 10px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><div class="mk" aria-hidden="true"><span>C<i>R</i></span><span><i>E</i>D</span></div><div class="nm2"><b>Cred</b><small>كريد</small></div></div>
  <p class="tg">Credibility in Every Cup</p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>

const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "s": "صغير / كبير", "b": "قطعتين / ٣ قطع", "tax": "يحتاج البالغون إلى 2000 سعرة حرارية في المتوسط يومياً، وقد تختلف الاحتياجات الفردية من شخص لآخر. الأسعار شاملة الضريبة"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "s": "Small / Large", "b": "2 pcs / 3 pcs", "tax": "Adults need about 2,000 calories a day on average; needs vary from person to person. Prices include VAT."}};
let lang="ar", active="all", query="";
const KEY="cred-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ const s=c.sz?`<div class="sz">${T[lang][c.sz]}</div>`:""; return `<section id="cat-${esc(c.id)}"><h2><span>${esc(c.ar)}</span><small>${esc(c.en)}</small></h2>${s}${body}</section>`; }
function item(i){ return `<div class="tk"><span class="n"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}</span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="tax">${T[lang].tax}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
