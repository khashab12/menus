<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--cream:#ede5d4;--paper:#f5efe3;--ink:#1d1a17;--terra:#b5532f;--wood:#7a3f22;--soft:#7d7163;--line:#dcd0bb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#1a1714;--paper:#221e1a;--ink:#efe6d4;--soft:#b3a58f;--line:#3a322a;--terra:#d4714b}}
:root[data-theme="dark"]{--cream:#1a1714;--paper:#221e1a;--ink:#efe6d4;--soft:#b3a58f;--line:#3a322a;--terra:#d4714b}
body{background:var(--cream);color:var(--ink);font-family:"Readex Pro","Marcellus",system-ui,sans-serif;font-weight:300}
html[lang=en] body{font-family:"Marcellus","Readex Pro",serif}
.demo-note{background:var(--terra);color:#fff}
header{position:relative;text-align:center;background:#ede5d4;color:#1d1a17;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 1.6rem}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#1d1a17;color:#ede5d4;border:0;border-radius:0;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:400 .8rem "Marcellus","Readex Pro";z-index:2}
#logo{display:inline-block;padding:.6rem 1.2rem;background:#ede5d4}
/* ring emblem with four diamonds and stacked vessels, from their logo */
.em{display:block;width:78px;height:78px;margin:0 auto .5rem}
.wm{font:400 2.6rem/1 "Marcellus",serif;letter-spacing:.02em;direction:ltr}
.ar{font:500 1.35rem/1.2 "Readex Pro";margin-top:.1rem}
.hv{font:400 .8rem "Marcellus";margin-top:.15rem;direction:ltr}
.tg{margin:.9rem 0 0;font-size:.9rem;color:#5d5246}
.info{font-size:.78rem;color:#7d7163;margin:.25rem 0 0}
/* terracotta triangles row, like the counter */
.tri{height:12px;margin-top:1.1rem;background:linear-gradient(135deg,#b5532f 25%,transparent 25%) 0 0/24px 12px,linear-gradient(225deg,#b5532f 25%,transparent 25%) 0 0/24px 12px;opacity:.9}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:0;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:400 .86rem "Marcellus","Readex Pro"}
.chip[aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2.2rem;scroll-margin-top:120px}
/* each section hangs in a zigzag frame, like the framed print on their wall */
.frame{position:relative;padding:14px;background:
 linear-gradient(135deg,var(--terra) 25%,transparent 25%) -7px 0/14px 14px,
 linear-gradient(225deg,var(--terra) 25%,transparent 25%) -7px 0/14px 14px,
 linear-gradient(315deg,var(--terra) 25%,transparent 25%) 0 0/14px 14px,
 linear-gradient(45deg,var(--terra) 25%,transparent 25%) 0 0/14px 14px,var(--line)}
.inner{background:var(--paper);padding:1rem 1.1rem .6rem}
h2{text-align:center;margin:0 0 .7rem}
h2 .en{display:block;font:400 1.35rem "Marcellus";letter-spacing:.06em;direction:ltr}
h2 .a{display:block;font:500 1rem "Readex Pro";color:var(--terra)}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:baseline;padding:.45rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm .a{display:block;font-weight:400}
.nm .e{display:block;font:400 .82rem "Marcellus";color:var(--soft);direction:ltr;text-align:start}
html[dir=rtl] .nm .e{text-align:right}
.pr{font:400 1.05rem "Marcellus";white-space:nowrap;direction:ltr}
.pr small{font:300 .64rem "Readex Pro";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.visit a{border-radius:0}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
