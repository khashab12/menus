<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو بيهايند</title>
<meta name="description" content="Specialty coffee, fine dining &amp; curated sound">
<meta property="og:title" content="منيو بيهايند">
<meta property="og:description" content="Specialty coffee, fine dining &amp; curated sound">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/behind-v6r3/">
<meta name="theme-color" content="#B8491C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--sand:#EFE6DA;--sand2:#E4D6C4;--rust:#B8491C;--rust2:#E27A2E;--ink:#2A2320;--steel:#C9CCCF;--muted:#7c6e62;--line:rgba(42,35,32,.14);
 --display:"Readex Pro",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,monospace}
body{background:var(--sand);color:var(--ink);font-family:var(--body);
 background-image:radial-gradient(rgba(42,35,32,.07) 1px,transparent 1.4px),radial-gradient(rgba(184,73,28,.06) 1px,transparent 1.4px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
.demo-note{background:var(--ink);color:#FFF4EA}
header.hero{position:relative;padding:1.3rem 1rem 1.2rem;max-width:640px;margin:0 auto;overflow:hidden}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;background:var(--sand);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.2rem .8rem;font:700 .78rem var(--body);cursor:pointer}
.wall{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:2.2rem;opacity:.95}
.wall i{aspect-ratio:1;border-radius:2px;display:block}
.sleeve{position:relative;margin:-5.5rem auto 0;width:min(300px,78vw);aspect-ratio:1;background:var(--rust);border-radius:4px;box-shadow:0 18px 40px -18px rgba(42,35,32,.6);overflow:visible;display:grid;place-items:center}
.disc{position:absolute;inset:6%;left:30%;right:-22%;border-radius:50%;background:repeating-radial-gradient(circle,#1b1715 0 2px,#262120 2px 3px);box-shadow:inset 0 0 0 1px #000;z-index:-1;animation:spin 9s linear infinite}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--rust2)}
@keyframes spin{to{transform:rotate(360deg)}}
.sleeve .brand{direction:ltr;font:600 clamp(3rem,15vw,4.2rem)/1 var(--display);color:#FFF4EA;letter-spacing:-.03em;margin:0}
.sleeve .cat-no{position:absolute;bottom:.7rem;left:.9rem;direction:ltr;font:700 .6rem var(--mono);color:#FFD9BF;letter-spacing:.14em}
.sleeve .ar{position:absolute;top:.8rem;right:1rem;font:600 1rem var(--display);color:#FFD9BF}
.liner{max-width:520px;margin:1.3rem auto 0;text-align:center}
.liner .tag{direction:ltr;font:700 .72rem var(--mono);letter-spacing:.12em;color:var(--rust);margin:0}
.liner p{margin:.4rem 0 0;font-size:.92rem}
.queue{margin:1rem auto 0;max-width:520px;display:flex;gap:.7rem;align-items:center;background:var(--ink);color:#FFF4EA;border-radius:14px;padding:.75rem .9rem}
.queue b{display:block;font-size:.95rem}
.queue small{color:#d9c8b8;font-size:.78rem}
.eq{display:flex;gap:3px;align-items:flex-end;height:26px;flex:0 0 auto}
.eq i{width:4px;background:var(--rust2);border-radius:2px;animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{from{height:6px}to{height:26px}}
.bar{position:sticky;top:0;z-index:5;background:rgba(239,230,218,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem;margin-top:1.1rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1.5px solid var(--ink);background:#FBF6EF;color:var(--ink);border-radius:999px;padding:.6rem 1.1rem;font:1rem var(--body)}
.search input:focus-visible{outline:2px solid var(--rust)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:.28rem .9rem;font:700 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:#FFF4EA}
.chip:focus-visible{outline:2px solid var(--rust2);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.5rem;background:#FBF6EF;border-radius:6px;border:1px solid var(--line);overflow:hidden}
.side{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;background:var(--ink);color:#FFF4EA}
.side .lbl{direction:ltr;flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--rust);display:grid;place-items:center;font:700 .62rem/1.1 var(--mono);text-align:center}
.side h2{margin:0;font:600 1.25rem var(--display)}
.side .en{direction:ltr;display:block;font:700 .62rem var(--mono);letter-spacing:.14em;color:#d9c8b8}
.trk{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .8rem;align-items:center;padding:.65rem 1rem;border-top:1px dashed var(--line)}
.trk .no{direction:ltr;font:700 .74rem var(--mono);color:var(--rust)}
.trk .nm{font-weight:700}
.trk .en{direction:ltr;display:block;font:.7rem var(--mono);color:var(--muted)}
.trk .pr{font:700 .98rem var(--display);white-space:nowrap}
.pick{display:inline-block;margin-inline-start:.4rem;font:700 .6rem var(--mono);letter-spacing:.06em;background:var(--rust2);color:#fff;border-radius:3px;padding:.05rem .35rem;vertical-align:middle}
.visit a{background:#FBF6EF;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px}
.visit a.wa{background:var(--rust);border-color:var(--rust);color:#FFF4EA}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem}
footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "behind", "nameAr": "بيهايند", "tagline": {"ar": "Specialty coffee, fine dining & curated sound", "en": "Specialty coffee, fine dining & curated sound"}, "info": {"ar": "المروج (شارع العليا) · بوليفارد وورلد", "en": "Al Muruj (Olaya St) · Boulevard World"}, "logo": null, "colors": {"primary": "#B8491C", "onPrimary": "#FFF4EA", "secondary": "#2A2320", "background": "#EFE6DA", "accent": "#E27A2E"}, "fonts": {"display": "Readex Pro", "body": "IBM Plex Sans Arabic"}, "pattern": "none", "currency": {"ar": "ر.س", "en": "SAR"}, "demoBanner": true, "credit": "محمد", "whatsapp": "966555676773", "mapsUrl": "https://maps.google.com/?cid=12537153776544448534", "reviewUrl": "https://maps.google.com/?cid=12537153776544448534", "instagram": "https://www.instagram.com/behind.sa/", "categories": [{"id": "brew", "ar": "القهوة", "en": "Coffee", "side": "A", "items": [{"ar": "إسبريسو", "en": "Espresso", "p": 14}, {"ar": "كورتادو", "en": "Cortado", "p": 17}, {"ar": "فلات وايت", "en": "Flat White", "p": 19}, {"ar": "قهوة مقطرة – أوغندا", "en": "Drip · Uganda", "p": 24, "pick": true}, {"ar": "قهوة اليوم", "en": "Coffee of the Day", "p": 13}]}, {"id": "cold", "ar": "البارد", "en": "Cold", "side": "A", "items": [{"ar": "آيس لاتيه", "en": "Iced Latte", "p": 21}, {"ar": "آيس سبانش لاتيه", "en": "Iced Spanish Latte", "p": 23}, {"ar": "آيس دريب", "en": "Iced Drip", "p": 24}]}, {"id": "sweet", "ar": "الحلا", "en": "Desserts", "side": "B", "items": [{"ar": "فرنش توست", "en": "French Toast", "p": 32, "pick": true}, {"ar": "بودنق شوكولاتة", "en": "Chocolate Pudding", "p": 26}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const WALL=["#B8491C","#2A2320","#E27A2E","#C9CCCF","#8C3A1A","#D9B38C","#3C4A5A","#E9D8C2","#6B2E1A","#A99F94","#F0A15C","#1F1B19","#C46A3A","#DCCFBF","#7A5C49","#E3B37A","#4A3B33","#B85A2E"];
function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`<div class="wall" aria-hidden="true">${WALL.map(c=>`<i style="background:${c}"></i>`).join("")}</div>
   <div class="sleeve"><div class="disc" aria-hidden="true"></div><span class="ar">بيهايند</span><h1 class="brand">behind</h1><span class="cat-no">BHND-001 · RIYADH</span></div>
   <div class="liner"><p class="tag">SPECIALTY COFFEE · FINE DINING · CURATED SOUND</p><p>${ar?"المروج (شارع العليا) · بوليفارد وورلد":"Al Muruj (Olaya St) · Boulevard World"}</p></div>
   <div class="queue"><div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><b>${ar?"واقف في اللاين؟ اختار طلبك من هنا":"In the line? Pick your order here"}</b><small>${ar?"وأنت توصل الكاشير تكون عارف وش تبي، واللاين يمشي أسرع":"Know what you want by the counter, and the line moves faster"}</small></div></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,t=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="side"><span class="lbl">SIDE<br>${c.side}</span><div><h2>${esc(L(c,"ar","en"))}</h2>${lang==="ar"?`<span class="en">${esc(c.en.toUpperCase())}</span>`:""}</div></div>`;
    for(const i of items){t++;
      html+=`<div class="trk"><span class="no">${c.side}${String(t).padStart(2,"0")}</span><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}${lang==="ar"?`<span class="en">${esc(i.en)}</span>`:""}</div><span class="pr">${fmt(i.p)} ${cur()}</span></div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف من ريفيوهاتكم وبوستاتكم، والأسعار أمثلة لين نحط أسعاركم";
T.en.note="Preview: items from your reviews and posts, prices are samples until we add yours";
T.ar.search="وش تبي تطلب؟";
T.ar.pick="HIT";T.en.pick="HIT";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"behind-v6r3"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
