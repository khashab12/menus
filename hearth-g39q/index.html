<style>
:root{
  --green:#1d6a2c; --deep:#14471f; --cream:#efe6d2; --paper:#f7efdc; --lime:#a8c43c; --wood:#8a5a32; --wood2:#6b4324;
  --ink:#1f2a1d; --muted:#5e6a57; --page:#efe6d2; --line:#d9ccb0;
  --hand:"Marhey","IBM Plex Sans Arabic",system-ui,sans-serif; --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0e1c11;--muted:#b9c4b1;--line:#2b3d2d}}
:root[data-theme="dark"]{--page:#0e1c11;--muted:#b9c4b1;--line:#2b3d2d}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:130px}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{background:var(--lime);color:#172006;text-align:center;font-size:.82rem;padding:.45rem 1rem;font-weight:500}

/* ---------- header: green wall + logo box + Najdi triangles ---------- */
header{position:relative;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 2.2rem) 1rem 3.4rem;text-align:center;overflow:hidden}
.palm{position:absolute;bottom:22px;width:120px;height:150px;opacity:.22;color:#fff}
.palm.l{inset-inline-start:-18px}.palm.r{inset-inline-end:-18px;transform:scaleX(-1)}
.logo{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:132px;border:2px solid rgba(255,255,255,.85);border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(255,255,255,.08)}
.logo b{font:400 2.55rem/0.9 "Bebas Neue",sans-serif;letter-spacing:.02em}
.logo small{font:600 .56rem/1 var(--body);letter-spacing:.32em;margin-top:.25rem}
.brand-ar{font:700 1.7rem/1.2 var(--hand);margin:.9rem 0 0}
.motto{margin:.25rem 0 0;font-size:.95rem;opacity:.85}
.info{margin:.3rem 0 0;font-size:.85rem;opacity:.75}
.tri{position:absolute;left:0;right:0;bottom:0;height:26px;color:var(--page)}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .9rem);inset-inline-end:1rem;z-index:2;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.8);border-radius:999px;padding:.3rem .9rem;font:500 .85rem var(--body);cursor:pointer;min-height:36px}

/* ---------- sticky bar ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--page);padding:.7rem 0 .5rem;border-bottom:1px solid var(--line)}
.search{max-width:560px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:.65rem 1rem;font:1rem var(--body)}
.chips{display:flex;gap:.5rem;justify-content:center;overflow-x:auto;padding:.6rem 1rem .1rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--green);background:transparent;color:var(--green);border-radius:999px;padding:.35rem 1rem;font:600 .9rem var(--hand);cursor:pointer;min-height:38px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:var(--lime);border-color:var(--lime)}}
:root[data-theme="dark"] .chip{color:var(--lime);border-color:var(--lime)}
.chip[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.lang:focus-visible,.chip:focus-visible,.search input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

/* ---------- the hanging scroll (their wall menu) ---------- */
main{max-width:520px;margin:0 auto;padding:1.2rem 1.1rem 2rem}
.scroll{position:relative;margin:1rem 0 2rem;padding-top:38px}
.string{position:absolute;top:0;left:50%;transform:translateX(-50%);width:62%;height:44px;color:#7a6a55}
.rod{position:relative;height:14px;border-radius:7px;background:linear-gradient(180deg,#a26d40,var(--wood) 55%,var(--wood2));box-shadow:0 2px 3px rgba(0,0,0,.25);margin:0 -10px;z-index:1}
.sheet{--muted:#5e6a57;background:var(--paper);color:var(--ink);padding:1.4rem 1.2rem 1.5rem;margin:0 2px;box-shadow:0 10px 22px -12px rgba(40,30,10,.45);
  background-image:radial-gradient(rgba(120,90,40,.05) 1px,transparent 1px);background-size:6px 6px}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:.6rem;margin-bottom:.6rem}
.title h2{margin:0;font:700 clamp(2.4rem,12vw,3.2rem)/1 var(--hand);color:transparent;
  background:repeating-linear-gradient(135deg,var(--lime) 0 3px,#6f8f1f 3px 5px);-webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:1.2px var(--deep)}
html[lang=en] .title h2{font-family:"Bebas Neue",sans-serif;letter-spacing:.04em;font-size:clamp(3rem,15vw,4rem)}
.badge{border:1.5px solid var(--ink);outline:1.5px solid var(--ink);outline-offset:2px;padding:.05rem .45rem;font:700 .8rem var(--hand);white-space:nowrap}
.badge em{font-style:normal;color:#b3261e}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:0 .55rem;align-items:baseline;padding:.42rem 0}
.row::before{content:"-";font:600 1rem var(--hand);color:var(--muted)}
.nm{font:500 1.08rem/1.35 var(--hand)}
.nm .pk{display:inline-block;margin-inline-start:.4rem;font:600 .68rem var(--body);background:var(--green);color:#fff;border-radius:4px;padding:0 .4rem;vertical-align:middle}
.pr{font:700 1.2rem/1 var(--hand);color:var(--deep);white-space:nowrap}
.pr small{font:600 .62rem var(--body);color:var(--green);margin-inline-start:.15rem}
.dsc{grid-column:2/4;font-size:.84rem;color:var(--muted);margin:0}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;text-align:center;margin-top:.3rem}
.ic svg{width:64px;height:64px;display:block;margin:0 auto .2rem}
.ic .nm{display:block;font-size:1.25rem}
.ic .pr{display:block;font-size:1rem;margin-top:.1rem}
.ic .dsc{display:block;font-size:.72rem}
.free{text-decoration:line-through;text-decoration-color:#b3261e;margin-inline-start:.2rem;font-size:.7rem}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.4rem}
footer strong{color:inherit}
.tri-foot{height:18px;color:var(--green);opacity:.5;margin-bottom:1rem}
</style>
</head>

const T = {

  en:{dir:"ltr",lang:"العربية",search:"Find your drink…",pick:"Our pick",empty:"Nothing matches that. Try another word.",all:"All",

};
let lang="ar", active="all", query="";

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
function price(i){
  if(i.free) return `${T[lang].free}<span class="free">${cur()}</span>`;
  return `${i.from?`<small>${T[lang].from}</small> `:""}${fmt(i.p)}<small>${cur()}</small>`;
}
function renderHero(){
  $("brandAr").textContent = lang==="ar" ? (C.nameAr||"") : "";
  $("brandAr").hidden = lang!=="ar";
  $("motto").innerHTML = `<bdi dir="ltr">${T[lang].motto}</bdi>`;
  $("info").textContent = L(C.info||{},"ar","en");
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    const iconic = items.every(i=>i.icon);
    let body="";
    if(iconic){
      body=`<div class="icons">`+items.map(i=>{const d=L(i,"dAr","dEn");return `<div class="ic">${ICONS[i.icon]||""}<span class="nm">${esc(L(i,"ar","en"))}</span><span class="pr">${price(i)}</span>${d?`<span class="dsc">${esc(d)}</span>`:""}</div>`}).join("")+`</div>`;
    } else {
      body=items.map(i=>{const d=L(i,"dAr","dEn");return `<div class="row"><span class="nm">${esc(L(i,"ar","en"))}${i.pick?`<span class="pk">${T[lang].pick}</span>`:""}</span><span class="pr">${price(i)}</span>${d?`<p class="dsc">${esc(d)}</p>`:""}</div>`}).join("");
    }
    const head = ci===0 ? `<div class="title"><h2>${T[lang].title}</h2><span class="badge">${T[lang].badge}</span></div>`
                        : `<div class="title"><h2 style="font-size:2.1rem">${esc(L(c,"ar","en"))}</h2></div>`;

  });

}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(lang==="en"?"Mohamed":(C.credit||"محمد")));
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("hearth-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
