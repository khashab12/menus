<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--pink:#f3c6c8;--pink2:#f7d9da;--ink:#2a1f20;--soft:#7a5f61;--line:rgba(42,31,32,.28);--rose:#e8a9ad}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pink:#221819;--pink2:#2c2021;--ink:#f7dcdd;--soft:#c9a3a6;--line:rgba(247,220,221,.22);--rose:#e8a9ad}}
:root[data-theme="dark"]{--pink:#221819;--pink2:#2c2021;--ink:#f7dcdd;--soft:#c9a3a6;--line:rgba(247,220,221,.22);--rose:#e8a9ad}
body{background:var(--pink);color:var(--ink);font-family:"Almarai","DM Sans",system-ui,sans-serif}
html[lang=en] body{font-family:"DM Sans","Almarai",sans-serif}
.demo-note{background:var(--ink);color:var(--pink)}
/* editorial page head: tiny caps left/right with a hairline, like their menu story */
header{position:relative;padding:calc(env(safe-area-inset-top,0px) + 4rem) 1.4rem 1.6rem;background:#f3c6c8;color:#2a1f20}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1.4rem;background:#2a1f20;color:#f3c6c8;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .78rem "DM Sans";z-index:2}
.cap{display:flex;justify-content:space-between;font:500 .66rem "DM Sans";letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid rgba(42,31,32,.5);padding-bottom:.35rem;direction:ltr;max-width:520px;margin:0 auto}
#logo{display:block;width:max-content;margin:1.6rem auto 0;padding:.2rem 1rem;background:#f3c6c8;direction:ltr}
.wm{font:400 4.2rem/.9 "Bodoni Moda",serif;letter-spacing:-.02em}
.sub{font:500 .64rem "DM Sans";letter-spacing:.42em;text-align:center;margin:.4rem -.42em 0 0}
.info{text-align:center;font-size:.8rem;margin:.9rem 0 0;color:#6b5153}
.bar{position:sticky;top:0;z-index:5;background:var(--pink);border-bottom:1px solid var(--line)}
.bar-in{max-width:520px;margin:0 auto;padding:.6rem 1.4rem .4rem}
.search input{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;padding:.5rem .1rem;font:inherit}
.search input::placeholder{color:var(--soft)}
.chips{display:flex;gap:1.1rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:none;color:var(--soft);padding:.3rem 0;cursor:pointer;min-height:36px;font:italic 400 1.05rem "Bodoni Moda","Almarai"}
.chip[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
main{max-width:520px;margin:0 auto;padding:.5rem 1.4rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:110px}
/* rounded "photo" panel with a huge italic word laid across it, like their Sweet cover */
.hero{position:relative;height:150px;border-radius:22px;overflow:hidden;background:linear-gradient(90deg,transparent 49.6%,rgba(255,255,255,.12) 50%,transparent 50.4%),linear-gradient(170deg,#6a6261,#9a9290 55%,#4a4342);display:grid;place-items:center;margin-bottom:.9rem}
.hero b{font:italic 400 4.4rem/1 "Bodoni Moda",serif;color:var(--rose);letter-spacing:-.02em;text-shadow:0 2px 16px rgba(0,0,0,.25);direction:ltr}
.cap2{display:flex;justify-content:space-between;font:500 .66rem "DM Sans";letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:.35rem;margin-bottom:.2rem;direction:ltr}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.row .e{font:400 .98rem "DM Sans";direction:ltr}
.row .a{font:400 1rem "Almarai";direction:rtl}
.pn{margin:1.4rem 0 0;text-align:center;font-size:.78rem;color:var(--soft)}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

  <div id="logo"><div class="wm">doff</div><div class="sub">ESPRESSO BAR</div></div>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<nav class="visit" id="visit" hidden></nav>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>

  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
