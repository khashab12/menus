<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--black:#151413;--board:#1d1c1a;--chalk:#f1ece4;--soft:#a79f94;--copper:#c89466;--green:#1f8a4c;--red:#c8202f;--line:rgba(241,236,228,.14);--card:rgba(255,255,255,.035)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--board:#121110}}
:root[data-theme="dark"]{--board:#121110}
/* chalkboard grain */
body{background:var(--board);color:var(--chalk);font-family:"Cairo","Oswald",system-ui,sans-serif;
 background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:5px 5px}
.demo-note{background:var(--red);color:#fff}
/* Italian tricolour ribbon down the side, like their menu pages */
body::before{content:"";position:fixed;top:0;bottom:0;right:0;width:9px;z-index:9;background:linear-gradient(90deg,var(--green) 0 33%,#f1ece4 33% 66%,var(--red) 66%)}
header{position:relative;text-align:center;background:#151413;color:#f1ece4;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 1.8rem}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);left:1rem;background:none;color:#f1ece4;border:1px solid #c89466;border-radius:3px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "Oswald";letter-spacing:.08em;z-index:2}
/* round badge logo: black disc, ring text, tricolour arc */
#logo{display:inline-block;background:#151413;border-radius:50%;direction:ltr}
.badge{display:block;width:190px;height:190px}
.tg{margin:.9rem 0 0;font:400 1.5rem "Yellowtail";color:#c89466;direction:ltr}
.info{font-size:.8rem;color:#a79f94;margin:.25rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--board);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.4rem .4rem 1.2rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--chalk);border-radius:3px;padding:.55rem 1rem;font:inherit}
.search input::placeholder{color:var(--soft)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:none;color:var(--chalk);border-radius:3px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .84rem "Oswald","Cairo";letter-spacing:.06em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:#151413}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.6rem 1.5rem 1.2rem}
section{margin-top:2.1rem;scroll-margin-top:120px}
h2{display:flex;align-items:center;gap:.55rem;margin:0 0 .3rem;padding-bottom:.4rem;border-bottom:1.5px solid var(--copper);font:600 1.25rem "Oswald";letter-spacing:.12em;text-transform:uppercase;color:var(--copper);direction:ltr}
h2 svg{width:24px;height:24px;flex:0 0 auto}
h2 small{margin-inline-start:auto;font:600 .95rem "Cairo";letter-spacing:0;color:var(--soft);direction:rtl}
/* dotted leaders like the chalk menu */
.row{display:flex;align-items:baseline;gap:.4rem;padding:.42rem 0;direction:ltr}
.row .e{font:400 .98rem "Oswald";letter-spacing:.02em}
.row .a{font:500 .8rem "Cairo";color:var(--soft);margin-inline-start:.35rem;direction:rtl}
.row .dots{flex:1;border-bottom:2px dotted rgba(241,236,228,.25);transform:translateY(-.25em);min-width:1rem}
.row .pr{font:500 1.02rem "Oswald";color:var(--chalk);white-space:nowrap}
.row .pr small{font:400 .62rem "Cairo";color:var(--soft);margin-inline-start:.2rem}
.foot2{margin:2rem 0 0;text-align:center;font:400 1.6rem "Yellowtail";color:var(--copper);direction:ltr}
.foot2 span{display:block;font:500 .78rem "Cairo";color:var(--soft);margin-top:.2rem;direction:rtl}
.visit a{border-radius:3px;border-color:var(--line);color:var(--chalk)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--chalk)}
