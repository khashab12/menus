<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--gold:#a8844f;--gold2:#c9a86f;--sand:#f3ebdf;--sand2:#e9dcc8;--brown:#5b4128;--card:#fffaf3;--ink:#3a2a1a;--soft:#8a7560;--line:#e6d7c1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sand:#17120d;--sand2:#211a13;--card:#221b14;--ink:#f1e5d2;--soft:#bba58a;--line:#3a2f23}}
:root[data-theme="dark"]{--sand:#17120d;--sand2:#211a13;--card:#221b14;--ink:#f1e5d2;--soft:#bba58a;--line:#3a2f23}
body{background:var(--sand);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif}
.demo-note{background:var(--brown);color:#f3ebdf}
/* warm gold gradient like their offer posts, no photos of people */
header{position:relative;text-align:center;background:linear-gradient(180deg,#f3ebdf 0%,#e4cfae 55%,#b8935c 100%);color:#3a2a1a;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 2rem}

.wm{font:600 1.35rem "Cormorant Garamond";letter-spacing:.35em;margin-inline-end:-.35em;direction:ltr;color:#5b4128}
.ar{font:500 1.5rem "Reem Kufi";margin-top:.2rem}
.tg{margin:.8rem 0 0;font:500 1.05rem "Tajawal"}
.info{font-size:.8rem;color:#5b4128;margin:.3rem 0 0}
.cta{display:inline-block;margin-top:1.1rem;background:#3a2a1a;color:#f3ebdf;text-decoration:none;font-weight:500;padding:.65rem 1.6rem;border-radius:999px}
.bar{position:sticky;top:0;z-index:5;background:var(--sand);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--gold);background:none;color:var(--ink);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .86rem "Tajawal"}
.chip[aria-pressed="true"]{background:var(--gold);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{text-align:center;margin:0 0 .9rem;font:500 1.35rem "Reem Kufi";color:var(--brown)}

h2::after{content:"";display:block;width:60px;height:10px;margin:.3rem auto 0;background:radial-gradient(circle,var(--gold) 2px,transparent 2.5px) center/12px 10px repeat-x}

.of{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1rem 1.1rem;margin-bottom:.7rem;display:grid;grid-template-columns:1fr auto;gap:.4rem .8rem;align-items:center}

.of .pr{grid-row:span 2;font:700 1.35rem "Tajawal";color:var(--gold);direction:ltr;white-space:nowrap;background:var(--sand2);border-radius:12px;padding:.35rem .7rem}
.of .pr small{font-size:.66rem;color:var(--soft);margin-inline-start:.2rem;font-weight:500}
.of a{justify-self:start;font-size:.8rem;color:var(--brown);text-decoration:none;border-bottom:1px solid var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .of a{color:var(--gold2)}}
.cat{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.cat a{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.5rem 1rem;color:var(--ink);text-decoration:none;font-size:.9rem}
.nt{margin:1.4rem 0 0;text-align:center;font-size:.78rem;color:var(--soft)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=L(C.tagline,"ar","en"); const c=$("cta"); c.textContent=T[lang].cta; c.href=WA(lang==="ar"?"السلام عليكم، أبي أحجز موعد":"Hello, I'd like to book"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${c.tags?`<div class="cat">${body}</div>`:body}</section>`; }
function item(i,k,c){ const nm=lang==="ar"?i.ar:i.en;

  return `<div class="of"><span class="n">${esc(nm)}</span><span class="pr">${fmt(i.p)}<small>${cur()}</small></span><a href="${WA((lang==="ar"?"السلام عليكم، أبي أحجز عرض: ":"Hello, I'd like to book: ")+nm)}" target="_blank" rel="noopener">${T[lang].book}</a></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="nt">${T[lang].nt}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");

    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;

  $("credit").innerHTML=(lang==="ar"?"تصميم وتطوير ":"Designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;

  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
