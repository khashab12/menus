<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو BLACK.</title>
<meta name="description" content="Egypt&#x27;s first slow bar">
<meta property="og:title" content="منيو BLACK.">
<meta property="og:description" content="Egypt&#x27;s first slow bar">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/black-q9t4/">
<meta name="theme-color" content="#0E0E0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--white:#fff;--ink:#0E0E0E;--gold:#B8913A;--sage:#CFE0D6;--stone:#8E8E8A;--mist:#F3F3F1;--line:#e6e6e3;
 --display:"Archivo",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
body{background:var(--white);color:var(--ink);font-family:var(--body)}
.demo-note{background:var(--ink);color:#fff}
header.hero{position:relative;overflow:hidden;padding:1.4rem 1.2rem 1.4rem;min-height:330px}
.blob{position:absolute;inset:auto -20% -30% -20%;height:70%;background:var(--mist);border-radius:48% 52% 0 0/60% 60% 0 0;z-index:0}
.blob2{position:absolute;right:-60px;top:40px;width:220px;height:140px;background:var(--sage);border-radius:60% 40% 55% 45%/55% 45% 55% 45%;opacity:.55;z-index:0}
.hero>*{position:relative;z-index:1}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:.2rem .8rem;font:600 .78rem var(--body);cursor:pointer}
.wm{direction:ltr;text-align:left;font:900 clamp(3.6rem,19vw,5.6rem)/.9 var(--display);letter-spacing:-.04em;margin:2.2rem 0 0}
.wm span{color:var(--gold)}
.city{direction:ltr;text-align:left;font:600 .72rem var(--mono);letter-spacing:.5em;margin:.35rem 0 0}
.slow{direction:ltr;text-align:left;margin:1.4rem 0 0;font:500 .95rem var(--display)}
.cup{position:absolute;right:1.2rem;bottom:1rem;width:92px;height:92px}
.info{margin:.8rem 0 0;color:var(--stone);font-size:.85rem}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:.5rem .2rem;font:1rem var(--body)}
.search input:focus-visible{outline:none;border-bottom-color:var(--gold)}
.chips{display:flex;gap:1.1rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:transparent;color:var(--stone);padding:.2rem 0;font:600 .9rem var(--body);cursor:pointer;border-bottom:2px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chip:focus-visible{outline:1px solid var(--gold)}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.8rem}
.ch{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.7rem}
.ch h2{margin:0;font:700 1.3rem var(--body)}
.ch span{direction:ltr;font:600 .7rem var(--mono);letter-spacing:.3em;color:var(--stone);text-transform:uppercase}
.cards{display:grid;gap:.7rem}
.card{background:var(--mist);border-radius:22px;padding:.9rem 1rem .8rem;display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem}
.card .nm{font:700 1.02rem var(--body)}
.card .en{direction:ltr;display:block;font:600 .75rem var(--display);color:var(--stone)}
.card .pr{align-self:start;background:var(--ink);color:#fff;border-radius:999px;padding:.2rem .7rem;font:600 .9rem var(--body);white-space:nowrap}
.card dl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:.1rem .7rem;margin:.55rem 0 0;padding-top:.5rem;border-top:1px dashed #cfcfcb;font-size:.78rem}
.card dt{direction:ltr;font:600 .62rem var(--mono);letter-spacing:.14em;color:var(--stone);text-transform:uppercase;align-self:center}
.card dd{margin:0}
.card.pk{background:#fff;box-shadow:0 0 0 1.5px var(--ink) inset}
.pick{display:inline-block;margin-inline-start:.4rem;width:8px;height:8px;border-radius:50%;background:var(--gold);vertical-align:middle}
.visit a{background:var(--mist);color:var(--ink);border:0;border-radius:999px}
.visit a.wa{background:var(--ink);color:#fff}
footer{text-align:center;color:var(--stone);font-size:.85rem;padding:1.2rem 1rem 2.5rem}
footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <div class="blob" aria-hidden="true"></div><div class="blob2" aria-hidden="true"></div>
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "BLACK.", "nameAr": "BLACK.", "tagline": {"ar": "Egypt's first slow bar", "en": "Egypt's first slow bar"}, "info": {"ar": "Eastlane by Urbnlanes، التسعين الجنوبي، التجمع", "en": "Eastlane by Urbnlanes, S Teseen, New Cairo"}, "logo": null, "colors": {"primary": "#0E0E0E", "onPrimary": "#FFFFFF", "secondary": "#B8913A", "background": "#FFFFFF", "accent": "#CFE0D6"}, "fonts": {"display": "Archivo", "body": "IBM Plex Sans Arabic"}, "pattern": "none", "currency": {"ar": "ج.م", "en": "EGP"}, "demoBanner": true, "credit": "محمد", "whatsapp": "201098983556", "mapsUrl": "https://maps.google.com/?cid=18344756311695823115", "reviewUrl": "https://maps.google.com/?cid=18344756311695823115", "instagram": "https://www.instagram.com/blackmilan.scb/", "categories": [{"id": "slow", "ar": "السلو بار", "en": "Slow Bar", "items": [{"ar": "V60 بنما", "en": "V60 · Panama", "p": 260, "origin": "Panama", "notes": {"ar": "غريب ومختلف عن الكولومبي", "en": "Unusual, unlike the Colombian"}, "pick": true}, {"ar": "V60 كولومبيا", "en": "V60 · Colombia", "p": 220, "origin": "Colombia", "notes": {"ar": "متوازن", "en": "Balanced"}}, {"ar": "آيس V60", "en": "Iced V60", "p": 240}]}, {"id": "bar", "ar": "الإسبريسو", "en": "Espresso Bar", "items": [{"ar": "إسبريسو مع تمرة", "en": "Espresso & a date", "p": 110, "notes": {"ar": "بيتقدم مع تمرة", "en": "Served with a date"}}, {"ar": "كورتادو", "en": "Cortado", "p": 140}, {"ar": "فلات وايت", "en": "Flat White", "p": 150}, {"ar": "مونتي بلاك", "en": "Monte Black", "p": 190, "notes": {"ar": "اطلب حاجة مختلفة النهارده", "en": "Order something different today"}, "pick": true}, {"ar": "أمبر", "en": "AMBER", "p": 200, "notes": {"ar": "الجديد، والباقي تكتشفه", "en": "New. The rest is yours to discover"}}]}, {"id": "matcha", "ar": "ماتشا", "en": "Matcha", "items": [{"ar": "ماتشا لاتيه", "en": "Matcha Latte", "p": 180, "notes": {"ar": "مش الماتشا اللي متعود عليها", "en": "Not quite your everyday matcha"}}]}, {"id": "sweet", "ar": "حلو", "en": "Sweets", "items": [{"ar": "تيراميسو", "en": "Tiramisu", "p": 170, "notes": {"ar": "فريش", "en": "Fresh"}}, {"ar": "بيكان", "en": "Pecan", "p": 160}, {"ar": "كرواسون", "en": "Croissant", "p": 110}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const CUP=`<svg class="cup" viewBox="0 0 92 92" aria-hidden="true"><ellipse cx="46" cy="76" rx="40" ry="10" fill="#fff" stroke="#e1e1de"/><path d="M20 34h52l-5 32a8 8 0 0 1-8 7H33a8 8 0 0 1-8-7z" fill="#111"/><ellipse cx="46" cy="34" rx="26" ry="7" fill="#1c1c1c"/><ellipse cx="46" cy="34" rx="21" ry="5" fill="#b07a45"/><path d="M40 33c3-3 9-3 12 0-3 2-9 2-12 0z" fill="#f1e2cc"/><text x="46" y="56" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="900" font-size="9" fill="#B8913A">BLACK.</text></svg>`;
function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`<p class="wm">BLACK<span>.</span></p><p class="city">MILANO · CAIRO</p>
   <p class="slow">Egypt's first slow bar.</p>
   <p class="info">${esc((C.info||{})[lang]||"")}</p>${CUP}`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch"><h2>${esc(L(c,"ar","en"))}</h2><span>${esc(c.en)}</span></div><div class="cards">`;
    for(const i of items){const nt=i.notes?i.notes[lang]:"";
      html+=`<article class="card${i.pick?" pk":""}"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="pick" title="${T[lang].pick}"></span>`:""}${lang==="ar"?`<span class="en">${esc(i.en)}</span>`:""}</div><span class="pr">${fmt(i.p)} ${cur()}</span>
       ${(i.origin||nt)?`<dl>${i.origin?`<dt>Origin</dt><dd>${esc(i.origin)}</dd>`:""}${nt?`<dt>Notes</dt><dd>${esc(nt)}</dd>`:""}</dl>`:""}</article>`;}
    html+="</div></section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${lang==="ar"?"مفيش صنف بالاسم ده، جرب كلمة تانية.":T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف من بوستاتكم وريفيوهاتكم، والأسعار أمثلة لحد ما نحط أسعاركم";
T.en.note="Preview: items from your posts and reviews, prices are samples until we add yours";
T.ar.search="بتدور على ايه؟";
T.ar.pick="ترشيحنا";
T.ar.updated="آخر تحديث للأسعار: النهارده";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"black-q9t4"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
