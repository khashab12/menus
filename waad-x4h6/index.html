<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--maroon:#6e1a1f;--maroon2:#8e2228;--cream:#f7efe4;--paper:#fbf6ef;--card:#ffffff;--ink:#3a1416;--soft:#8a6e66;--line:#ead9cf;--sand:#c9a27c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1a0d0e;--card:#251314;--ink:#f7efe4;--soft:#c3a59b;--line:#3a2022;--maroon2:#d26a70}}
:root[data-theme="dark"]{--paper:#1a0d0e;--card:#251314;--ink:#f7efe4;--soft:#c3a59b;--line:#3a2022;--maroon2:#d26a70}
body{background:var(--paper);color:var(--ink);font-family:"Alexandria",system-ui,sans-serif;font-weight:300}
.demo-note{background:#6e1a1f;color:#fff}
/* maroon sky over the Tuwaiq escarpment */
header{position:relative;text-align:center;background:#6e1a1f;color:#f7efe4;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 0;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#f7efe4;color:#6e1a1f;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "Alexandria";z-index:2}
#logo{display:inline-block;padding:.5rem 1.3rem;background:#6e1a1f}
.wm{font:600 2.6rem/1.15 "Alexandria";color:#f7efe4}
.sub{font:500 .9rem "Playfair Display";letter-spacing:.5em;margin-inline-start:.5em;color:#f7efe4;direction:ltr}
.tg{margin:.9rem auto 0;max-width:290px;font:400 .95rem/1.8 "Alexandria";color:#f0d9c4}
.info{font-size:.74rem;color:#d9b9a3;margin:.2rem 0 0}
.tuwaiq{display:block;width:calc(100% + 2.4rem);height:84px;margin:1.2rem -1.2rem 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--maroon2);background:none;color:var(--maroon2);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .84rem "Alexandria"}
.chip[aria-pressed="true"]{background:#6e1a1f;border-color:#6e1a1f;color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--maroon2);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
/* the framed MENU board from their post: big serif title and a thin maroon frame */
section{position:relative;margin-top:2.4rem;scroll-margin-top:120px;border:1.5px solid var(--maroon2);border-top:0;padding:0 1rem 1rem}
h2{display:flex;align-items:center;gap:.8rem;margin:0 -1rem 1rem;font:600 2.2rem/1 "Playfair Display";color:var(--maroon2);direction:ltr}
h2::before,h2::after{content:"";flex:1;height:1.5px;background:var(--maroon2)}
h2::before{flex:0 0 1rem}
h2 small{font:500 .95rem "Alexandria";color:var(--soft)}
.dish{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish:nth-child(even) .plate{order:-1}
.dish .n{font:500 1.3rem "Alexandria";color:var(--maroon2);padding-bottom:.35rem;border-bottom:1.5px solid var(--maroon2);display:inline-block}
.dish .e{display:block;font:500 .78rem "Playfair Display";color:var(--soft);margin-top:.25rem;direction:ltr;text-align:right}
html[dir=ltr] .dish .e{text-align:left}
.dish p{margin:.45rem 0 0;font-size:.8rem;line-height:1.75;color:var(--soft)}
/* a round plate with the price badge, as in their menu */
.plate{position:relative;width:96px;height:96px;border-radius:50%;border:1.5px solid var(--maroon2);background:radial-gradient(circle,var(--card) 0 52%,#f1e2d3 53% 62%,var(--card) 63%)}
.plate i{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9a27c,#8a5a36)}
.plate b{position:absolute;bottom:-6px;inset-inline-start:-6px;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#6e1a1f;color:#fff;font:600 1rem "Alexandria"}
.plate b small{display:block;font-size:.45rem;font-weight:400;margin-top:-.2rem}
.nt{margin:1.4rem 0 0;text-align:center;font-size:.76rem;color:var(--soft)}
.prom{margin:2rem 0 0;text-align:center;font:500 1.05rem/1.8 "Alexandria";color:var(--maroon2)}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "tg": "وعدنا لكم بقهوة جبارة مثل شعب طويق ⛰️", "nt": "الحلى والأسعار من منيو وعد طويق المنشور · المشروبات تنضاف بسهولة", "prom": "قهوة جبارة… مثل شعب طويق"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "tg": "We promised you mighty coffee, like the people of Tuwaiq ⛰️", "nt": "Desserts and prices from Waad Tuwaiq's published menu · drinks can be added anytime", "prom": "Mighty coffee… like the people of Tuwaiq"}};
let lang="ar", active="all", query="";
const KEY="waad-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>MENU${lang==="ar"?`<small>${esc(c.ar)}</small>`:""}</h2>${body}</section>`; }
function item(i){ return `<div class="dish"><div><span class="n">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}<p>${esc(lang==="ar"?i.dAr:i.dEn)}</p></div><div class="plate"><i></i><b>${fmt(i.p)}<small>${cur()}</small></b></div></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="nt">${T[lang].nt}</p><p class="prom">${T[lang].prom}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
