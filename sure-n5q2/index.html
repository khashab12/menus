<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو شور</title>
<meta name="description" content="في كل رشفة، حكاية">
<meta property="og:title" content="منيو شور">
<meta property="og:description" content="في كل رشفة، حكاية">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/sure-n5q2/">
<meta property="og:image" content="https://khashab12.github.io/menus/sure-n5q2/logo.png">
<meta name="theme-color" content="#123f27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Noto+Kufi+Arabic:wght@300;400;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--green:#123f27;--green2:#1b5a37;--cream:#efe8d8;--ink:#1d2a22;--paper:#f4f0e6;--card:#fffdf7;--soft:#6c7568;--line:#ddd5c3;--gold:#b49a62}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0d1f15;--card:#14291c;--ink:#efe8d8;--soft:#a7b0a1;--line:#24402e}}
:root[data-theme="dark"]{--paper:#0d1f15;--card:#14291c;--ink:#efe8d8;--soft:#a7b0a1;--line:#24402e}
body{background:var(--paper);color:var(--ink);font-family:"Noto Kufi Arabic","Josefin Sans",system-ui,sans-serif;font-weight:300}
html[lang=en] body{font-family:"Josefin Sans","Noto Kufi Arabic",sans-serif}
.demo-note{background:var(--gold);color:#123f27;font-weight:400}
/* deep green poster with the Riyadh skyline in thin cream line art */
header{position:relative;text-align:center;color:#efe8d8;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 0;overflow:hidden;background:#123f27}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:none;color:#efe8d8;border:1px solid rgba(239,232,216,.5);border-radius:2px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:400 .78rem "Josefin Sans";letter-spacing:.14em;z-index:2}
#logo{display:inline-block;padding:.6rem 1.4rem .3rem;background:#123f27;direction:ltr}
.wm{font:300 4.2rem/1 "Josefin Sans";letter-spacing:.06em;margin-inline-start:.06em;color:#efe8d8}
.sub{font:400 .62rem "Josefin Sans";letter-spacing:.42em;color:#b49a62;margin-top:.15rem}
.tg{margin:.9rem 0 0;font:300 1.25rem "Josefin Sans";letter-spacing:.01em;direction:ltr}
html[lang=ar] .tg{font:300 1.05rem/1.7 "Noto Kufi Arabic";direction:rtl}
.info{font-size:.76rem;color:#c9c1ad;margin:.3rem 0 0}
.rule{display:flex;align-items:center;gap:.6rem;justify-content:center;margin:.9rem auto 0;width:200px;color:#b49a62}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:currentColor;opacity:.6}
.rule i{width:6px;height:6px;transform:rotate(45deg);background:currentColor}
.sky{display:block;width:calc(100% + 2.4rem);height:90px;margin:1rem -1.2rem 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:400 .82rem "Josefin Sans","Noto Kufi Arabic";letter-spacing:.06em}
.chip[aria-pressed="true"]{background:#123f27;border-color:#123f27;color:#efe8d8}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{text-align:center;margin:0 0 1rem;font:300 1.5rem "Josefin Sans";letter-spacing:.2em;text-transform:uppercase;direction:ltr}
h2 span{display:block;font:400 .9rem "Noto Kufi Arabic";letter-spacing:0;color:var(--soft);text-transform:none}
/* every item is a postage stamp, like their Saudi Latte post */
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.stamp{position:relative;background:var(--card);padding:.85rem .8rem .9rem;text-align:center;
 -webkit-mask:radial-gradient(circle 5px at 50% 0,#0000 98%,#000) 0 0/16px 51% repeat-x,radial-gradient(circle 5px at 50% 100%,#0000 98%,#000) 0 100%/16px 51% repeat-x;
 mask:radial-gradient(circle 5px at 50% 0,#0000 98%,#000) 0 0/16px 51% repeat-x,radial-gradient(circle 5px at 50% 100%,#0000 98%,#000) 0 100%/16px 51% repeat-x;filter:drop-shadow(0 1px 0 var(--line))}
.stamp .art{display:grid;place-items:center;height:78px;margin-bottom:.5rem;background:linear-gradient(180deg,#1b5a37,#123f27);color:#efe8d8}
.stamp .art svg{width:46px;height:46px}
.stamp b{display:block;font:400 .95rem "Josefin Sans","Noto Kufi Arabic";letter-spacing:.02em}
.stamp .a{display:block;font:300 .78rem "Noto Kufi Arabic";color:var(--soft);margin-top:.1rem}
.stamp .pr{display:block;margin-top:.35rem;font:600 .95rem "Josefin Sans";color:var(--green2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp .pr{color:var(--gold)}}
.stamp .pr small{font:400 .6rem "Noto Kufi Arabic";color:var(--soft);margin-inline-start:.2rem}
.stamp .sig{position:absolute;top:.55rem;inset-inline-end:.6rem;font:600 .55rem "Josefin Sans";letter-spacing:.12em;color:#123f27;background:#b49a62;padding:.12rem .4rem}
.quote{margin:2.2rem 0 0;text-align:center;font:300 1.35rem/1.25 "Josefin Sans";direction:ltr}
.quote span{display:block;font:300 .8rem "Noto Kufi Arabic";color:var(--soft);margin-top:.5rem;direction:rtl}
.visit a{border-radius:2px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "تصور تجريبي — الأسعار وبعض الأصناف أمثلة وليست منيو شور", "note": "", "tg": "في كل رشفة، حكاية", "q": "When it comes to good coffee… SURE is the only answer", "qs": "حي النخيل · يوميًا ٤ العصر – ١٢ الليل", "sig": "SIGNATURE"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — prices and some items are examples, not SURE's menu", "note": "", "tg": "in every sip, a story brews.", "q": "When it comes to good coffee… SURE is the only answer", "qs": "Al Nakheel · daily 4 PM – 12 AM", "sig": "SIGNATURE"}};
let lang="ar", active="all", query="";
const KEY="sure-lang";

try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

const ART={cold:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M13 14h22l-3 28H16z"/><path d="M11 14h26M15 9h18l2 5H13z"/><path d="M15 30h18"/></svg>`,hot:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M9 20h26v6a11 11 0 0 1-11 11h-4A11 11 0 0 1 9 26z"/><path d="M35 22h3a4 4 0 0 1 0 8h-4M17 10c0 3 3 3 3 6M24 8c0 3 3 3 3 6"/></svg>`,sweet:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="24" cy="24" r="13"/><circle cx="24" cy="24" r="7"/><path d="M24 11v6M24 31v6M11 24h6M31 24h6"/></svg>`};
function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(c.en)}${lang==="ar"?`<span>${esc(c.ar)}</span>`:""}</h2><div class="stamps">${body}</div></section>`; }
function item(i,k,c){ return `<div class="stamp">${i.s?`<span class="sig">${T[lang].sig}</span>`:""}<div class="art">${ART[c.id]||""}</div><b>${esc(lang==="ar"?i.ar:i.en)}</b>${lang==="ar"?`<span class="a">${esc(i.en)}</span>`:""}<span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="quote">${T[lang].q}<span>${T[lang].qs}</span></p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};

apply();
