<style>
:root{color-scheme:light}
:root{
  --primary:#183828; --on-primary:#f6f1e4; --secondary:#2c5a3f; --bg:#f6f1e4; --accent:#d9a441;
  --ink:#1c2a22; --muted:#5f6b62; --card:#fffdf7; --line:#e6dcc6;
  --display:system-ui,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{--bg:#0f1f16;--ink:#f1ead8;--muted:#b3b9a9;--card:#17291e;--line:#2a4232}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased}
.demo-note{background:var(--accent);color:#1d1400;text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
header.hero{position:relative;background:var(--primary);color:var(--on-primary);overflow:hidden;padding:3.4rem 1.25rem 3.6rem;text-align:center}
.pat{position:absolute;inset:0;opacity:.13;pointer-events:none;color:var(--accent)}
.hero-inner{position:relative;max-width:560px;margin:0 auto}
.emblem{width:180px;height:180px;margin:0 auto;border-radius:50%;border:2px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#21483a,#183828 70%)}
.emblem .script{font-family:"Parisienne",cursive;font-size:3.6rem;line-height:1;color:#fff}
.emblem .sub{font-size:.62rem;letter-spacing:.22em;margin-top:.4rem;opacity:.9}
.brand{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:1.1rem 0 0}
.tag{margin:.3rem 0 0;opacity:.85}
.info{margin:.7rem auto 0;font-size:.88rem;opacity:.75;max-width:36ch}
.logo{display:none}
.drip{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;display:block}
.awning{height:14px;background:repeating-linear-gradient(90deg,#f2c94c 0 22px,#fffdf7 22px 44px)}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:2;background:rgba(255,255,255,.1);color:var(--on-primary);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:.35rem .9rem;font:500 .85rem var(--body);cursor:pointer}
.lang:focus-visible,.chip:focus-visible,.search input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:.8rem 0 .6rem;box-shadow:0 6px 14px -12px rgba(0,0,0,.4)}
.search{max-width:720px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:.7rem 1rem;font:1rem var(--body)}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 1rem .1rem;max-width:720px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.4rem 1rem;font:500 .9rem var(--body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
main{max-width:720px;margin:0 auto;padding:.5rem 1rem 2.5rem}
section.cat{margin-top:1.8rem;display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.cat h2{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:1.4rem;margin:0;display:flex;align-items:center;gap:.5rem}
.cat h2::before{content:"";width:18px;height:20px;background:var(--accent);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.cat .sub{grid-column:1/-1;color:var(--muted);font-size:.88rem;margin:0}
.item{display:flex;flex-direction:column;gap:.25rem;padding:1rem .9rem;background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:118px}
.name{font-weight:700;font-size:1rem}
.desc{color:var(--muted);font-size:.85rem;margin:0}
.price{font-size:.95rem;color:var(--secondary)}
.price:empty{display:none}
.cal{display:none}
.item .act{margin-top:auto;align-self:flex-start;font:700 .82rem var(--body);color:var(--primary);background:var(--accent);border-radius:999px;padding:.35rem 1rem;text-decoration:none}
.pick{display:inline-block;margin-inline-start:.4rem;font-size:.68rem;font-weight:700;background:#f2c94c;color:#1d1400;border-radius:6px;padding:.05rem .4rem;vertical-align:middle}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem 1rem}
.team{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:14px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.visit a.wa{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.visit a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:1.5rem 1rem 2.5rem;border-top:1px solid var(--line)}
footer strong{color:var(--ink)}
@media (max-width:360px){section.cat{grid-template-columns:1fr}}

  store:{ar:{search:"ابحث عن منتج…",pick:"الأكثر مبيعاً",what:"المنتجات والأسعار",upd:"آخر تحديث: اليوم",made:"متجر من تصميم",wa:"اطلب على واتساب",act:"اطلب",team:"",bookText:"أهلاً، عايز أطلب:"},
         en:{search:"Search products…",pick:"Best seller",what:"products and prices",upd:"Last updated: today",made:"Store designed by",wa:"Order on WhatsApp",act:"Order",team:"",bookText:"Hi, I'd like to order:"}},
  beauty:{ar:{search:"ابحث عن خدمة…",pick:"الأكثر طلباً",what:"الخدمات والأسعار",upd:"آخر تحديث: اليوم",made:"موقع من تصميم",wa:"احجز على واتساب",act:"احجز",team:"الفريق",bookText:"السلام عليكم، أبغى أحجز:"},
          en:{search:"Search services…",pick:"Popular",what:"services and prices",upd:"Last updated: today",made:"Website designed by",wa:"Book on WhatsApp",act:"Book",team:"Our team",bookText:"Hello, I'd like to book:"}}
}[KIND] || null;
const T = {
  ar:{dir:"rtl",lang:"English",search:K.ar.search,pick:K.ar.pick,empty:"ما فيه نتيجة بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — ${K.ar.what} أمثلة وتتغير لبيانات ${C.nameAr||C.name} الحقيقية`,updated:K.ar.upd,credit:n=>`${K.ar.made} <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:K.en.search,pick:K.en.pick,empty:"Nothing matches that. Try another word.",all:"All",
      note:`Demo version — ${K.en.what} are samples, to be replaced with ${C.name}'s real ones`,updated:K.en.upd,credit:n=>`${K.en.made} <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("site-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      const nm=L(i,"ar","en"), wa=String(C.whatsapp||"").replace(/\D/g,"");
      const act=(K[lang].act&&wa)?`<a class="act" href="https://wa.me/${wa}?text=${encodeURIComponent(K[lang].bookText+" "+nm)}" target="_blank" rel="noopener">${K[lang].act}</a>`:"";
      html+=`<div class="item${i.img?" has-img":""}">${i.img?`<img class="thumb" src="${i.img}" alt="" loading="lazy">`:""}<div class="name">${esc(nm)}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${i.p!=null?`${i.priceFrom?(lang==="ar"?"من ":"from "):""}${fmt(i.p)} ${cur()}`:""}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}${act}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:K.ar.wa,map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:K.en.wa,map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  const tm=$("team"), team=C.team||[];
  tm.hidden=!(team.length&&K[lang].team);
  tm.innerHTML=team.length?`<h2>${K[lang].team}</h2><ul>${team.map(m=>`<li>${esc(L(m,"ar","en"))}${L(m,"roleAr","roleEn")?`<span>${esc(L(m,"roleAr","roleEn"))}</span>`:""}</li>`).join("")}</ul>`:"";
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("site-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
