<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو kahva</title>
<meta name="description" content="The Only Shots You Need">
<meta property="og:title" content="منيو kahva">
<meta property="og:description" content="The Only Shots You Need">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/kahva-z5w1/">
<meta name="theme-color" content="#1E3BD6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--blue:#1E3BD6;--navy:#0B1A6B;--wall:#F2F4FB;--white:#fff;--coral:#FF5A3C;--red:#E23B3B;--muted:#5b6390;--line:rgba(30,59,214,.18);
 --display:"Baloo Bhaijaan 2",system-ui,sans-serif;--body:"Baloo Bhaijaan 2",system-ui,sans-serif;--hand:"Permanent Marker",cursive}
body{background:var(--wall);color:var(--navy);font-family:var(--body)}
.demo-note{background:var(--navy);color:#fff}
header.hero{position:relative;overflow:hidden;background:var(--blue);color:#fff;padding:1.3rem 1rem 1.6rem}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;background:#fff;color:var(--blue);border:0;border-radius:999px;padding:.25rem .8rem;font:700 .8rem var(--body);cursor:pointer}
.tags{position:absolute;inset:0;pointer-events:none}
.tags span{position:absolute;font:400 1rem var(--hand);color:rgba(255,255,255,.28);direction:ltr}
.neon{direction:ltr;text-align:center;margin:1.8rem 0 0}
.neon b{display:inline-block;font:800 clamp(3rem,15vw,4.2rem)/1 var(--display);color:#fff;text-shadow:0 0 12px rgba(255,255,255,.7),0 0 26px rgba(140,170,255,.9);letter-spacing:.01em}
.neon b i{font-style:normal;position:relative}
.neon b i::before{content:"";position:absolute;left:12%;right:12%;top:.08em;height:.07em;background:#fff;border-radius:2px}
.shots{direction:ltr;text-align:center;font:400 1.1rem var(--hand);margin:.4rem 0 0;color:#dfe5ff}
.dude{display:block;width:120px;height:auto;margin:.8rem auto 0}
.hours{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.hours span{background:#fff;color:var(--blue);border-radius:999px;padding:.15rem .7rem;font:700 .8rem var(--body)}
.hours span.late{background:var(--coral);color:#fff}
.bar{position:sticky;top:0;z-index:5;background:rgba(242,244,251,.95);backdrop-filter:blur(6px);border-bottom:2px solid var(--blue);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:2px solid var(--blue);background:#fff;color:var(--navy);border-radius:14px;padding:.55rem .9rem;font:1rem var(--body)}
.search input:focus-visible{outline:3px solid var(--coral)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:.2rem .85rem;font:700 .88rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.chip:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.6rem}
.ch{display:inline-block;background:var(--blue);color:#fff;border-radius:14px 14px 14px 4px;padding:.25rem .9rem;margin-bottom:.7rem;transform:rotate(-1.5deg)}
.ch h2{margin:0;font:800 1.2rem var(--display)}
.ch small{direction:ltr;display:block;font:400 .75rem var(--hand);opacity:.85}
.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.stk{position:relative;background:#fff;border:2.5px solid var(--navy);border-radius:18px;padding:.6rem .7rem .55rem;box-shadow:3px 3px 0 var(--navy)}
.stk:nth-child(3n+2){transform:rotate(1.2deg)}.stk:nth-child(3n){transform:rotate(-1deg)}
.stk .nm{display:block;font:800 .98rem/1.25 var(--display)}
.stk .en{direction:ltr;display:block;font:600 .7rem var(--body);color:var(--muted)}
.stk .pr{display:inline-block;margin-top:.35rem;background:var(--blue);color:#fff;border-radius:999px;padding:0 .6rem;font:800 .9rem var(--body)}
.stk.pk{background:#FFF1EC;border-color:var(--coral);box-shadow:3px 3px 0 var(--coral)}
.pick{position:absolute;top:-10px;inset-inline-end:8px;background:var(--coral);color:#fff;border-radius:999px;padding:0 .5rem;font:700 .66rem var(--body);transform:rotate(6deg)}
.visit a{background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:999px}
.visit a:first-child{background:var(--blue);color:#fff}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem}
footer strong{color:var(--navy)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "kahva", "nameAr": "kahva", "tagline": {"ar": "The Only Shots You Need", "en": "The Only Shots You Need"}, "info": {"ar": "تريفيوم سكوير، التسعين الشمالي، التجمع · من ٧ الصبح لـ ١ بالليل", "en": "Trivium Square, N Teseen, New Cairo · 7 AM – 1 AM"}, "logo": null, "colors": {"primary": "#1E3BD6", "onPrimary": "#FFFFFF", "secondary": "#0B1A6B", "background": "#F2F4FB", "accent": "#FF5A3C"}, "fonts": {"display": "Baloo Bhaijaan 2", "body": "Baloo Bhaijaan 2"}, "pattern": "none", "currency": {"ar": "ج.م", "en": "EGP"}, "demoBanner": true, "credit": "محمد", "mapsUrl": "https://maps.google.com/?cid=12473638425914040603", "instagram": "https://www.instagram.com/kahva.eg/", "categories": [{"id": "hot", "ar": "قهوة سخنة", "en": "Hot Coffee", "items": [{"ar": "إسبريسو", "en": "Espresso", "p": 75}, {"ar": "ماكياتو", "en": "Macchiato", "p": 85}, {"ar": "أمريكانو", "en": "Americano", "p": 85}, {"ar": "كورتادو", "en": "Cortado", "p": 95}, {"ar": "فلات وايت", "en": "Flat White", "p": 100}, {"ar": "كابتشينو", "en": "Cappuccino", "p": 105}, {"ar": "لاتيه", "en": "Latte", "p": 110}, {"ar": "سبانش لاتيه", "en": "Spanish Latte", "p": 130}, {"ar": "تيراميسو لاتيه", "en": "Tiramisu Latte", "p": 150}, {"ar": "كيندر بوينو لاتيه", "en": "Kinder Bueno Latte", "p": 150, "pick": true}]}, {"id": "matcha", "ar": "الماتشا", "en": "The Matcha", "items": [{"ar": "ماتشا لاتيه سخن", "en": "Hot Matcha Latte", "p": 130}, {"ar": "سبانش ماتشا سخن", "en": "Hot Spanish Matcha", "p": 135}, {"ar": "فرنش فانيلا ماتشا سخن", "en": "Hot French Vanilla Matcha", "p": 135}, {"ar": "وايت شوكليت ماتشا سخن", "en": "Hot White Chocolate Matcha", "p": 150}]}, {"id": "v60", "ar": "V60 كاهفا", "en": "Kahva Specialty V60", "items": [{"ar": "كولد برو", "en": "Cold Brew", "p": 100}, {"ar": "كولومبيان بينك بوربون", "en": "Colombian Pink Bourbon", "p": 135}, {"ar": "إثيوبيان جوجي", "en": "Ethiopian Guji", "p": 150}, {"ar": "كاهفا ريد آي", "en": "Kahva Redeye", "p": 150}, {"ar": "مانجو", "en": "Mango", "p": 160}, {"ar": "سانجريا", "en": "Sangria", "p": 170, "pick": true}, {"ar": "شيري راسبيري", "en": "Cherry Raspberry", "p": 180}]}, {"id": "cool", "ar": "ريفريشمنت", "en": "Refreshments", "items": [{"ar": "آيس تي خوخ", "en": "Iced Tea Peach", "p": 130}, {"ar": "آيس تي مانجو", "en": "Iced Tea Mango", "p": 130}, {"ar": "آيس تي باشن فروت", "en": "Iced Tea Passion Fruit", "p": 130}]}, {"id": "non", "ar": "من غير قهوة", "en": "Non Coffee", "items": [{"ar": "مياه", "en": "Water", "p": 20}, {"ar": "شاي", "en": "Tea", "p": 55}, {"ar": "ريدبول", "en": "Redbull", "p": 90}, {"ar": "سيجنتشر هوت شوكليت", "en": "Signature Hot Chocolate", "p": 150}, {"ar": "بطاطا", "en": "Sweet Potato", "p": 175}, {"ar": "هوت شوكليت فراولة", "en": "Strawberry Hot Chocolate", "p": 180}, {"ar": "بلجيكان هوت شوكليت", "en": "Belgian Hot Chocolate", "p": 180}]}, {"id": "bite", "ar": "ساندوتشات", "en": "Kahva Sandwich", "items": [{"ar": "تونة", "en": "Tuna Sandwich", "p": 190}, {"ar": "تركي وشيدر", "en": "Turkey & Cheddar", "p": 200}, {"ar": "روست بيف", "en": "Roast Beef Sandwich", "p": 200, "pick": true}, {"ar": "حلومي", "en": "Halloumi Sandwich", "p": 220}]}, {"id": "sweet", "ar": "حلو", "en": "Desserts", "items": [{"ar": "إكلير شوكولاتة", "en": "Chocolate Eclair", "p": 100}, {"ar": "إكلير بستاشيو", "en": "Pistachio Eclair", "p": 110}, {"ar": "هاني كيك", "en": "Honey Cake", "p": 130}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const DUDE=`<svg class="dude" viewBox="0 0 120 130" aria-hidden="true"><rect x="38" y="30" width="44" height="88" rx="10" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="3"/><rect x="41" y="62" width="38" height="52" rx="7" fill="#FFB21E"/><path d="M60 8l6 60" stroke="#FF5A3C" stroke-width="5" stroke-linecap="round"/><rect x="46" y="44" width="12" height="12" rx="2" fill="rgba(255,255,255,.7)"/><rect x="62" y="50" width="12" height="12" rx="2" fill="rgba(255,255,255,.55)"/><circle cx="52" cy="80" r="7" fill="#FFE27A" stroke="#fff" stroke-width="2"/><text x="60" y="104" text-anchor="middle" font-family="Baloo Bhaijaan 2,sans-serif" font-weight="800" font-size="13" fill="#1E3BD6">kahva</text></svg>`;
function renderHero(){
  const ar=lang==="ar";
  const tags=[["ORDER HERE","6%","30%",-8],["brewtiful","70%","14%",6],["bean around","8%","72%",-4],["☆","82%","64%",0],["kahva goodies","58%","86%",-3]];
  $("heroInner").innerHTML=`<div class="tags" aria-hidden="true">${tags.map(t=>`<span style="left:${t[1]};top:${t[2]};transform:rotate(${t[3]}deg)">${t[0]}</span>`).join("")}</div>
   <div class="neon"><b>k<i>a</i>hva</b></div><p class="shots">— The Only Shots You Need —</p>${DUDE}
   <div class="hours"><span>${ar?"تريفيوم سكوير، التجمع":"Trivium Square, New Cairo"}</span><span>${ar?"٧ الصبح – ١ بالليل":"7 AM – 1 AM"}</span></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch"><h2>${esc(L(c,"ar","en"))}</h2>${lang==="ar"?`<small>${esc(c.en)}</small>`:""}</div><div class="sheet">`;
    for(const i of items){
      html+=`<article class="stk${i.pick?" pk":""}">${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}<span class="nm">${esc(L(i,"ar","en"))}</span>${lang==="ar"?`<span class="en">${esc(i.en)}</span>`:""}<span class="pr">${fmt(i.p)} ${cur()}</span></article>`;}
    html+="</div></section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${lang==="ar"?"مفيش صنف بالاسم ده، جرب كلمة تانية.":T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف والأسعار من الـ PDF بتاعكم (٣١ مارس)، ونحدّثها بأسعار النهارده";
T.en.note="Preview: items and prices from your menu PDF (31 March), to be updated to today's prices";
T.ar.search="عايز تشرب ايه؟";
T.ar.pick="جرّبه";T.en.pick="Try it";
T.ar.updated="آخر تحديث للأسعار: النهارده";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"kahva-z5w1"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
