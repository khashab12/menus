<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو ميلانا</title>
<meta name="description" content="Café &amp; More">
<meta property="og:title" content="منيو ميلانا">
<meta property="og:description" content="Café &amp; More">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/milana-h5r2/">
<meta name="theme-color" content="#15110E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--night:#15110E;--night2:#1d1814;--velvet:#1F4E4A;--velvet2:#2a6560;--amber:#E8A857;--cream:#F5EBDD;--muted:#b8a996;--line:rgba(232,168,87,.22);
 --display:"Aref Ruqaa",serif;--body:"Almarai",system-ui,sans-serif}
body{background:var(--night);color:var(--cream);font-family:var(--body)}
.demo-note{background:var(--amber);color:#1d1400}
header.hero{position:relative;text-align:center;padding:3.4rem 1.2rem 2rem;background:radial-gradient(90% 60% at 50% 18%,rgba(232,168,87,.22),transparent 70%),var(--night)}
.lights{position:absolute;top:0;left:0;width:100%;height:70px}
.lights .b{animation:glow 3.2s ease-in-out infinite}
.lights .b:nth-child(odd){animation-delay:1.6s}
@keyframes glow{50%{opacity:.55}}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:2;background:transparent;color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:.3rem .9rem;font:700 .82rem var(--body);cursor:pointer}
.script{direction:ltr;font:400 clamp(3.6rem,19vw,5.4rem)/1 "Great Vibes",cursive;color:#fff;margin:.6rem 0 0;text-shadow:0 0 22px rgba(232,168,87,.55)}
.script.ar{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(3rem,16vw,4.4rem)}
.more{direction:ltr;font:400 1.35rem "Great Vibes",cursive;color:var(--amber);margin:-.2rem 0 0}
.info{color:var(--muted);font-size:.86rem;margin:.9rem 0 0}
.gift{display:inline-block;margin-top:1rem;border:1px dashed var(--amber);color:var(--amber);border-radius:999px;padding:.3rem .9rem;font-size:.82rem}
.clear{max-width:640px;margin:0 auto 0;padding:.8rem 1rem}
.clear div{background:var(--velvet);border-radius:14px;padding:.8rem 1rem;font-size:.88rem;display:flex;gap:.7rem;align-items:flex-start;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.clear b{color:var(--amber)}
.bar{position:sticky;top:0;z-index:5;background:rgba(21,17,14,.96);backdrop-filter:blur(6px);padding:.7rem 0 .55rem;border-bottom:1px solid var(--line)}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1px solid var(--line);background:var(--night2);color:var(--cream);border-radius:999px;padding:.6rem 1.1rem;font:1rem var(--body)}
.search input::placeholder{color:#8f8272}
.search input:focus-visible{outline:2px solid var(--amber)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.6rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--velvet);color:var(--cream);border-radius:999px;padding:.4rem 1rem;font:700 .88rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber);color:#1d1400}
.chip:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 2rem}
section.cat{margin-top:1.8rem}
.cat h2{font:700 2rem var(--display);color:var(--amber);margin:0 0 .6rem;text-align:center}
.cat h2 small{display:block;direction:ltr;font:400 1.1rem "Great Vibes",cursive;color:var(--muted);margin-top:-.5rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.card{position:relative;background:linear-gradient(160deg,var(--velvet2),var(--velvet));border-radius:18px 18px 18px 4px;padding:1rem .85rem .85rem;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px rgba(232,168,87,.3)}
.card .nm{font-weight:800;font-size:.98rem;line-height:1.35}
.card .ds{color:#cfe0dc;font-size:.76rem;margin:.25rem 0 0}
.card .pr{margin-top:.6rem;font-weight:800;color:var(--amber)}
.pick{position:absolute;top:-.55rem;inset-inline-start:.7rem;font-size:.66rem;font-weight:800;background:var(--amber);color:#1d1400;border-radius:999px;padding:.05rem .5rem}
.visit a{background:var(--night2);color:var(--cream);border:1px solid var(--line)}
.visit a.wa{background:var(--amber);color:#1d1400;border-color:var(--amber)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.5rem 1rem 2.5rem;border-top:1px solid var(--line)}
footer strong{color:var(--cream)}
@media (max-width:340px){.grid{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <svg class="lights" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 Q50 44 100 12 T200 12 T300 12 T400 10" fill="none" stroke="#5a4a3a" stroke-width="1.2"/><circle class="b" cx="10" cy="28.1" r="4.2" fill="#FFC871"/><circle class="b" cx="36" cy="15.7" r="4.2" fill="#FFC871"/><circle class="b" cx="62" cy="15.0" r="4.2" fill="#FFC871"/><circle class="b" cx="88" cy="27.0" r="4.2" fill="#FFC871"/><circle class="b" cx="114" cy="25.9" r="4.2" fill="#FFC871"/><circle class="b" cx="140" cy="14.3" r="4.2" fill="#FFC871"/><circle class="b" cx="166" cy="16.5" r="4.2" fill="#FFC871"/><circle class="b" cx="192" cy="29.2" r="4.2" fill="#FFC871"/><circle class="b" cx="218" cy="23.8" r="4.2" fill="#FFC871"/><circle class="b" cx="244" cy="13.1" r="4.2" fill="#FFC871"/><circle class="b" cx="270" cy="18.1" r="4.2" fill="#FFC871"/><circle class="b" cx="296" cy="31.6" r="4.2" fill="#FFC871"/><circle class="b" cx="322" cy="21.8" r="4.2" fill="#FFC871"/><circle class="b" cx="348" cy="12.2" r="4.2" fill="#FFC871"/><circle class="b" cx="374" cy="19.9" r="4.2" fill="#FFC871"/></svg>
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<section class="clear" id="clear"></section>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "Milana", "nameAr": "ميلانا", "tagline": {"ar": "Café & More", "en": "Café & More"}, "info": {"ar": "ويست جيت بيزنس هب، ٦ أكتوبر", "en": "West Gate Business Hub, 6th of October"}, "logo": null, "colors": {"primary": "#15110E", "onPrimary": "#F5EBDD", "secondary": "#1F4E4A", "background": "#15110E", "accent": "#E8A857"}, "fonts": {"display": "Aref Ruqaa", "body": "Almarai"}, "pattern": "none", "currency": {"ar": "ج.م", "en": "EGP"}, "demoBanner": true, "credit": "محمد", "whatsapp": "201035363363", "mapsUrl": "https://maps.google.com/?cid=18105330188053300493", "categories": [{"id": "coffee", "ar": "قهوة", "en": "Coffee", "items": [{"ar": "إسبريسو", "en": "Espresso", "dAr": "لافاتزا", "dEn": "Lavazza", "p": 60}, {"ar": "كابتشينو", "en": "Cappuccino", "p": 85, "pick": true}, {"ar": "لاتيه", "en": "Latte", "p": 90}, {"ar": "آيس وايت موكا", "en": "Iced White Mocha", "p": 110}, {"ar": "قهوة تركي", "en": "Turkish Coffee", "p": 50}]}, {"id": "fresh", "ar": "فريش وكوكتيل", "en": "Fresh & Cocktails", "items": [{"ar": "كوكتيل فواكه", "en": "Fruit Cocktail", "dAr": "طبقات فراولة ومانجا وكيوي", "dEn": "Strawberry, mango & kiwi layers", "p": 95, "pick": true}, {"ar": "موهيتو", "en": "Mojito", "p": 85}, {"ar": "عصير فراولة", "en": "Strawberry Juice", "p": 75}]}, {"id": "shisha", "ar": "شيشة", "en": "Shisha", "items": [{"ar": "شيشة فواكه", "en": "Fruit Shisha", "dAr": "مثال لحد ما نحط أنواعكم", "dEn": "Sample until we add yours", "p": 90}, {"ar": "شيشة معسل", "en": "Classic Shisha", "dAr": "مثال لحد ما نحط أنواعكم", "dEn": "Sample until we add yours", "p": 70}]}, {"id": "sweet", "ar": "حلو ومخبوزات", "en": "Sweets & Bakery", "items": [{"ar": "كوكيز", "en": "Cookies", "p": 45}, {"ar": "تشيز كيك", "en": "Cheesecake", "dAr": "مثال لحد ما نحط أصنافكم", "dEn": "Sample", "p": 110}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


function renderHero(){
  const info=C.info||{};
  $("heroInner").innerHTML=`<h1 class="script${lang==="ar"?" ar":""}">${lang==="ar"?"ميلانا":"Milana"}</h1><p class="more">Café &amp; More</p>
   <p class="info">${esc(info[lang]||"")}</p><span class="gift">${lang==="ar"?"الفشار ضيافة من البيت":"Popcorn on the house"}</span>`;
  $("clear").innerHTML=`<div><b>٪</b><span>${lang==="ar"?"<b>السعر اللي قدامك هو اللي هتدفعه.</b> هنا بنكتب بوضوح لو فيه خدمة أو ضريبة، عشان محدش يتفاجئ في الحساب.":"<b>The price you see is the price you pay.</b> Service and tax are stated clearly here, so the bill holds no surprises."}</span></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}${lang==="ar"?`<small>${esc(c.en)}</small>`:""}</h2><div class="grid">`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="card">${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}<div><div class="nm">${esc(L(i,"ar","en"))}</div>${d?`<p class="ds">${esc(d)}</p>`:""}</div><div class="pr">${fmt(i.p)} ${cur()}</div></div>`;}
    html+="</div></section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${lang==="ar"?"مفيش صنف بالاسم ده، جرب كلمة تانية.":T[lang].empty}</p>`;
}
T.ar.note="نسخة تجريبية للعرض: الأصناف من صوركم على جوجل، والأسعار أمثلة لحد ما نحط أسعاركم";
T.ar.search="بتدور على ايه؟";
T.ar.pick="جرّبه";
T.ar.updated="آخر تحديث للأسعار: النهارده";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"milana-h5r2"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
