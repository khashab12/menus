<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو لينور</title>
<meta name="description" content="Special Coffee">
<meta property="og:title" content="منيو لينور">
<meta property="og:description" content="Special Coffee">
<meta property="og:type" content="website">
<meta property="og:image" content="https://khashab12.github.io/menus/linor-k2w6/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://khashab12.github.io/menus/linor-k2w6/og.png">
<meta property="og:url" content="https://khashab12.github.io/menus/linor-k2w6/">
<meta name="theme-color" content="#B5531F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Almarai:wght@400;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--rust:#B5531F;--rust2:#9C4416;--brown:#5B2A12;--amber:#E9A23B;--cream:#FFF4EA;--sand:#F6E3D2;--olive:#5E6B3A;--ink:#2A140A;--muted:#7a5a48;--line:rgba(91,42,18,.16);
 --display:"Marcellus",Georgia,serif;--body:"Almarai",system-ui,sans-serif}
body{background:var(--cream);color:var(--ink);font-family:var(--body)}
.demo-note{background:var(--brown);color:var(--cream)}
header.hero{position:relative;overflow:hidden;background:var(--rust);color:var(--cream);padding:1.2rem 1rem 0}
.swirl{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;background:var(--cream);color:var(--rust);border:0;border-radius:999px;padding:.2rem .8rem;font:700 .78rem var(--body);cursor:pointer}
.hero-c{position:relative;z-index:1;text-align:center;padding:2rem 0 1.4rem}
.mono{width:62px;height:62px}
.wm{direction:ltr;font:400 2.5rem/1 var(--display);letter-spacing:.32em;margin:.5rem 0 0;padding-left:.32em}
.sub{direction:ltr;font:700 .66rem var(--body);letter-spacing:.5em;margin:.35rem 0 0;opacity:.9}
.info{font-size:.84rem;margin:.9rem auto 0;background:rgba(42,20,10,.28);display:inline-block;padding:.3rem .8rem;border-radius:999px}
.zig{height:18px;background:repeating-linear-gradient(90deg,var(--cream) 0 6px,transparent 6px 12px);opacity:.9;position:relative;z-index:1}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,244,234,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1.5px solid var(--rust);background:#fff;color:var(--ink);border-radius:12px;padding:.55rem .9rem;font:1rem var(--body)}
.search input:focus-visible{outline:2px solid var(--amber)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--rust);background:transparent;color:var(--rust);border-radius:999px;padding:.25rem .85rem;font:700 .82rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--rust);color:var(--cream)}
.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.6rem}
.ch{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--rust);padding-bottom:.35rem;margin-bottom:.4rem}
.ch h2{margin:0;font:800 1.2rem var(--body);color:var(--rust)}
.ch span{direction:ltr;font:400 .8rem var(--display);letter-spacing:.2em;color:var(--brown);text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr auto;gap:.05rem .8rem;padding:.6rem .1rem;border-bottom:1px dashed var(--line);align-items:center}
.row .nm{font:700 1rem var(--body)}
.row .en{direction:ltr;display:block;font:400 .8rem var(--display);color:var(--muted)}
.row .pr{font:800 1.1rem var(--body);color:var(--rust);white-space:nowrap}
.row .pr small{font:700 .68rem var(--body);color:var(--muted)}
.cal{grid-column:1/-1;display:flex;align-items:center;gap:.45rem;font-size:.72rem;color:var(--muted)}
.cal i{display:inline-block;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--amber),var(--rust))}
.row.pk{background:var(--sand);border-radius:12px;padding:.6rem .7rem;border-bottom:0;margin:.3rem 0}
.star{color:var(--amber);margin-inline-start:.3rem}
.visit a{background:#fff;color:var(--rust);border:1.5px solid var(--rust);border-radius:12px}
.visit a.wa{background:var(--rust);color:var(--cream)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem}
footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <svg class="swirl" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke-width="16" stroke-linecap="round">
      <path d="M-20 60 C80 0 140 140 240 80 S380 20 440 90" stroke="#E9A23B"/>
      <path d="M-20 100 C80 40 140 180 240 120 S380 60 440 130" stroke="#FFF4EA" opacity=".55"/>
      <path d="M-20 140 C80 80 140 220 240 160 S380 100 440 170" stroke="#5B2A12"/>
      <path d="M-20 180 C80 120 140 260 240 200 S380 140 440 210" stroke="#E9A23B" opacity=".8"/>
      <path d="M-20 220 C80 160 140 300 240 240 S380 180 440 250" stroke="#FFF4EA" opacity=".4"/>
      <path d="M-20 260 C80 200 140 340 240 280 S380 220 440 290" stroke="#5B2A12" opacity=".8"/>
    </g>
  </svg>
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
  <div class="zig" aria-hidden="true"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "LINOR", "nameAr": "لينور", "tagline": {"ar": "Special Coffee", "en": "Special Coffee"}, "info": {"ar": "حي الشفا، الرياض · يومياً لين ١٢ بالليل", "en": "Al Shifa, Riyadh · Daily until midnight"}, "logo": null, "colors": {"primary": "#B5531F", "onPrimary": "#FFF4EA", "secondary": "#5B2A12", "background": "#FFF4EA", "accent": "#E9A23B"}, "fonts": {"display": "Marcellus", "body": "Almarai"}, "pattern": "none", "currency": {"ar": "ر.س", "en": "SAR"}, "demoBanner": true, "credit": "محمد", "whatsapp": "966503452242", "mapsUrl": "https://maps.google.com/?cid=14386116801517930909", "reviewUrl": "https://maps.google.com/?cid=14386116801517930909", "categories": [{"id": "black", "ar": "مشروبات حارة", "en": "Hot Drinks · Black", "items": [{"ar": "قهوة اليوم صغير", "en": "Coffee Day Small", "p": 10, "cal": 3}, {"ar": "قهوة اليوم كبير", "en": "Coffee Day Large", "p": 13, "cal": 3}, {"ar": "قهوة مقطرة حار", "en": "V60 Hot", "p": 18, "cal": 3}, {"ar": "امريكانو", "en": "Americano", "p": 12, "cal": 4}, {"ar": "اسبريسو كلاسيك", "en": "Espresso Classic", "p": 11, "cal": 5}, {"ar": "اسبريسو اليمن", "en": "Espresso Yemen", "p": 15, "cal": 5, "pick": true}]}, {"id": "white", "ar": "مشروبات الحليب", "en": "White Drinks", "items": [{"ar": "لاتيه حار", "en": "Hot Latte", "p": 16, "cal": 65}, {"ar": "فلات وايت", "en": "Flat White", "p": 15, "cal": 60}, {"ar": "كابتشينو", "en": "Cappuccino", "p": 15, "cal": 60}]}, {"id": "cold", "ar": "مشروبات باردة", "en": "Cold Drinks", "items": [{"ar": "قهوة اليوم", "en": "Coffee Day", "p": 13, "cal": 3}, {"ar": "قهوة مقطرة بارد", "en": "Ice V60", "p": 20, "cal": 3}, {"ar": "امريكانو", "en": "American", "p": 12, "cal": 5}, {"ar": "فريدو اسبريسو كلاسيك", "en": "Freddo Espresso Classic", "p": 14, "cal": 50}, {"ar": "فريدو اسبريسو اليمن", "en": "Freddo Espresso Yemen", "p": 18, "cal": 50}, {"ar": "لاتيه بارد", "en": "Ice Latte", "p": 16, "cal": 60}, {"ar": "سبانيش بارد", "en": "Ice Spanish", "p": 20, "cal": 100}]}, {"id": "special", "ar": "المشروبات الخاصة", "en": "Special Drinks", "items": [{"ar": "كركدية بارد", "en": "Ice Hibiscus", "p": 20, "cal": 22, "pick": true}, {"ar": "ماتشا لينور", "en": "Matcha Linor", "p": 26, "cal": 95}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const MONO=`<svg class="mono" viewBox="0 0 60 60" aria-hidden="true"><g fill="none" stroke="#FFF4EA" stroke-width="3.2" stroke-linecap="square"><path d="M18 8v40h14"/><path d="M28 8h14l-10 22"/><path d="M42 30v22"/><path d="M14 4h6M34 4h6"/></g></svg>`;
function renderHero(){
  $("heroInner").innerHTML=`<div class="hero-c">${MONO}<p class="wm">LINOR</p><p class="sub">SPECIAL COFFEE</p><p class="info">${esc((C.info||{})[lang]||"")}</p></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0; const ar=lang==="ar";
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch"><h2>${esc(L(c,"ar","en"))}</h2>${ar?`<span>${esc(c.en)}</span>`:""}</div>`;
    for(const i of items){
      html+=`<div class="row${i.pick?" pk":""}"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="star" title="${T[lang].pick}">✦</span>`:""}${ar?`<span class="en">${esc(i.en)}</span>`:""}</div><span class="pr">${fmt(i.p)} <small>${cur()}</small></span>${i.cal!=null?`<div class="cal"><i style="width:${Math.max(8,Math.round(i.cal/100*90))}px"></i>${fmt(i.cal)} ${ar?"سعرة حرارية":"kcal"}</div>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف والأسعار والسعرات من منيوكم المطبوع، ونعدل أي شي تبونه";
T.en.note="Preview: items, prices and calories from your printed menu, anything can be changed";
T.ar.search="وش تبي تشرب اليوم؟";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"linor-k2w6"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
