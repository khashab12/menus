<html lang="ar" dir="rtl">
<head>

<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--esp:#2a1611;--wood:#8a5a36;--wood2:#a8744a;--cream:#efe3d2;--paper:#f6efe5;--card:#fffaf2;--ink:#2a1611;--soft:#7a6656;--line:#e5d8c6;--maroon:#7a1f22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161009;--card:#20170f;--ink:#efe3d2;--soft:#b8a491;--line:#33261b;--maroon:#d0666a}}
:root[data-theme="dark"]{--paper:#161009;--card:#20170f;--ink:#efe3d2;--soft:#b8a491;--line:#33261b;--maroon:#d0666a}
body{background:var(--paper);color:var(--ink);font-family:"El Messiri","Josefin Sans",system-ui,sans-serif}
html[lang=en] body{font-family:"Josefin Sans","El Messiri",sans-serif}
.demo-note{background:#2a1611;color:#efe3d2}
/* the shopfront: vertical wood slats, the round logo above an arched door */
header{position:relative;text-align:center;color:#efe3d2;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 0;overflow:hidden;
 background:repeating-linear-gradient(90deg,#7a4d2d 0 9px,#9a643c 9px 15px,#6e4428 15px 17px)}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#2a1611;color:#efe3d2;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:400 .8rem "Josefin Sans";letter-spacing:.06em;z-index:2}
#logo{display:inline-grid;place-items:center;width:156px;height:156px;border-radius:50%;background:#2a1611;box-shadow:0 0 0 6px rgba(42,22,17,.35);direction:ltr}
.mk{display:flex;align-items:center;gap:.25rem}
.walker{width:30px;height:44px}
.wm{font:400 2.2rem/1 "Josefin Sans";letter-spacing:.08em;color:#efe3d2}
.scr{font:400 .82rem "Gochi Hand";color:#d8c4a8;margin-top:.15rem}
/* arched door holding the tagline */
.door{position:relative;width:200px;margin:1.3rem auto 0;padding:1.3rem 1rem 1.6rem;background:#2a1611;border-radius:100px 100px 0 0;border:5px solid #c79a6a;border-bottom:0}
.tg{margin:0;font:600 1.3rem "El Messiri"}
.tg small{display:block;font:300 .82rem "Josefin Sans";letter-spacing:.1em;color:#d8c4a8;margin-top:.15rem;direction:ltr}
.info{position:relative;z-index:1;font-size:.72rem;color:#d8c4a8;margin:.6rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--line);color:var(--ink);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .86rem "El Messiri","Josefin Sans"}
.chip[aria-pressed="true"]{background:#2a1611;color:#efe3d2}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--wood);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
.offer{margin:1.4rem 0 0;display:flex;align-items:center;gap:.9rem;background:var(--card);border:1.5px dashed var(--wood2);border-radius:14px;padding:.8rem 1rem}
.offer b{display:grid;place-items:center;flex:0 0 auto;width:62px;height:62px;border-radius:50%;background:var(--maroon);color:#fff;font:600 1.6rem/1 "El Messiri"}
.offer b small{font-size:.55rem;display:block}
.offer span{font-weight:500;line-height:1.5}
section{margin-top:2rem;scroll-margin-top:120px}
/* each section opens with a small arch like their door */
h2{display:flex;align-items:flex-end;gap:.7rem;margin:0 0 .6rem;font:600 1.3rem "El Messiri"}
h2 i{flex:0 0 auto;width:26px;height:32px;border:2px solid var(--wood);border-bottom:0;border-radius:13px 13px 0 0;background:repeating-linear-gradient(90deg,transparent 0 4px,rgba(138,90,54,.35) 4px 6px)}
h2 small{font:300 .8rem "Josefin Sans";letter-spacing:.14em;color:var(--soft);text-transform:uppercase;direction:ltr;margin-inline-start:auto}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:baseline;padding:.55rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm .a{display:block;font-weight:500}
.nm .e{display:block;font:300 .8rem "Josefin Sans";color:var(--soft);direction:ltr;text-align:start}
html[dir=rtl] .nm .e{text-align:right}
.pr{font:600 1rem "Josefin Sans";white-space:nowrap;direction:ltr}
.pr small{font:300 .62rem "El Messiri";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.sm{margin:2rem 0 0;text-align:center;font:400 1.5rem "Gochi Hand";color:var(--wood);direction:ltr}
.sm span{display:block;font:400 .8rem "El Messiri";color:var(--soft);direction:rtl}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
