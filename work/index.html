<style>
:root{--bg:#f7f6f2;--card:#ffffff;--ink:#16161a;--soft:#5d5d66;--line:#e6e3dc;--acc:#ff5a1f;--acc2:#1f3cff;--chip:#efece5}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f12;--card:#17171c;--ink:#f2f1ee;--soft:#a3a3ad;--line:#26262d;--chip:#1e1e24}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7}
html[lang=en] body{font-family:"Space Grotesk","IBM Plex Sans Arabic",sans-serif}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font:700 1.15rem "Space Grotesk";letter-spacing:-.01em;direction:ltr}.logo b{color:var(--acc)}
.nl{display:flex;gap:18px;align-items:center;font-size:.92rem}.nl a{text-decoration:none;color:var(--soft)}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font:600 .82rem inherit}
@media (max-width:600px){.nl a{display:none}}
header{padding:72px 0 40px}
.tag{display:inline-flex;gap:8px;align-items:center;background:var(--chip);border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--soft)}
.tag i{width:8px;height:8px;border-radius:50%;background:#1fbf5a;box-shadow:0 0 0 4px rgba(31,191,90,.18)}
h1{font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.15;margin:18px 0 14px;letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.12rem;color:var(--soft);max-width:640px;margin:0}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:600;text-decoration:none}
.btn.p{background:var(--ink);color:var(--bg)}.btn.s{border:1px solid var(--line);background:var(--card)}
.stack{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px;direction:ltr;justify-content:flex-end}
html[dir=ltr] .stack{justify-content:flex-start}
.stack span{font:500 .8rem "Space Grotesk";border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--soft)}
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);margin:0 0 6px}
.sub{color:var(--soft);margin:0 0 28px}
.grid{display:grid;gap:16px}
.svc{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--chip);font-size:1.3rem;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:1.08rem}.card p{margin:0;color:var(--soft);font-size:.95rem}
.card ul{margin:10px 0 0;padding-inline-start:18px;color:var(--soft);font-size:.9rem}
.feat{display:grid;grid-template-columns:1.1fr 1fr;gap:0;overflow:hidden;padding:0}
@media (max-width:760px){.feat{grid-template-columns:1fr}}
.feat .vis{background:linear-gradient(135deg,#a60e16,#6b080d);color:#fff;display:grid;place-items:center;padding:34px;min-height:260px;position:relative}
.book{width:180px;height:240px;border-radius:6px 14px 14px 6px;background:#fff8ec;box-shadow:12px 14px 0 rgba(0,0,0,.18),inset 10px 0 0 #d29c42;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a60e16;font:700 2rem "IBM Plex Sans Arabic"}
.book small{font:500 .8rem "IBM Plex Sans Arabic";color:#c88d2f;margin-top:4px}
.book .pg{position:absolute;bottom:22px;font:600 .8rem "Space Grotesk";color:#f5d9a8;letter-spacing:.1em}
.feat .tx{padding:26px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips span{background:var(--chip);border-radius:6px;padding:2px 9px;font:500 .78rem "Space Grotesk";direction:ltr}
.lk{display:inline-flex;gap:6px;font-weight:600;color:var(--acc);text-decoration:none;margin-top:6px}
.demos{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.demo{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s}
.demo:hover{transform:translateY(-4px)}
.demo img{display:block;width:100%;aspect-ratio:450/660;object-fit:cover;object-position:top}
.demo div{padding:10px 14px;font-size:.88rem;display:flex;justify-content:space-between;color:var(--soft)}
.demo b{color:var(--ink)}
.steps{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:s}
.steps .card{position:relative}
.steps .card::before{counter-increment:s;content:counter(s);font:700 2.2rem "Space Grotesk";color:var(--acc);opacity:.9;display:block;line-height:1;margin-bottom:8px}
.contact{text-align:center}
.contact .btn{margin:6px}
footer{padding:28px 0 40px;color:var(--soft);font-size:.85rem;text-align:center;border-top:1px solid var(--line)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
</style>
</head>
