<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--orange:#f28a1e;--green:#5fb236;--red:#e2392b;--blush:#f8d9dc;--paper:#fff8f3;--card:#ffffff;--ink:#3a2418;--soft:#8a6f61;--line:#f3e3d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1a120d;--card:#241913;--ink:#fbeee4;--soft:#c9ab98;--line:#3a2a20}}
:root[data-theme="dark"]{--paper:#1a120d;--card:#241913;--ink:#fbeee4;--soft:#c9ab98;--line:#3a2a20}
body{background:var(--paper);color:var(--ink);font-family:"Baloo Bhaijaan 2","Fredoka",system-ui,sans-serif}
html[lang=en] body{font-family:"Fredoka","Baloo Bhaijaan 2",sans-serif}
.demo-note{background:#e2392b;color:#fff}
/* blush wall with the arched mirror and pink blossom branches from their shop */
header{position:relative;text-align:center;background:#f8d9dc;color:#3a2418;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.8rem;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#e2392b;color:#fff;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:600 .8rem "Fredoka";z-index:2}
.bl{position:absolute;top:0;width:150px;height:120px;pointer-events:none}
.bl.a{left:-20px}.bl.b{right:-20px;transform:scaleX(-1)}
#logo{position:relative;display:inline-block;padding:1.2rem 1.6rem 1rem;background:#fff;border-radius:999px 999px 18px 18px;box-shadow:0 0 0 3px #fff,0 0 0 5px #f3c3c8;direction:ltr}
.leaf{display:block;width:36px;height:28px;margin:0 auto -.2rem}
.wm{font:700 3rem/1 "Fredoka";color:#f28a1e;letter-spacing:.01em}
.ws{font:600 .8rem "Fredoka";letter-spacing:.42em;margin-inline-start:.42em;color:#5fb236}
.tg{position:relative;margin:1rem 0 0;font:600 1rem "Baloo Bhaijaan 2"}
.info{position:relative;font-size:.78rem;color:#8a6f61;margin:.1rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem 1.1rem;cursor:pointer;min-height:36px;font:600 .86rem "Baloo Bhaijaan 2","Fredoka";box-shadow:inset 0 0 0 1.5px var(--line)}
.chip[aria-pressed="true"]{background:#f28a1e;color:#fff;box-shadow:none}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{display:flex;align-items:center;gap:.6rem;margin:0 0 .7rem;font:700 1.35rem "Baloo Bhaijaan 2","Fredoka";color:var(--c,#f28a1e)}
h2 small{margin-inline-start:auto;font:600 .8rem "Fredoka";letter-spacing:.14em;color:var(--soft);direction:ltr;text-transform:uppercase}
/* each item sits in a can-shaped card like their branded cups */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.it{background:var(--card);border-radius:16px;padding:.8rem .9rem;border:1.5px solid var(--line);position:relative;overflow:hidden}
.it::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--c,#f28a1e)}
.it .a{display:block;font-weight:700;font-size:1.02rem;line-height:1.3;margin-top:.15rem}
.it .e{display:block;font:500 .74rem "Fredoka";color:var(--soft);direction:ltr;text-align:right}
html[dir=ltr] .it .e{text-align:left}
.it .pr{display:block;margin-top:.45rem;font:700 1.1rem "Fredoka";color:var(--c,#f28a1e);direction:ltr;text-align:right}
html[dir=ltr] .it .pr{text-align:left}
.it .pr small{font:500 .62rem "Baloo Bhaijaan 2";color:var(--soft);margin-inline-start:.2rem}
.wa{margin:2rem 0 0;display:flex;align-items:center;justify-content:space-between;gap:.8rem;background:#5fb236;color:#fff;border-radius:16px;padding:.9rem 1rem}
.wa b{font-weight:700}
.wa a{background:#fff;color:#3a2418;border-radius:999px;padding:.4rem .9rem;font:700 .95rem "Fredoka";text-decoration:none;direction:ltr}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
