<!DOCTYPE html>

<head>

<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--red:#C8102E;--cream:#FBF6EC;--paper:#fffdf8;--ink:#1E1E1E;--orange:#E8892B;--leaf:#4E7D3A;--muted:#7b736a;--frame:#e9e2d4;
 --display:"Yellowtail",cursive;--body:"Almarai",system-ui,sans-serif}
body{background:var(--cream);color:var(--ink);font-family:var(--body)}
.demo-note{background:var(--ink);color:#fff}
header.hero{position:relative;text-align:center;padding:1.6rem 1rem 1rem;overflow:hidden}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;background:#fff;color:var(--red);border:1.5px solid var(--red);border-radius:999px;padding:.25rem .85rem;font:700 .82rem var(--body);cursor:pointer;z-index:2}
.cottage{width:min(92vw,380px);display:block;margin:0 auto}
.info{color:var(--muted);font-size:.86rem;margin:.4rem 0 0}
.fair{max-width:620px;margin:1rem auto 0;background:#fff;border:1.5px dashed var(--red);border-radius:14px;padding:.7rem .9rem;font-size:.86rem;text-align:start}
.fair b{color:var(--red)}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);padding:.65rem 0 .5rem;border-bottom:2px solid var(--frame)}
.search{max-width:620px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:2px solid var(--frame);background:#fff;color:var(--ink);border-radius:12px;padding:.6rem 1rem;font:1rem var(--body)}
.search input:focus-visible{outline:none;border-color:var(--red)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.55rem 1rem 0;max-width:620px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:transparent;color:var(--ink);padding:.3rem .6rem;font:700 .9rem var(--body);cursor:pointer;border-bottom:3px solid transparent}
.chip[aria-pressed="true"]{color:var(--red);border-bottom-color:var(--red)}
.chip:focus-visible{outline:2px solid var(--red)}
main{max-width:620px;margin:0 auto;padding:.4rem 1rem 2rem}
section.cat{margin-top:2.2rem;position:relative}
.win{background:var(--paper);border:10px solid #fff;outline:2px solid var(--frame);border-radius:120px 120px 16px 16px;padding:0 1rem .6rem;box-shadow:0 10px 24px rgba(60,40,20,.08)}
.lattice{height:86px;margin:0 -1rem .4rem;border-radius:110px 110px 0 0;background:
 repeating-linear-gradient(45deg,transparent 0 16px,#fff 16px 20px),repeating-linear-gradient(-45deg,transparent 0 16px,#fff 16px 20px),linear-gradient(#cfe3f0,#eef6fb);display:flex;align-items:flex-end;justify-content:center}
.lattice h2{margin:0 0 -.35rem;background:var(--paper);padding:.1rem 1rem 0;border-radius:12px 12px 0 0;font:400 2.1rem var(--display);color:var(--red);line-height:1.2}
.lattice h2 small{font:700 .9rem var(--body);color:var(--ink);margin-inline-start:.4rem}
.vine{position:absolute;top:30px;width:34px;height:120px}.vine.l{inset-inline-start:-14px}.vine.r{inset-inline-end:-14px;transform:scaleX(-1)}
.row{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;padding:.6rem 0;border-bottom:1px solid var(--frame)}
.row:last-child{border-bottom:0}
.row .nm{font-weight:800}
.row .ds{grid-column:1/2;margin:0;color:var(--muted);font-size:.8rem}
.row .pr{font-weight:800;color:var(--red);white-space:nowrap}
.visit a{background:#fff;color:var(--ink);border:2px solid var(--frame)}
.visit a.wa{background:var(--red);color:#fff;border-color:var(--red)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.5rem 1rem 2.5rem}
footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <svg class="cottage" viewBox="0 0 380 250" role="img" aria-label="Drink">
<rect x="40" y="70" width="300" height="170" fill="#fff" stroke="#e1d8c6" stroke-width="2"/>
<path d="M30 74 L190 18 L350 74Z" fill="#fff" stroke="#e1d8c6" stroke-width="2"/>
<g stroke="#b9c7cf" stroke-width="3" fill="#dcebf3"><rect x="70" y="120" width="70" height="90" rx="4"/><rect x="240" y="120" width="70" height="90" rx="4"/></g>
<g stroke="#fff" stroke-width="3"><path d="M105 120v90M70 150h70M70 180h70M275 120v90M240 150h70M240 180h70"/></g>

<text x="190" y="104" text-anchor="middle" font-family="Yellowtail, cursive" font-size="54" fill="#C8102E">Drink</text>
<circle cx="190" cy="44" r="17" fill="#1E1E1E"/><path d="M178 44h24M182 44c1-8 4-11 8-11s7 3 8 11" fill="#E8892B" stroke="#E8892B" stroke-width="2"/><path d="M184 53c4-2 8-2 12 0" stroke="#E8892B" stroke-width="2" fill="none"/>
<g><g transform="translate(52 232)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g><g transform="translate(66 222)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g><g transform="translate(80 236)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g><g transform="translate(300 230)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g><g transform="translate(318 220)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g><g transform="translate(330 236)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g><g transform="translate(150 236)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g><g transform="translate(232 234)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g></g>
<g fill="#6f9e55"><ellipse cx="58" cy="242" rx="9" ry="4" transform="rotate(-20 58 242)"/><ellipse cx="74" cy="244" rx="9" ry="4" transform="rotate(15 74 244)"/><ellipse cx="312" cy="242" rx="9" ry="4" transform="rotate(20 312 242)"/><ellipse cx="326" cy="244" rx="9" ry="4" transform="rotate(-15 326 244)"/><ellipse cx="142" cy="244" rx="9" ry="4" transform="rotate(-10 142 244)"/><ellipse cx="240" cy="244" rx="9" ry="4" transform="rotate(10 240 244)"/></g>
</svg>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "Drink", "nameAr": "Drink", "tagline": {"ar": "كافيه في جنينة، ٦ أكتوبر", "en": "A garden café, 6th of October"}, "info": {"ar": "٦ أكتوبر · لحد ١ بالليل", "en": "6th of October · Open till 1 AM"}, "logo": null, "colors": {"primary": "#C8102E", "onPrimary": "#ffffff", "secondary": "#1E1E1E", "background": "#FBF6EC", "accent": "#E8892B"}, "fonts": {"display": "Yellowtail", "body": "Almarai"}, "pattern": "none", "currency": {"ar": "ج.م", "en": "EGP"}, "demoBanner": true, "credit": "محمد", "whatsapp": "201153153962", "mapsUrl": "https://maps.google.com/?cid=11636296159186699826", "categories": [{"id": "coffee", "ar": "قهوة", "en": "Coffee", "items": [{"ar": "قهوة تركي", "en": "Turkish Coffee", "p": 22, "dAr": "سينجل ٢٢ · دبل ٣٣", "dEn": "Single 22 · Double 33"}, {"ar": "نسكافيه", "en": "Nescafe", "p": 42}, {"ar": "قهوة بالبندق", "en": "Hazelnut Coffee", "p": 38}, {"ar": "قهوة فرنساوي", "en": "French Coffee", "p": 38}, {"ar": "كافيه لاتيه", "en": "Caffe Latte", "p": 45}, {"ar": "كابتشينو", "en": "Cappuccino", "p": 47}, {"ar": "فلات وايت", "en": "Flat White", "p": 43}, {"ar": "أمريكانو", "en": "Americano", "p": 40}, {"ar": "موكا", "en": "Mocha", "p": 48}, {"ar": "ماكياتو", "en": "Macchiato", "p": 38}, {"ar": "ماكياتو كراميل", "en": "Macchiato Caramel", "p": 48}, {"ar": "لونج بلاك", "en": "Long Black", "p": 38}, {"ar": "إسبريسو", "en": "Espresso", "p": 28, "dAr": "سينجل ٢٨ · دبل ٣٧", "dEn": "Single 28 · Double 37"}, {"ar": "كورتادو", "en": "Cortado", "p": 45}, {"ar": "جولدن", "en": "Golden", "p": 40, "dAr": "كركم وقرفة وفلفل وعسل", "dEn": "Turmeric, cinnamon, pepper & honey"}]}, {"id": "frappe", "ar": "فرابيه", "en": "Frappe", "items": [{"ar": "فرابيه قهوة / موكا / فانيليا", "en": "Coffee / Mocha / Vanilla Frappe", "p": 55, "dAr": "بالكريمة والتوبينج", "dEn": "With whipped cream & toppings"}, {"ar": "سولتد كراميل فرابيه", "en": "Salted Caramel Frappe", "p": 60}, {"ar": "أوريو فرابيه", "en": "Oreo Frappe", "p": 55}, {"ar": "لوتس لاتيه فرابيه", "en": "Lotus Latte Frappe", "p": 60}]}, {"id": "spanish", "ar": "سبانيش", "en": "Spanish Lattes", "items": [{"ar": "كلاسيك سبانيش", "en": "Classic Spanish", "p": 60, "dAr": "مثال لحد ما نحط سعركم", "dEn": "Sample price"}, {"ar": "روز سبانيش", "en": "Rose Spanish", "p": 65, "dAr": "مثال لحد ما نحط سعركم", "dEn": "Sample price"}, {"ar": "بستاشيو سبانيش", "en": "Pistachio Spanish", "p": 70, "dAr": "مثال لحد ما نحط سعركم", "dEn": "Sample price"}, {"ar": "أوريو سبانيش", "en": "Oreo Spanish", "p": 65, "dAr": "مثال لحد ما نحط سعركم", "dEn": "Sample price"}, {"ar": "ريد فيلفت لاتيه", "en": "Red Velvet Latte", "p": 65, "dAr": "مثال لحد ما نحط سعركم", "dEn": "Sample price"}]}, {"id": "health", "ar": "هيلث شوت وأوفرنايت", "en": "Health Shot & Oats", "items": [{"ar": "جنزبيل وليمون وعسل", "en": "Ginger, Lemon & Honey", "p": 45, "dAr": "مثال لحد ما نحط سعركم", "dEn": "Sample price"}, {"ar": "بنجر وعسل", "en": "Beet Roots & Honey", "p": 45, "dAr": "مثال لحد ما نحط سعركم", "dEn": "Sample price"}, {"ar": "أوفرنايت أوتس", "en": "Overnight Oats", "p": 70, "dAr": "مثال لحد ما نحط سعركم", "dEn": "Sample price"}, {"ar": "مانجو كوكونت", "en": "Mango Coconut", "p": 75, "dAr": "مثال لحد ما نحط سعركم", "dEn": "Sample price"}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const VINE=`<svg class="vine __S__" viewBox="0 0 34 120" aria-hidden="true"><path d="M17 0c-10 20 10 40 0 60s10 40 0 60" fill="none" stroke="#4E7D3A" stroke-width="2"/>
<ellipse cx="9" cy="22" rx="6" ry="3" fill="#6f9e55" transform="rotate(-30 9 22)"/><ellipse cx="25" cy="48" rx="6" ry="3" fill="#6f9e55" transform="rotate(30 25 48)"/><ellipse cx="9" cy="84" rx="6" ry="3" fill="#6f9e55" transform="rotate(-30 9 84)"/>
<g transform="translate(22 12)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g><g transform="translate(10 66)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g><g transform="translate(24 104)"><circle r="6" fill="#E8892B"/><circle r="2.4" fill="#C8102E"/></g></svg>`;
function renderHero(){
  const info=C.info||{};
  $("heroInner").innerHTML=`<p class="info">${esc((C.tagline||{})[lang]||"")} · ${esc(info[lang]||"")}</p>
   <div class="fair">${lang==="ar"?"<b>السعر اللي هنا هو اللي هتدفعه.</b> لو فيه خدمة زي الـ ١٢٪ بتتكتب هنا بوضوح، والأسعار بتتعدل من الموبايل في ثانية من غير طباعة.":"<b>The price here is the price you pay.</b> Any service charge like the 12% is shown clearly, and prices update from a phone in seconds, no reprinting."}</div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}">${VINE.replace("__S__","l")}${VINE.replace("__S__","r")}<div class="win"><div class="lattice"><h2>${esc(c.en)}${lang==="ar"?`<small>${esc(c.ar)}</small>`:""}</h2></div>`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="row"><span class="nm">${esc(L(i,"ar","en"))}</span><span class="pr">${fmt(i.p)} ${cur()}</span>${d?`<p class="ds">${esc(d)}</p>`:""}</div>`;}
    html+="</div></section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${lang==="ar"?"مفيش صنف بالاسم ده، جرب كلمة تانية.":T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: أسعار القهوة والفرابيه من صورة المنيو اللي على جوجل (ممكن تكون اتغيرت)، والباقي أمثلة";
