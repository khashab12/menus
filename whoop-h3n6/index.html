<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--green:#1f4a33;--green2:#2b6246;--matcha:#a9c77a;--light:#f4f1e6;--ink:#f4f1e6;--soft:#c9d7c6;--tile:#255a3e}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--ink:#f4f1e6}}
body{background:var(--green);color:var(--ink);font-family:"Alexandria",system-ui,sans-serif;
 background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px)}
.demo-note{background:var(--matcha);color:var(--green)}
header{position:relative;max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.2rem;text-align:center}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:var(--light);color:var(--green);border:0;border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-size:.8rem;font-weight:600}
#logo{display:inline-block;padding:.5rem;background:var(--green);border-radius:50%}
.badge{width:130px;height:130px;border-radius:50%;background:var(--green);border:4px solid var(--light);box-shadow:0 0 0 3px var(--green),0 0 30px rgba(169,199,122,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr}
.cup{width:52px;height:40px}
.wd{font:800 1.45rem/1 "Alexandria";letter-spacing:.02em;font-style:italic;color:var(--light);margin-top:.15rem}
.cf{font:600 .55rem "Alexandria";letter-spacing:.35em;color:var(--light)}
.sign{margin:.9rem auto 0;display:inline-block;border:2px solid var(--light);border-radius:8px;padding:.25rem 1rem;font-weight:600;font-size:.95rem;box-shadow:0 0 18px rgba(244,241,230,.25)}
.info{font-size:.8rem;color:var(--soft);margin:.5rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--green);border-bottom:1px solid var(--green2)}
.bar-in{max-width:620px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:0;background:var(--light);color:var(--green);border-radius:10px;padding:.6rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .2rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--soft);background:none;color:var(--ink);border-radius:10px;padding:.3rem .9rem;cursor:pointer;min-height:36px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--matcha);border-color:var(--matcha);color:var(--green);font-weight:600}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:3px solid var(--matcha);outline-offset:2px}
main{max-width:620px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{padding-top:1.7rem;scroll-margin-top:120px}
/* kiosk menu board: light-box header strip + backlit tiles */
h2{margin:0 0 .7rem;background:var(--light);color:var(--green);font:800 1.1rem "Alexandria";padding:.4rem .9rem;border-radius:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 22px rgba(244,241,230,.18)}
h2 small{font-weight:600;font-size:.7rem;opacity:.7}
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:.55rem}
.tile{background:var(--tile);border:1px solid var(--green2);border-radius:10px;padding:.7rem .75rem;display:flex;flex-direction:column;justify-content:space-between;min-height:84px}
.tile.hi{border-color:var(--matcha);box-shadow:inset 0 0 0 1px var(--matcha)}
.tn{font-weight:600;font-size:.9rem;line-height:1.35}
.tp{align-self:flex-end;margin-top:.4rem;font:800 1.2rem "Alexandria";color:var(--matcha);direction:ltr}
.tp small{font-size:.62rem;font-weight:600;color:var(--soft);margin-inline-start:.2rem}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

 "Waffle Caramel", "p": 90}, {"ar": "وافل دارك شوكليت", "en": "Waffle Dark Chocolate", "p": 90}, {"ar": "وافل لوتس", "en": "Waffle Lotus", "p": 95}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "دوّر على مشروب…", "empty": "مفيش حاجة بالاسم ده.", "all": "الكل", "demo": "", "note": "", "sign": "قهوة وماتشا"}, "en": {"dir": "ltr", "lang": "العربية", "search": "Find a drink…", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "sign": "Coffee & Matcha"}};
let lang="ar", active="all", query="";
const KEY="whoop-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("sign").textContent=T[lang].sign; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}<small>${cur()}</small></h2><div class="board">${body}</div></section>`; }
function item(i){ return `<div class="tile${i.hi?" hi":""}"><span class="tn">${esc(L(i,"ar","en"))}</span><span class="tp">${fmt(i.p)}<small>${cur()}</small></span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
