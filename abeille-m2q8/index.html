<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--cream:#f7efdd;--card:#fffaf0;--sage:#6f8a78;--gold:#b98f3f;--ink:#3b3a2c;--soft:#6f6b58;--line:#d9ccae}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#161a16;--card:#1f2520;--ink:#f1ead8;--soft:#bdb7a0;--line:#3d4a40;--sage:#9cb6a3;--gold:#d9b46a}}
:root[data-theme="dark"]{--cream:#161a16;--card:#1f2520;--ink:#f1ead8;--soft:#bdb7a0;--line:#3d4a40;--sage:#9cb6a3;--gold:#d9b46a}
body{background:var(--cream);color:var(--ink);font-family:"Cormorant Garamond","Almarai",serif;font-size:17px}
html[lang=ar] body{font-family:"Almarai","Cormorant Garamond",sans-serif;font-size:15px}
.demo-note{background:var(--sage);color:#fff}
header{position:relative;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1rem;text-align:center}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:var(--card);color:var(--sage);border:1.5px solid var(--sage);border-radius:6px;padding:.25rem .9rem;cursor:pointer;min-height:36px;font:700 .8rem "Almarai"}
#logo{display:inline-block;padding:1rem 1.6rem .8rem;background:var(--cream);border:2px solid var(--sage);outline:1px solid var(--sage);outline-offset:4px;border-radius:4px}
.script{font:400 4.2rem/.8 "Italianno",cursive;color:var(--gold);direction:ltr}
.since{font:600 .68rem "Cormorant Garamond";letter-spacing:.45em;color:var(--sage);margin-top:.3rem;direction:ltr}
.arn{font:700 1.2rem "Aref Ruqaa",serif;color:var(--sage);margin:.1rem 0 0}
/* madeleine shell drawn with CSS ridges */
.shell{width:74px;height:46px;margin:1rem auto 0;border-radius:50% 50% 45% 45%/70% 70% 30% 30%;background:repeating-conic-gradient(from 180deg at 50% 100%,var(--gold) 0 6deg,color-mix(in srgb,var(--gold) 55%,var(--cream)) 6deg 12deg)}
.info{font-size:.85rem;color:var(--soft);margin:.6rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--sage);background:none;color:var(--sage);border-radius:4px;padding:.3rem .9rem;cursor:pointer;min-height:36px;font:700 .82rem "Almarai"}
.chip[aria-pressed="true"]{background:var(--sage);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{padding-top:1.8rem;scroll-margin-top:120px}
h2{margin:0 0 .9rem;text-align:center;font:400 2.5rem/1 "Italianno",cursive;color:var(--gold)}
html[lang=ar] h2{font:700 1.5rem "Aref Ruqaa",serif}
h2::after{content:"";display:block;width:60px;height:1px;background:var(--sage);margin:.5rem auto 0}
/* each item is a box lid: count on the lid, price on the ribbon */
.boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}
.box{position:relative;background:var(--card);border:1.5px solid var(--sage);border-radius:6px;padding:1rem .6rem .8rem;text-align:center;overflow:hidden}
.box::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:10px;margin-left:-5px;background:color-mix(in srgb,var(--gold) 22%,transparent)}
.cnt{position:relative;font:700 2rem/1 "Cormorant Garamond";color:var(--sage)}
html[lang=ar] .cnt{font:700 1.6rem "Almarai"}
.bx{position:relative;font-weight:700;font-size:.95rem;margin:.3rem 0 .5rem}
.rib{position:relative;display:inline-block;background:var(--gold);color:#fff;padding:.1rem .8rem;border-radius:2px;font:700 1rem "Almarai";direction:ltr}
.rib small{font-size:.65rem;margin-inline-start:.2rem}
.kc{position:relative;display:block;font-size:.7rem;color:var(--soft);margin-top:.35rem}
.flav{margin-top:2rem;text-align:center;background:var(--card);border:1px dashed var(--sage);border-radius:6px;padding:1rem}
.flav h3{margin:0 0 .6rem;font:400 2.2rem/1 "Italianno",cursive;color:var(--gold)}
html[lang=ar] .flav h3{font:700 1.3rem "Aref Ruqaa"}
.flav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem}
.flav li{border:1px solid var(--line);border-radius:999px;padding:.15rem .7rem;font-size:.85rem}
.flav li::before{content:"◖ ";color:var(--gold)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><div class="script">Abeille</div><div class="since">DEPUIS 2025</div><p class="arn">أبيي</p></div>
  <div class="shell" aria-hidden="true"></div>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>

let lang="ar", active="all", query="";
const KEY="abeille-lang";

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2><div class="boxes">${body}</div></section>`; }
function item(i){ return `<div class="box"><div class="cnt">${esc(L(i,"cAr","cEn"))}</div><div class="bx">${esc(L(i,"ar","en"))}</div><span class="rib">${fmt(i.p)}<small>${cur()}</small></span>${i.kc?`<span class="kc">${T[lang].kc}</span>`:""}</div>`; }
function afterRender(){ if(query.trim()) return; const t=T[lang]; $("menu").insertAdjacentHTML("beforeend",`<div class="flav"><h3>${t.fl}</h3><ul>${t.flav.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
