<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--char:#2b2b2b;--gold:#c9a46a;--gold2:#a8854f;--cream:#f5efe4;--paper:#faf7f1;--card:#ffffff;--ink:#2b2b2b;--soft:#7d7466;--line:#e8e0d2;--wave:#2f6f8f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141312;--card:#1d1c1a;--ink:#f1ead9;--soft:#b7ac98;--line:#2e2b27}}
:root[data-theme="dark"]{--paper:#141312;--card:#1d1c1a;--ink:#f1ead9;--soft:#b7ac98;--line:#2e2b27}
body{background:var(--paper);color:var(--ink);font-family:"Cairo","Playfair Display",system-ui,sans-serif}
.demo-note{background:#2b2b2b;color:#c9a46a}
header{position:relative;text-align:center;background:#2b2b2b;color:#f5efe4;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 0;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#c9a46a;color:#2b2b2b;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:600 .8rem "Cairo";z-index:2}
#logo{display:inline-block;padding:.4rem 1.6rem;background:#2b2b2b;direction:ltr}
.br{display:block;width:70px;height:70px;margin:0 auto .3rem}
.wm{font:600 2.8rem/1 "Playfair Display";color:#f5efe4;letter-spacing:.04em}
.ws{font:400 1.8rem/1 "Italianno";color:#c9a46a;margin-top:.1rem}
.tg{margin:.7rem 0 0;font:600 .95rem "Cairo";color:#e9dcc2}
.info{font-size:.76rem;color:#b6ab98;margin:.15rem 0 0}
/* "Cavalcare l'onda" — a wave under the header, with the Italian tricolour thread */
.wave{display:block;width:calc(100% + 2.4rem);height:46px;margin:1.2rem -1.2rem 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--gold);background:none;color:var(--ink);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:600 .84rem "Cairo"}
.chip[aria-pressed="true"]{background:#2b2b2b;border-color:#2b2b2b;color:#c9a46a}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{text-align:center;margin:0 0 .6rem;font:400 2.4rem/1 "Italianno";color:var(--gold2);direction:ltr}
h2 small{display:block;font:600 .85rem "Cairo";color:var(--soft);margin-top:.1rem}
.tri{display:flex;justify-content:center;gap:3px;margin:.3rem 0 .6rem}
.tri i{width:16px;height:3px;border-radius:2px}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:baseline;padding:.55rem 0;border-bottom:1px dashed var(--line)}
.nm .a{font-weight:600}
.nm .e{display:block;font:500 .82rem "Playfair Display";font-style:italic;color:var(--soft);direction:ltr;text-align:right}
html[dir=ltr] .nm .e{text-align:left}
.pr{font:600 1rem "Playfair Display";white-space:nowrap;direction:ltr}
.pr small{font:400 .6rem "Cairo";color:var(--soft);margin-inline-start:.2rem}
.end{margin:2.2rem 0 0;text-align:center}
.end b{display:block;font:400 2.6rem/1 "Italianno";color:var(--gold2);direction:ltr}
.end span{font:600 .9rem "Cairo";color:var(--soft)}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "عايز تطلب إيه؟", "empty": "مفيش حاجة بالاسم ده.", "all": "الكل", "demo": "تصور تجريبي — الأصناف والأسعار أمثلة ومش منيو باليرمو", "note": "", "tg": "قهوتك مزاجها إيطالي 🇮🇹", "end": "Good Coffee, Good Day", "ends": "Cavalcare l'onda 🌊"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — items and prices are examples, not Palermo's menu", "note": "", "tg": "Your coffee, Italian style 🇮🇹", "end": "Good Coffee, Good Day", "ends": "Cavalcare l'onda 🌊"}};
let lang="ar", active="all", query="";
const KEY="palermo-lang";

try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(c.it)}${lang==="ar"?`<small>${esc(c.ar)}</small>`:`<small>${esc(c.en)}</small>`}</h2><div class="tri"><i style="background:#2e8b57"></i><i style="background:#f5efe4;box-shadow:inset 0 0 0 1px #d8cdb8"></i><i style="background:#c8402f"></i></div>${body}</section>`; }
function item(i){ return `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}</span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<div class="end"><b>${T[lang].end}</b><span>${T[lang].ends}</span></div>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;

  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
