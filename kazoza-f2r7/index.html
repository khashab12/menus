<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--red:#e0262d;--navy:#1b2658;--cream:#fff6ea;--card:#ffffff;--ink:#1b2658;--soft:#6b7094;--line:#f0e2d0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#111632;--card:#1a2046;--ink:#fff6ea;--soft:#aab0d6;--line:#2a3160}}
:root[data-theme="dark"]{--cream:#111632;--card:#1a2046;--ink:#fff6ea;--soft:#aab0d6;--line:#2a3160}
body{background:var(--cream);color:var(--ink);font-family:"Changa",system-ui,sans-serif}
.demo-note{background:var(--navy);color:#fff;font-weight:500}
/* soda-shop header: red with a wavy white band and navy stripe */
header{position:relative;text-align:center;background:#e0262d;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 2.6rem}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:
 radial-gradient(circle at 12px -4px,transparent 13px,var(--cream) 13.5px) 0 0/24px 22px repeat-x}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#fff;color:#1b2658;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:600 .8rem "Changa";z-index:2}
/* bottle-cap logo: scalloped navy disc, white ring, red wordmark */
#logo{display:inline-grid;place-items:center;width:150px;height:150px;background:#e0262d;border-radius:50%}
.cap{width:140px;height:140px;display:grid;place-items:center;background:#1b2658;
 -webkit-mask:radial-gradient(circle at 50% 50%,#000 62px,transparent 62.5px),conic-gradient(#000 0 0);
 clip-path:polygon(50% 0,56% 5%,63% 1%,68% 7%,75% 4%,79% 11%,86% 10%,88% 17%,95% 19%,94% 26%,100% 31%,97% 37%,100% 44%,96% 50%,100% 56%,97% 63%,100% 69%,94% 74%,95% 81%,88% 83%,86% 90%,79% 89%,75% 96%,68% 93%,63% 99%,56% 95%,50% 100%,44% 95%,37% 99%,32% 93%,25% 96%,21% 89%,14% 90%,12% 83%,5% 81%,6% 74%,0 69%,3% 63%,0 56%,4% 50%,0 44%,3% 37%,0 31%,6% 26%,5% 19%,12% 17%,14% 10%,21% 11%,25% 4%,32% 7%,37% 1%,44% 5%)}
.cap div{width:108px;height:108px;border-radius:50%;background:#fff6ea;display:grid;place-items:center;border:3px solid #fff}
.wm{font:400 2.1rem/1 "Lalezar";color:#e0262d}
.wm small{display:block;font:400 .72rem "Anton";letter-spacing:.2em;color:#1b2658;margin-top:.1rem}
.tg{margin:.9rem 0 0;font:600 1.05rem "Changa"}
.info{font-size:.8rem;opacity:.9;margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:2px solid var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar{border-bottom-color:var(--red)}}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:2px solid var(--navy);background:var(--card);color:var(--ink);border-radius:999px;padding:.5rem 1rem;font:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .search input{border-color:var(--soft)}}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
/* chips are little bottle caps */
.chip{flex:0 0 auto;border:2px dashed var(--red);background:var(--card);color:var(--ink);border-radius:999px;padding:.25rem 1rem;cursor:pointer;min-height:36px;font:600 .86rem "Changa"}
.chip[aria-pressed="true"]{background:var(--red);border-style:solid;color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{display:flex;align-items:center;gap:.6rem;margin:0 0 .7rem;font:400 1.7rem/1 "Lalezar";color:var(--red)}
h2::after{content:"";flex:1;height:8px;background:repeating-linear-gradient(90deg,var(--navy) 0 14px,transparent 14px 20px);border-radius:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2::after{background:repeating-linear-gradient(90deg,var(--soft) 0 14px,transparent 14px 20px)}}
h2 small{font:400 .9rem "Anton";letter-spacing:.1em;color:var(--navy);order:3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2 small{color:var(--soft)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.it{background:var(--card);border:2px solid var(--navy);border-radius:16px;padding:.7rem .8rem;box-shadow:3px 3px 0 var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .it{border-color:#2a3160}}
.it b{display:block;font:600 1rem/1.3 "Changa"}
.it span{display:block;font-size:.76rem;color:var(--soft)}
.it .pr{white-space:nowrap;margin-top:.4rem;font:400 1.3rem "Anton";color:var(--red);direction:ltr;text-align:end}
.it .pr small{font:500 .64rem "Changa";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.visit a{border-radius:999px;border-width:2px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "تصور تجريبي — الأصناف والأسعار أمثلة وليست منيو كازوزا", "note": ""}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — items and prices are examples, not Kazoza's menu", "note": ""}};
let lang="ar", active="all", query="";
const KEY="kazoza-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}${lang==="ar"?`<small>${esc(c.en.toUpperCase())}</small>`:""}</h2><div class="grid">${body}</div></section>`; }
function item(i){ return `<div class="it"><b>${esc(lang==="ar"?i.ar:i.en)}</b>${lang==="ar"?`<span>${esc(i.en)}</span>`:""}<div class="pr">${P(i)}<small>${cur()}</small></div></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
