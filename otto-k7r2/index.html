<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو otto</title>
<meta name="description" content="Where every origin has a story">
<meta property="og:title" content="منيو otto">
<meta property="og:description" content="Where every origin has a story">
<meta property="og:type" content="website">
<meta property="og:image" content="https://khashab12.github.io/menus/otto-k7r2/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://khashab12.github.io/menus/otto-k7r2/og.png">
<meta property="og:url" content="https://khashab12.github.io/menus/otto-k7r2/">
<meta name="theme-color" content="#2F4A3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--cream:#F3EBDD;--green:#2F4A3E;--green2:#3E5C4C;--ink:#141414;--gold:#E8C25A;--wood:#B98A5E;--muted:#6f6a5e;--line:rgba(20,20,20,.14);
 --display:"Fredoka",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,sans-serif}
body{background:var(--cream);color:var(--ink);font-family:var(--body)}
.demo-note{background:var(--green);color:var(--cream)}
header.hero{position:relative;overflow:hidden;padding:1.4rem 1rem 1.2rem;background:linear-gradient(180deg,#E7DCC8,#F3EBDD)}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;background:var(--cream);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.2rem .8rem;font:700 .78rem var(--body);cursor:pointer}
.sign{width:min(320px,84vw);margin:1.8rem auto 0;background:#EDE3D2;border-radius:6px;padding:1.2rem 1rem 1rem;text-align:center;box-shadow:0 0 0 1px var(--line),0 18px 40px -22px rgba(0,0,0,.5)}
.sign .wm{direction:ltr;font:700 clamp(3.4rem,17vw,4.6rem)/1 var(--display);color:var(--ink);margin:0;text-shadow:0 0 18px rgba(232,194,90,.75)}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:.8rem auto 0;width:190px;background:#000;padding:3px}
.tiles svg{display:block;width:100%;height:auto;background:#000}
.story{direction:ltr;font:500 .95rem var(--display);margin:.9rem 0 0;color:var(--green)}
.info{font-size:.84rem;color:var(--muted);margin:.4rem 0 0}
.open{display:inline-flex;gap:.45rem;align-items:center;margin-top:.7rem;background:var(--green);color:var(--cream);border-radius:999px;padding:.3rem .85rem;font-size:.82rem}
.open i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.bar{position:sticky;top:0;z-index:5;background:rgba(243,235,221,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:.55rem .9rem;font:1rem var(--body)}
.search input:focus-visible{outline:2px solid var(--green)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--green);background:transparent;color:var(--green);border-radius:999px;padding:.25rem .85rem;font:700 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);color:var(--cream)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.6rem}
.ch{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
.ch .tl{flex:0 0 auto;width:38px;height:38px;background:#000;padding:2px}
.ch h2{margin:0;font:700 1.25rem var(--body)}
.ch .en{direction:ltr;display:block;font:600 .78rem var(--display);color:var(--muted)}
.cups{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.cup{position:relative;background:var(--green);color:var(--cream);border-radius:14px 14px 22px 22px;padding:.8rem .8rem .7rem;min-height:120px;display:flex;flex-direction:column}
.cup::before{content:"";position:absolute;top:-6px;left:8px;right:8px;height:10px;border-radius:6px;background:#26392F}
.cup .nm{font:700 .98rem/1.3 var(--body)}
.cup .en{direction:ltr;display:block;font:500 .72rem var(--display);color:#cfd9cf}
.cup .ds{font-size:.7rem;color:#d9e2d6;margin:.25rem 0 0}
.cup .pr{margin-top:auto;padding-top:.5rem;font:700 1.05rem var(--display);color:var(--gold)}
.cup .rl{align-self:flex-start;margin-bottom:.35rem;font-size:.58rem;background:var(--gold);color:var(--ink);border-radius:999px;padding:0 .4rem;font-weight:700}
.cup.pk{background:#141414}
.visit a{background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:12px}
.visit a:first-child{background:var(--green);border-color:var(--green);color:var(--cream)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem}
footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "otto", "nameAr": "otto", "tagline": {"ar": "Where every origin has a story", "en": "Where every origin has a story"}, "info": {"ar": "شارع ابن سينا، المروج · الافتتاح التجريبي من ٤ العصر لـ ١١ بالليل", "en": "Ibn Sina St, Al Muruj · Soft opening 4 PM – 11 PM"}, "logo": null, "colors": {"primary": "#2F4A3E", "onPrimary": "#F3EBDD", "secondary": "#141414", "background": "#F3EBDD", "accent": "#E8C25A"}, "fonts": {"display": "Fredoka", "body": "IBM Plex Sans Arabic"}, "pattern": "none", "currency": {"ar": "ر.س", "en": "SAR"}, "demoBanner": true, "credit": "محمد", "mapsUrl": "https://maps.google.com/?cid=12778808021683676794", "reviewUrl": "https://maps.google.com/?cid=12778808021683676794", "instagram": "https://www.instagram.com/ottoroastery/", "categories": [{"id": "origin", "ar": "قهوة المحصول", "en": "Origins", "items": [{"ar": "V60 شيري", "en": "V60 · Cherry lot", "p": 22, "pick": true, "dAr": "محصول الشيري اللي يمدحونه بالريفيوهات", "dEn": "The cherry lot your guests rave about"}, {"ar": "قهوة باردة شيري", "en": "Iced · Cherry lot", "p": 22}, {"ar": "قهوة اليوم", "en": "Coffee of the Day", "p": 12}]}, {"id": "espresso", "ar": "الإسبريسو", "en": "Espresso Bar", "items": [{"ar": "إسبريسو", "en": "Espresso", "p": 12}, {"ar": "كورتادو", "en": "Cortado", "p": 15}, {"ar": "فلات وايت", "en": "Flat White", "p": 17}, {"ar": "لاتيه", "en": "Latte", "p": 18}, {"ar": "آيس سبانش لاتيه", "en": "Iced Spanish Latte", "p": 19, "real": true}]}, {"id": "sweet", "ar": "الحلا", "en": "Desserts", "items": [{"ar": "حلا السعيد", "en": "Chocolate Bites", "p": 14, "real": true, "pick": true}, {"ar": "كيكة اليوم", "en": "Cake of the Day", "p": 22}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const TILE=`<svg viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" fill="#000"/><path d="M10 2l3 5-3 3-3-3zM10 18l3-5-3-3-3 3zM2 10l5-3 3 3-3 3zM18 10l-5-3-3 3 3 3z" fill="#fff"/><circle cx="10" cy="10" r="1.6" fill="#000"/></svg>`;
function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`<div class="sign"><p class="wm">otto</p><div class="tiles" aria-hidden="true">${TILE.repeat(6)}</div>
   <p class="story">Where every origin has a story.</p><p class="info">${esc((C.info||{})[lang]||"")}</p>
   <span class="open"><i></i>${ar?"مفتوحين: الافتتاح التجريبي ٤ – ١١ م":"Soft opening: 4 – 11 PM"}</span></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch"><span class="tl">${TILE}</span><div><h2>${esc(L(c,"ar","en"))}</h2>${lang==="ar"?`<span class="en">${esc(c.en)}</span>`:""}</div></div><div class="cups">`;
    for(const i of items){const ds=L(i,"dAr","dEn");
      html+=`<article class="cup${i.pick?" pk":""}">${i.real?`<span class="rl">${lang==="ar"?"سعر حقيقي":"Real price"}</span>`:""}<span class="nm">${esc(L(i,"ar","en"))}</span>${lang==="ar"?`<span class="en">${esc(i.en)}</span>`:""}${ds?`<p class="ds">${esc(ds)}</p>`:""}<span class="pr">${fmt(i.p)} ${cur()}</span></article>`;}
    html+="</div></section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف من الريفيوهات وفاتورة زبون على جوجل، وأغلب الأسعار أمثلة لين نحط أسعاركم";
T.en.note="Preview: items from reviews and a guest receipt on Google, most prices are samples until we add yours";
T.ar.search="وش تبي تجرب اليوم؟";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"otto-k7r2"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
