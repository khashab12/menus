.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.7rem 0 .55rem}

.chips{display:flex;gap:1.2rem;overflow-x:auto;padding:.6rem 1rem 0;max-width:720px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:none;color:var(--muted);padding:.2rem 0;font:500 .92rem var(--body);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:720px;margin:0 auto;padding:.5rem 1.1rem 2rem}
section.cat{margin-top:2.4rem;counter-increment:cat;counter-reset:item}
.cat h2{font-family:var(--display);font-weight:300;font-size:1.9rem;margin:0 0 .6rem;display:flex;align-items:baseline;gap:.8rem;color:var(--secondary)}
.cat h2::before{content:counter(cat,decimal-leading-zero);font-size:.85rem;font-weight:500;color:var(--accent);letter-spacing:.1em}
.cat h2::after{content:"";flex:1;height:1px;background:var(--line)}
.cat .sub{color:var(--muted);font-size:.88rem;margin:0 0 .6rem}
.item{display:grid;grid-template-columns:2.2rem 1fr auto;gap:.1rem .8rem;padding:1rem 0;border-bottom:1px solid var(--line);counter-increment:item;align-items:center}
.item::before{content:counter(item,decimal-leading-zero);grid-row:span 2;color:var(--muted);font-size:.8rem;letter-spacing:.08em;align-self:start;padding-top:.2rem}
.item:last-child{border-bottom:0}
.name{font-weight:500;font-size:1.05rem}
.desc{grid-column:2/3;color:var(--muted);font-size:.88rem;margin:0}
.price{font-family:var(--display);font-size:1rem;color:var(--secondary);white-space:nowrap}
.price:empty{display:none}
.item .act{grid-column:3;grid-row:1/span 2;justify-self:end;font:600 .82rem var(--body);color:var(--on-primary);background:transparent;border:1.5px solid var(--accent);border-radius:999px;padding:.35rem 1rem;text-decoration:none}

.visit a:focus-visible{outline:3px solid var(--secondary);outline-offset:2px}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:1.4rem 1rem 2.4rem}
footer strong{color:var(--ink);font-weight:500}

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      const nm=L(i,"ar","en"), wa=String(C.whatsapp||"").replace(/\D/g,"");
      const act=(K[lang].act&&wa)?`<a class="act" href="https://wa.me/${wa}?text=${encodeURIComponent(K[lang].bookText+" "+nm)}" target="_blank" rel="noopener">${K[lang].act}</a>`:"";
      html+=`<div class="item${i.img?" has-img":""}">${i.img?`<img class="thumb" src="${i.img}" alt="" loading="lazy">`:""}<div class="name">${esc(nm)}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${i.p!=null?`${i.priceFrom?(lang==="ar"?"من ":"from "):""}${fmt(i.p)} ${cur()}`:""}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}${act}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:K.ar.wa,map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:K.en.wa,map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  const tm=$("team"), team=C.team||[];
  tm.hidden=!(team.length&&K[lang].team);
  tm.innerHTML=team.length?`<h2>${K[lang].team}</h2><ul>${team.map(m=>`<li>${esc(L(m,"ar","en"))}${L(m,"roleAr","roleEn")?`<span>${esc(L(m,"roleAr","roleEn"))}</span>`:""}</li>`).join("")}</ul>`:"";
  renderHero(); renderChips(); renderMenu();
  const cta=$("heroCta"); const w=String(C.whatsapp||"").replace(/\D/g,""); cta.hidden=!w; cta.href="https://wa.me/"+w+"?text="+encodeURIComponent(K[lang].bookText); cta.textContent=lang==="ar"?"احجز موعدك على واتساب":"Book on WhatsApp";
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("site-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
