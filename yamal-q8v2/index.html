<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو يامال الغنايم</title>
<meta name="description" content="روح نجد في قهوتنا المختصة">
<meta property="og:title" content="منيو يامال الغنايم">
<meta property="og:description" content="روح نجد في قهوتنا المختصة">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/yamal-q8v2/">
<meta property="og:image" content="https://khashab12.github.io/menus/yamal-q8v2/logo.png">
<meta name="theme-color" content="#5b1e22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;600;700&family=Amiri:wght@400;700&family=Marcellus&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--maroon:#5b1e22;--maroon2:#7a2a2e;--cream:#f4ece2;--card:#fbf6ef;--ink:#3b1a1a;--soft:#7d5a55;--sand:#c9a77c;--line:#e2d3c1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#1c1112;--card:#27181a;--ink:#f4ece2;--soft:#cdb5a6;--line:#43292b;--sand:#d9b98e}}
:root[data-theme="dark"]{--cream:#1c1112;--card:#27181a;--ink:#f4ece2;--soft:#cdb5a6;--line:#43292b;--sand:#d9b98e}
body{background:var(--cream);color:var(--ink);font-family:"Reem Kufi","Marcellus",sans-serif}
.demo-note{background:var(--maroon);color:#f4ece2}
/* Sadu weave band, drawn with gradients */
.sadu{height:26px;background:
 linear-gradient(45deg,transparent 35%,var(--cream) 35% 65%,transparent 65%) 0 0/26px 26px,
 linear-gradient(-45deg,transparent 35%,var(--cream) 35% 65%,transparent 65%) 0 0/26px 26px,
 repeating-linear-gradient(90deg,var(--maroon) 0 13px,#2a0f10 13px 26px);border-block:4px solid var(--sand)}
header{background:var(--maroon);color:#f4ece2;text-align:center;position:relative;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 0}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:transparent;color:#f4ece2;border:1px solid var(--sand);border-radius:4px;padding:.25rem .85rem;cursor:pointer;min-height:36px;font-size:.82rem}
/* Najdi door: pointed arch with triangle crenellations */
.door{display:inline-block;position:relative;padding:2.3rem 1.6rem 1.4rem;margin-bottom:1.4rem;border:2px solid var(--sand);border-bottom:0;border-radius:50% 50% 0 0/40px 40px 0 0}
.door::before{content:"";position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:84px;height:12px;background:
 linear-gradient(135deg,transparent 50%,var(--sand) 50%) 0 0/12px 12px repeat-x,linear-gradient(225deg,transparent 50%,var(--sand) 50%) 0 0/12px 12px repeat-x}
#logo{display:inline-block;padding:.4rem .8rem;background:var(--maroon)}
.ar1{font:700 2.4rem/1.1 "Reem Kufi";margin:0}
.en1{font:400 .8rem "Marcellus";letter-spacing:.35em;color:var(--sand);direction:ltr}
.tag{font:400 1.1rem "Amiri",serif;margin:.6rem 0 0;color:#ead9c6}
.info{font-size:.8rem;opacity:.8;margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--maroon);background:none;color:var(--ink);border-radius:3px;padding:.3rem .9rem;cursor:pointer;min-height:36px;font-size:.88rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{border-color:var(--sand)}}
.chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:var(--cream)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:1.6rem;scroll-margin-top:120px}
h2{margin:0 0 .6rem;display:flex;align-items:center;gap:.6rem;font:700 1.3rem "Reem Kufi";color:var(--maroon)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--sand)}}
:root[data-theme="dark"] h2{color:var(--sand)}
html[lang=en] h2{font:400 1.2rem "Marcellus";letter-spacing:.12em;text-transform:uppercase}
h2::before{content:"";width:14px;height:14px;background:var(--sand);transform:rotate(45deg);flex:0 0 auto}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.it{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;background:var(--card);border-inline-start:4px solid var(--maroon);padding:.6rem .8rem;margin:.4rem 0;border-radius:2px}
.nm{font-weight:600}
.sub{display:block;font:400 .78rem "Marcellus";color:var(--soft);direction:ltr;text-align:start}
html[lang=en] .sub{display:none}
.pr{white-space:nowrap;font-weight:700;color:var(--maroon2);direction:ltr}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pr{color:var(--sand)}}
:root[data-theme="dark"] .pr{color:var(--sand)}
.pr small{font-size:.7rem;font-weight:400;margin-inline-start:.2rem}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div class="door"><div id="logo"><p class="ar1">يامال الغنايم</p><div class="en1">YAMAL ALGHANAYIM</div></div></div>
  <p class="tag" id="tag"></p>
  <p class="info" id="info"></p>
  <div style="height:1rem"></div>
</header>
<div class="sadu" aria-hidden="true"></div>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "جميع الأسعار تشمل ضريبة القيمة المضافة ١٥٪", "tag": "روح نجد في قهوتنا المختصة"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "All prices include 15% VAT", "tag": "The spirit of Najd in our specialty coffee"}};
let lang="ar", active="all", query="";
const KEY="yamal-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tag").textContent=T[lang].tag; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${body}</section>`; }
function item(i){ return `<div class="it"><span class="nm">${esc(L(i,"ar","en"))}<span class="sub">${esc(i.en)}</span></span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
