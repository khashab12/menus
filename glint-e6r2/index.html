<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--sand:#e9dfcf;--sand2:#dccdb6;--paper:#f5f0e7;--card:#fbf8f2;--ink:#221d1a;--soft:#7a6d61;--gold:#b58a4f;--line:#e2d6c3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15120f;--card:#1f1a16;--ink:#f3ece1;--soft:#b9a994;--gold:#d3aa6d;--line:#362e27}}
:root[data-theme="dark"]{--paper:#15120f;--card:#1f1a16;--ink:#f3ece1;--soft:#b9a994;--gold:#d3aa6d;--line:#362e27}
body{background:var(--paper);color:var(--ink);font-family:"Alexandria","Poppins",system-ui,sans-serif}
html[lang=en] body{font-family:"Poppins","Alexandria",sans-serif}
.demo-note{background:#221d1a;color:#e9dfcf}
/* sun glint: soft rays rising behind the wordmark */
header{position:relative;background:var(--sand);color:#221d1a;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3.4rem) 1.2rem 2rem;overflow:hidden}
header::before{content:"";position:absolute;left:50%;top:62%;width:900px;height:900px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0 4deg,transparent 4deg 13deg);-webkit-mask:radial-gradient(circle,#000 0 14%,transparent 58%);mask:radial-gradient(circle,#000 0 14%,transparent 58%);pointer-events:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#2a231d;color:#f3ece1}:root:not([data-theme="light"]) .lang{background:#e9dfcf;color:#221d1a}:root:not([data-theme="light"]) header::before{background:repeating-conic-gradient(from 0deg,rgba(211,170,109,.12) 0 4deg,transparent 4deg 13deg)}}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#221d1a;color:#e9dfcf;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font-size:.8rem;z-index:2}
#logo{position:relative;display:inline-block;padding:.5rem 1rem;direction:ltr}
.wm{font:200 3.6rem/1 "Poppins";letter-spacing:.14em;margin-inline-end:-.14em;color:inherit}
.sub{font:300 .62rem "Poppins";letter-spacing:.14em;line-height:1.5;text-align:start;margin-top:.45rem;opacity:.85;width:max-content;margin-inline:auto}
.info{position:relative;font-size:.8rem;margin:.9rem 0 0;opacity:.8}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;padding:.55rem .2rem;font:inherit}
.chips{display:flex;gap:1.1rem;overflow-x:auto;padding:.6rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:none;color:var(--soft);padding:.3rem 0;cursor:pointer;min-height:36px;font-size:.88rem;border-bottom:2px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2.2rem;scroll-margin-top:120px}
/* numbered "moments" with a small glint star */
.mh{display:flex;align-items:flex-end;gap:.8rem;margin-bottom:.6rem}
.num{font:200 3rem/.8 "Poppins";color:var(--gold);direction:ltr}
h2{margin:0;font:500 1.15rem "Alexandria"}
html[lang=en] h2{font:400 1.35rem "Marcellus";letter-spacing:.06em;text-transform:uppercase}
.star{width:14px;height:14px;margin-inline-start:auto;margin-bottom:.35rem;color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.it{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.75rem .8rem .7rem;display:flex;flex-direction:column;justify-content:space-between;min-height:92px}
.nm{font-weight:500;line-height:1.35}
.ds{font-size:.72rem;color:var(--soft);margin-top:.15rem}
.pr{margin-top:.5rem;font:300 1.25rem "Poppins";direction:ltr;text-align:end}
.pr small{font-size:.65rem;color:var(--soft);margin-inline-start:.25rem}
.sl{margin:0 .15rem;color:var(--soft)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

;
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "تصور تجريبي — الأصناف والأسعار أمثلة وليست منيو المحل", "note": ""}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — items and prices are examples, not the café's menu", "note": ""}};
let lang="ar", active="all", query="";
const KEY="glint-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

const STAR='<svg class="star" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>';
function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><div class="mh"><span class="num">${String(ci+1).padStart(2,"0")}</span><h2>${esc(L(c,"ar","en"))}</h2>${STAR}</div><div class="grid">${body}</div></section>`; }
function item(i){ const d=L(i,"dAr","dEn"); return `<div class="it"><div><div class="nm">${esc(L(i,"ar","en"))}</div>${d?`<div class="ds">${esc(d)}</div>`:""}</div><div class="pr">${P(i)}<small>${cur()}</small></div></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
