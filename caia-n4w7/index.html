<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--navy:#2f3a6b;--navy2:#252e57;--sky:#8fb3e0;--paper:#f4f6fb;--card:#ffffff;--ink:#1f2748;--soft:#6c7596;--line:#e2e7f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121630;--card:#1b2142;--ink:#eef1fa;--soft:#a8b1cf;--line:#2a3256;--navy:#8fb3e0}}
:root[data-theme="dark"]{--paper:#121630;--card:#1b2142;--ink:#eef1fa;--soft:#a8b1cf;--line:#2a3256;--navy:#8fb3e0}
body{background:var(--paper);color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif}
.demo-note{background:#2f3a6b;color:#fff}
header{position:relative;text-align:center;background:#2f3a6b;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 2rem}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#8fb3e0;color:#1f2748;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "Readex Pro";z-index:2}

.wm{font:700 3.4rem/1.2 "Aref Ruqaa";color:#8fb3e0}
.ws{font:400 .8rem "Readex Pro";letter-spacing:.3em;color:#cfdcf2;direction:ltr;margin-top:.5rem}
.tg{margin:.9rem 0 0;font:500 1rem "Readex Pro"}
.info{font-size:.76rem;color:#b8c5e6;margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .84rem "Readex Pro"}
.chip[aria-pressed="true"]{background:#2f3a6b;border-color:#2f3a6b;color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
/* the light tab-label section titles from their board */
h2{display:table;margin:0 auto -.9rem;position:relative;z-index:1;padding:.3rem 1.4rem;background:#dfe9f8;color:#2f3a6b;font:600 1.1rem "Readex Pro";border-radius:4px 4px 0 0}
h2 small{font:400 .72rem "Readex Pro";color:#5a6a99;margin-inline-start:.4rem}
.board{background:var(--card);border-radius:14px;padding:1.4rem .9rem .6rem;display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1rem;box-shadow:0 1px 0 var(--line)}
.it{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.it .cup{flex:0 0 auto;width:30px;height:38px;border-radius:4px 4px 8px 8px;background:linear-gradient(#2f3a6b 0 22%,#8fb3e0 22% 100%);position:relative}
.it .cup::after{content:"";position:absolute;left:8px;right:8px;top:12px;height:2px;background:#fff;opacity:.8;border-radius:2px}
.it .tx{flex:1;min-width:0}
.it .a{display:block;font-weight:600;color:var(--navy);line-height:1.3}
.it .e{display:block;font-size:.7rem;color:var(--soft);direction:ltr;text-align:right}
html[dir=ltr] .it .e{text-align:left}
.it .pr{display:block;font:600 1rem "Readex Pro";direction:ltr;text-align:right;color:var(--ink)}
html[dir=ltr] .it .pr{text-align:left}
.it .pr small{font-size:.6rem;color:var(--soft);margin-inline-start:.2rem}
.it .kc{font-size:.62rem;color:var(--soft)}
.call{margin:1.8rem 0 0;display:flex;gap:.8rem;align-items:center;justify-content:space-between;background:#2f3a6b;color:#fff;border-radius:12px;padding:.9rem 1rem}
.call b{display:block;font-weight:600}
.call a{color:#2f3a6b;background:#dfe9f8;border-radius:8px;padding:.45rem .8rem;font:700 1rem "Readex Pro";text-decoration:none;direction:ltr}
.nt{margin:1.2rem 0 0;text-align:center;font-size:.76rem;color:var(--soft)}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}
@media (max-width:380px){.board{grid-template-columns:1fr}}

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "tg": "كايا قهوة مختصة", "kc": "سعرة", "cb": "اتصل لتجهيز طلبك", "nt": "الأصناف والأسعار والسعرات من منيو كايا المنشور"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "tg": "Caia Specialty Coffee", "kc": "kcal", "cb": "Call ahead and we'll have it ready", "nt": "Items, prices and calories from Caia's published menu"}};
let lang="ar", active="all", query="";
const KEY="caia-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2><div class="board">${body}</div></section>`; }
function item(i){ return `<div class="it"><span class="cup"></span><span class="tx"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}<span class="pr">${fmt(i.p)}<small>${cur()}</small>${i.c!=null?` <span class="kc">· ${esc(String(i.c))} ${T[lang].kc}</span>`:""}</span></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<div class="call"><b>${T[lang].cb}</b><a href="tel:+966556074478">055 607 4478</a></div><p class="nt">${T[lang].nt}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
