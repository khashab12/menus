*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}

:root{--black:#141210;--gold:#c2a15f;--gold2:#e2cb94;--cream:#f7f3ea;--card:#ffffff;--ink:#1d1a16;--soft:#77705f;--line:#e8e0cc}

body{background:var(--cream);color:var(--ink);font-family:"Alexandria",system-ui,sans-serif;font-weight:300}
.demo-note{background:var(--gold);color:#141210}

header{position:relative;text-align:center;background:#141210;color:#f1e9d6;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.8rem;overflow:hidden}

.depts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.dp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem .5rem;text-align:center}
.dp b{display:block;font-weight:500}
.dp span{font-size:.72rem;color:var(--soft)}

.hrs{margin-top:1.8rem;text-align:center;font-size:.85rem;color:var(--soft)}
