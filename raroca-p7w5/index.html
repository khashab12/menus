<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--black:#151515;--cream:#f2ebe0;--paper:#f7f3ec;--card:#ffffff;--ink:#151515;--soft:#77706a;--line:#e3dbcf;--gold:#b8873a;--green:#1f6b3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121110;--card:#1c1a18;--ink:#f2ebe0;--soft:#b3aba1;--line:#2e2a26}}
:root[data-theme="dark"]{--paper:#121110;--card:#1c1a18;--ink:#f2ebe0;--soft:#b3aba1;--line:#2e2a26}
body{background:var(--paper);color:var(--ink);font-family:"Cairo","Montserrat",system-ui,sans-serif}
html[lang=en] body{font-family:"Montserrat","Cairo",sans-serif}
.demo-note{background:#151515;color:#f2ebe0}
/* the patterned sleeve band from their cups: black + gold geometric rows */
.band{height:22px;background:
 linear-gradient(135deg,#151515 25%,transparent 25%) -6px 0/12px 12px,linear-gradient(225deg,#151515 25%,transparent 25%) -6px 0/12px 12px,
 linear-gradient(315deg,#151515 25%,transparent 25%) 0 0/12px 12px,linear-gradient(45deg,#151515 25%,transparent 25%) 0 0/12px 12px,#b8873a;
 border-top:3px solid #151515;border-bottom:3px solid #151515}
header{position:relative;text-align:center;background:#f2ebe0;color:#151515;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 1.6rem}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#151515;color:#f2ebe0;border:0;border-radius:3px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:600 .78rem "Montserrat";z-index:2}
#logo{display:inline-block;padding:.6rem 1.2rem;background:#f2ebe0;direction:ltr}
.mono{display:block;width:96px;height:84px;margin:0 auto}
.wm{font:600 .95rem "Montserrat";letter-spacing:.38em;margin-inline-start:.38em;margin-top:.3rem}
.tg{margin:.8rem 0 0;font:700 1.15rem "Cairo"}
.info{font-size:.78rem;color:#77706a;margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:3px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:3px;padding:.28rem 1rem;cursor:pointer;min-height:36px;font:600 .84rem "Cairo","Montserrat"}
.chip[aria-pressed="true"]{background:#151515;color:#f2ebe0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:#b8873a;border-color:#b8873a;color:#151515}}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
/* their offer note: a pinned paper card with a green tape label */
.note{position:relative;margin:1.6rem .3rem 0;background:#fffdf8;color:#151515;padding:1.6rem 1rem 1rem;box-shadow:0 2px 0 rgba(0,0,0,.06),3px 4px 0 rgba(0,0,0,.05);transform:rotate(-1deg);text-align:center}
.note .tape{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#b7d77a;color:#151515;font:700 .85rem "Cairo";padding:.2rem 1rem}
.note b{display:block;font:700 1.05rem "Cairo"}
.note span{display:block;font-size:.88rem;margin-top:.2rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{display:flex;align-items:center;gap:.6rem;margin:0 0 .6rem;font:700 1.25rem "Cairo"}
h2 i{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:#151515;color:#f2ebe0;font:700 .9rem/1 "Montserrat";font-style:normal}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2 i{background:#b8873a;color:#151515}}
h2 small{margin-inline-start:auto;font:600 .7rem "Montserrat";letter-spacing:.2em;color:var(--soft);direction:ltr;text-transform:uppercase}
.cup{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:center;background:var(--card);border-radius:10px;padding:.7rem .9rem;margin-bottom:.5rem;border:1px solid var(--line);position:relative;overflow:hidden}
.cup::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:linear-gradient(#151515 0 33%,#b8873a 33% 66%,#151515 66%)}
.nm{padding-inline-start:.4rem}
.nm .a{display:block;font-weight:600}
.nm .e{display:block;font:400 .78rem "Montserrat";color:var(--soft);direction:ltr;text-align:start}
html[dir=rtl] .nm .e{text-align:right}
.pr{font:700 1.05rem "Montserrat";white-space:nowrap;direction:ltr}
.pr small{font:400 .62rem "Cairo";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.end{margin-top:2rem}
.end p{text-align:center;font:600 1rem "Cairo";margin:.8rem 0 0}
.visit a{border-radius:3px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
