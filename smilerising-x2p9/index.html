:root{color-scheme:light}
:root{
  --primary:#855442; --on-primary:#fffaf5; --secondary:#7d4f3f; --bg:#fbf6f0; --accent:#e0a574;
  --ink:#3b2a24; --muted:#6b574f; --card:#ffffff; --line:#eedfd3;
  --display:system-ui,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{--bg:#1d1613;--ink:#f3e7df;--muted:#b9a398;--card:#271e1a;--line:#3d302a}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased}
.demo-note{background:#f3e3d6;color:#5a3a2e;text-align:center;font-size:.8rem;padding:.45rem 1rem}
header.hero{position:relative;padding:1.2rem 1rem 0;text-align:center}
.arch{position:relative;max-width:420px;margin:0 auto;background:var(--primary);color:var(--on-primary);border-radius:210px 210px 28px 28px;padding:2.2rem 1.4rem 1.8rem;overflow:hidden}
.rays{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:320px;height:170px;opacity:.22}
.hero-inner{position:relative}
.logo{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#fff;display:block;margin:0 auto .8rem;box-shadow:0 0 0 6px rgba(255,255,255,.18)}
.brand{font-family:var(--display);font-weight:600;font-size:1.7rem;margin:0}
.tag{margin:.3rem 0 0;font-size:.95rem}
.info{margin:.7rem auto 0;font-size:.85rem;max-width:34ch}
.hero-cta{display:inline-block;margin-top:1.1rem;background:var(--on-primary);color:var(--secondary);text-decoration:none;font-weight:700;padding:.75rem 1.5rem;border-radius:999px}
.lang{position:absolute;top:1.5rem;inset-inline-end:1.2rem;z-index:2;background:var(--card);color:var(--secondary);border:1px solid var(--line);border-radius:999px;padding:.3rem .85rem;font:500 .82rem var(--body);cursor:pointer}
.lang:focus-visible,.chip:focus-visible,.search input:focus-visible,.hero-cta:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:1rem 0 .6rem}
.search{max-width:720px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.7rem 1.1rem;font:1rem var(--body)}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 1rem .1rem;max-width:720px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:.4rem 1rem;font:500 .9rem var(--body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
main{max-width:720px;margin:0 auto;padding:.3rem 1rem 2.4rem}
section.cat{margin-top:1.6rem;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.1rem 1.1rem .4rem}
.cat h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0 0 .3rem;display:flex;align-items:center;gap:.6rem;color:var(--secondary)}
.cat h2 .ic{width:34px;height:34px;border-radius:50%;background:#f6e6da;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.cat .sub{color:var(--muted);font-size:.86rem;margin:0 0 .5rem}
.item{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;padding:.8rem 0;border-top:1px solid var(--line);align-items:center}
.name{font-weight:600}
.desc{grid-column:1/2;color:var(--muted);font-size:.85rem;margin:0}
.price{color:var(--secondary);font-size:.95rem}
.price:empty{display:none}
.cal{display:none}
.item .act{grid-column:2;grid-row:1/span 2;font:700 .82rem var(--body);color:var(--on-primary);background:var(--primary);border-radius:999px;padding:.4rem 1.05rem;text-decoration:none}
.pick{display:inline-block;margin-inline-start:.45rem;font-size:.68rem;font-weight:700;background:#f6e6da;color:var(--secondary);border-radius:6px;padding:.05rem .45rem;vertical-align:middle}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem}
.team{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.visit a{display:block;text-align:center;padding:.85rem 1rem;border-radius:16px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.visit a.wa{grid-column:1/-1;background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:1.4rem 1rem 2.4rem}
footer strong{color:var(--ink)}
</style>

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const ICONS = {"dental": "<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#855442\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M7 3c-2.5 0-4 2-4 4.5 0 3 1.5 4.5 2 7.5.4 2.5 1 6 2.5 6s1.6-3 2.2-5c.3-1 .7-1.5 2.3-1.5s2 .5 2.3 1.5c.6 2 .8 5 2.2 5s2.1-3.5 2.5-6c.5-3 2-4.5 2-7.5C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z\"/></svg>", "derma": "<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#855442\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 21c-5-3-8-7-8-11a8 8 0 0 1 16 0c0 4-3 8-8 11z\"/><path d=\"M12 7v10\"/></svg>", "laser": "<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#855442\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8\"/></svg>", "nutrition": "<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#855442\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 7c-3-2-8-1-8 5s4 9 6 9c1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 6-3 6-9s-5-7-8-5z\"/><path d=\"M12 7c0-2 1-4 3-4\"/></svg>"};
const KIND = C.kind || "menu";
const K = {
  menu:{ar:{search:"ابحث عن صنف…",pick:"ترشيحنا",what:"الأصناف والأسعار",upd:"آخر تحديث للأسعار: اليوم",made:"منيو ديجيتال من تصميم",wa:"اطلب على واتساب",act:"",team:""},
        en:{search:"Search the menu…",pick:"Our pick",what:"items and prices",upd:"Prices last updated: today",made:"Digital menu designed by",wa:"Order on WhatsApp",act:"",team:""}},
  clinic:{ar:{search:"ابحث عن خدمة…",pick:"الأكثر طلباً",what:"الخدمات",upd:"آخر تحديث: اليوم",made:"موقع من تصميم",wa:"احجز على واتساب",act:"احجز",team:"الأطباء",bookText:"السلام عليكم، أبغى أحجز موعد:"},
          en:{search:"Search services…",pick:"Popular",what:"services",upd:"Last updated: today",made:"Website designed by",wa:"Book on WhatsApp",act:"Book",team:"Our doctors",bookText:"Hello, I'd like to book:"}},
  store:{ar:{search:"ابحث عن منتج…",pick:"الأكثر مبيعاً",what:"المنتجات والأسعار",upd:"آخر تحديث: اليوم",made:"متجر من تصميم",wa:"اطلب على واتساب",act:"اطلب",team:"",bookText:"أهلاً، عايز أطلب:"},
         en:{search:"Search products…",pick:"Best seller",what:"products and prices",upd:"Last updated: today",made:"Store designed by",wa:"Order on WhatsApp",act:"Order",team:"",bookText:"Hi, I'd like to order:"}},
  beauty:{ar:{search:"ابحث عن خدمة…",pick:"الأكثر طلباً",what:"الخدمات والأسعار",upd:"آخر تحديث: اليوم",made:"موقع من تصميم",wa:"احجز على واتساب",act:"احجز",team:"الفريق",bookText:"السلام عليكم، أبغى أحجز:"},
          en:{search:"Search services…",pick:"Popular",what:"services and prices",upd:"Last updated: today",made:"Website designed by",wa:"Book on WhatsApp",act:"Book",team:"Our team",bookText:"Hello, I'd like to book:"}}
}[KIND] || null;
const T = {
  ar:{dir:"rtl",lang:"English",search:K.ar.search,pick:K.ar.pick,empty:"ما فيه نتيجة بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — ${K.ar.what} أمثلة وتتغير لبيانات ${C.nameAr||C.name} الحقيقية`,updated:K.ar.upd,credit:n=>`${K.ar.made} <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:K.en.search,pick:K.en.pick,empty:"Nothing matches that. Try another word.",all:"All",
      note:`Demo version — ${K.en.what} are samples, to be replaced with ${C.name}'s real ones`,updated:K.en.upd,credit:n=>`${K.en.made} <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("site-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${ICONS[c.id]?`<span class="ic">${ICONS[c.id]}</span>`:""}${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      const nm=L(i,"ar","en"), wa=String(C.whatsapp||"").replace(/\D/g,"");
      const act=(K[lang].act&&wa)?`<a class="act" href="https://wa.me/${wa}?text=${encodeURIComponent(K[lang].bookText+" "+nm)}" target="_blank" rel="noopener">${K[lang].act}</a>`:"";
      html+=`<div class="item${i.img?" has-img":""}">${i.img?`<img class="thumb" src="${i.img}" alt="" loading="lazy">`:""}<div class="name">${esc(nm)}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${i.p!=null?`${i.priceFrom?(lang==="ar"?"من ":"from "):""}${fmt(i.p)} ${cur()}`:""}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}${act}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:K.ar.wa,map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:K.en.wa,map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  const tm=$("team"), team=C.team||[];
  tm.hidden=!(team.length&&K[lang].team);
  tm.innerHTML=team.length?`<h2>${K[lang].team}</h2><ul>${team.map(m=>`<li>${esc(L(m,"ar","en"))}${L(m,"roleAr","roleEn")?`<span>${esc(L(m,"roleAr","roleEn"))}</span>`:""}</li>`).join("")}</ul>`:"";
  renderHero(); renderChips(); renderMenu();
  const cta=$("heroCta"); const w=String(C.whatsapp||"").replace(/\D/g,""); cta.hidden=!w; cta.href="https://wa.me/"+w+"?text="+encodeURIComponent(K[lang].bookText); cta.textContent=lang==="ar"?"احجز موعدك على واتساب":"Book on WhatsApp";
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("site-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
