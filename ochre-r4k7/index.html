<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--cream:#f8e1b4;--paper:#fcefd6;--red:#a3202f;--ink:#1d1715;--soft:#7c6a58;--line:#e9cf9f;--card:#fff6e4;--star:#c23a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#1b1512;--paper:#221a16;--card:#2a201b;--ink:#f8ead2;--soft:#c2ab90;--line:#3f2f26;--red:#e2606a;--star:#ef7a7a}}
:root[data-theme="dark"]{--cream:#1b1512;--paper:#221a16;--card:#2a201b;--ink:#f8ead2;--soft:#c2ab90;--line:#3f2f26;--red:#e2606a;--star:#ef7a7a}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic","Rubik",system-ui,sans-serif}
html[lang=en] body{font-family:"Rubik","IBM Plex Sans Arabic",sans-serif}
.demo-note{background:var(--red);color:#fff}
/* header = a street corner: two walls meeting, the sign hung on the corner */
header{position:relative;text-align:center;background:#f8e1b4;color:#1d1715;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 1.8rem;overflow:hidden}
header::after{content:"";position:absolute;inset:auto 0 0 0;height:14px;background:repeating-linear-gradient(90deg,#a3202f 0 22px,#f8e1b4 22px 30px)}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);right:1rem;background:#1d1715;color:#f8e1b4;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:600 .8rem "Rubik";z-index:2}
.corner{position:absolute;top:0;left:0;width:96px;height:96px}
#logo{display:inline-block;padding:.5rem 1.2rem .4rem;background:#f8e1b4;direction:ltr}
.wm{font:800 3.3rem/1 "Rubik";letter-spacing:-.01em;direction:ltr;color:#1d1715}
.wm i{font-style:normal;display:inline-block;transform:translateY(-.02em)}
.ar{font:700 1.15rem/1 "IBM Plex Sans Arabic";text-align:right;margin-top:-.15rem;padding-inline-end:.1rem;direction:rtl}
.tg{margin:.9rem 0 0;font:600 .95rem "Rubik";color:#a3202f;letter-spacing:.02em;direction:ltr}
.info{font-size:.78rem;color:#7c6a58;margin:.3rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--red)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--red);background:none;color:var(--red);border-radius:999px;padding:.28rem 1rem;cursor:pointer;min-height:36px;font:600 .82rem "Rubik","IBM Plex Sans Arabic";text-transform:uppercase;letter-spacing:.04em}
.chip[aria-pressed="true"]{background:var(--red);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{margin:0 0 .3rem;font:800 1.45rem/1.1 "Rubik";color:var(--red);text-transform:uppercase;letter-spacing:.01em;direction:ltr;text-align:left}
h2 small{display:block;font:600 .95rem "IBM Plex Sans Arabic";text-transform:none;margin-top:.2rem}
html[dir=rtl] h2{text-align:right}
.rule{height:2px;background:linear-gradient(90deg,var(--red) 0 48px,var(--line) 48px);margin-bottom:.4rem}
html[dir=rtl] .rule{background:linear-gradient(270deg,var(--red) 0 48px,var(--line) 48px)}
.row{padding:.62rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.top{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.en{font:600 1rem "Rubik";text-transform:uppercase;letter-spacing:.01em;direction:ltr}
.a{font:500 .92rem "IBM Plex Sans Arabic"}
.sig .en,.sig .a{color:var(--red)}
.star{color:var(--star);font-size:.8rem}
.meta{display:flex;align-items:baseline;gap:1rem;margin-top:.15rem;direction:ltr}
html[dir=rtl] .meta{flex-direction:row-reverse;justify-content:flex-end}
.pr{font:700 1.05rem "Rubik";color:var(--red)}
.pr small{font:500 .62rem "Rubik";color:var(--soft);margin-inline-start:.2rem}
.cal{font:500 .68rem "Rubik";color:var(--soft);letter-spacing:.05em}
.d{display:block;font-size:.72rem;color:var(--soft);margin-top:.15rem;direction:ltr;text-align:left}
html[dir=rtl] .d{text-align:right}
.key{margin:1.6rem 0 0;font-size:.74rem;color:var(--soft);text-align:center}
.key b{color:var(--star)}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(c.en)}${lang==="ar"?`<small>${esc(c.ar)}</small>`:""}</h2><div class="rule"></div>${body}</section>`; }
function item(i){ return `<div class="row${i.s?" sig":""}"><div class="top">${i.s?`<span class="star">★</span>`:""}<span class="en">${esc(i.en)}</span>${lang==="ar"?`<span class="a">${esc(i.ar)}</span>`:""}</div>${i.dEn?`<span class="d">${esc(lang==="ar"?i.dAr:i.dEn)}</span>`:""}<div class="meta"><span class="pr">${fmt(i.p)}<small>${cur()}</small></span>${i.c!=null?`<span class="cal">${fmt(i.c)} ${T[lang].cal}</span>`:""}</div></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="key">${T[lang].key}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
