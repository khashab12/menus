*,*::before,*::after{box-sizing:border-box}

, "en": "1 layer", "p": 70, "from": 1}, {"ar": "طبقة ونص", "en": "1.5 layers", "p": 100, "from": 1}, {"ar": "طبقتين", "en": "2 layers", "p": 140, "from": 1}, {"head": "٤ إنش", "headEn": "4 inch", "ar": "طبقة", "en": "1 layer", "p": 50, "from": 1}, {"ar": "طبقتين", "en": "2 layers", "p": 100, "from": 1}]}, {"id": "cupcakes", "ar": "الكب كيك", "en": "Cupcakes", "script": "Cupcake menu", "items": [{"ar": "نص درزن (٦ حبات)", "en": "Half dozen (6)", "p": 40, "from": 1}, {"ar": "درزن (١٢ حبة)", "en": "Dozen (12)", "p": 75, "from": 1}]}, {"id": "custom", "ar": "طلبات خاصة", "en": "Custom", "script": "Custom menu", "items": [{"ar": "بوكس ٥ كب كيك + كيكة ٤ إنش", "en": "Box: 5 cupcakes + 4\" cake", "p": 70, "from": 1}, {"ar": "كيك الكوب · كتابة", "en": "Cup cake · text", "p": 25}, {"ar": "كيك الكوب · رسمة", "en": "Cup cake · drawing", "p": 27}, {"ar": "كيك الكوب · كتابة ورسمة", "en": "Cup cake · text + drawing", "p": 30}, {"ar": "إضافة ورد", "en": "Add flowers", "p": 20}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "order": "اطلب", "from": "يبدأ من", "cta": "اطلب كيكتك", "nt": "الأسعار تبدأ من وتختلف حسب التصميم · الطلب قبل بيومين · التوصيل ٦ – ٩ المساء"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "order": "Order", "from": "from", "cta": "Order your cake", "nt": "Starting prices, vary by design · order 2 days ahead · delivery 6 – 9 PM"}};
let lang="ar", active="all", query="";
const KEY="kikah-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const WA=t=> C.whatsapp?`https://wa.me/${String(C.whatsapp).replace(/\D/g,"")}?text=${encodeURIComponent(t)}`:(C.instagram||"#");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); const c=$("cta"); c.textContent=T[lang].cta; c.href=WA(lang==="ar"?"هلا، أبي أطلب كيكة":"Hi, I'd like to order a cake"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(c.script)}<small>${esc(L(c,"ar","en"))}</small></h2>${body}</section>`; }
function item(i,k,c){ const nm=lang==="ar"?i.ar:i.en;
  const head=i.g?`${k===1||i.first?"":""}`:"";
  return `${i.head?`<div class="sz" style="grid-column:1/-1">${esc(lang==="ar"?i.head:i.headEn)}</div>`:""}<div class="it"><b>${esc(nm)}</b>${i.from?`<span class="fr">${T[lang].from}</span>`:""}<span class="pr">${fmt(i.p)}<small>${cur()}</small></span><a href="${WA((lang==="ar"?"هلا، أبي أطلب: ":"Hi, I'd like to order: ")+(i.head?(lang==="ar"?i.head:i.headEn)+" ":"")+nm)}" target="_blank" rel="noopener">${T[lang].order}</a></div>`; }
function afterRender(){ document.querySelectorAll("#menu section").forEach(s=>{ const items=[...s.querySelectorAll(".sz,.it")]; const g=document.createElement("div"); g.className="grid"; items.forEach(x=>g.appendChild(x)); s.appendChild(g); }); if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="nt">${T[lang].nt}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"تصميم وتطوير ":"Designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
