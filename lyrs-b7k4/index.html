<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--navy:#1d2a44;--copper:#b0683a;--copper2:#8f4f28;--cream:#f4ecdf;--paper:#f8f3ea;--card:#fffcf6;--ink:#1d2a44;--soft:#6e7383;--line:#e6dccb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1522;--card:#182030;--ink:#f4ecdf;--soft:#a9adba;--line:#283247;--navy:#e9dcc6}}
:root[data-theme="dark"]{--paper:#0f1522;--card:#182030;--ink:#f4ecdf;--soft:#a9adba;--line:#283247;--navy:#e9dcc6}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.demo-note{background:#1d2a44;color:#f4ecdf}
header{position:relative;text-align:center;background:#f4ecdf;color:#1d2a44;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 0}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#1d2a44;color:#f4ecdf;border:0;border-radius:4px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "IBM Plex Sans Arabic";z-index:2}
#logo{display:inline-block;padding:.4rem 1.4rem;background:#f4ecdf;direction:ltr}
.wm{font:400 3.6rem/1 "DM Serif Display";letter-spacing:.12em;margin-inline-start:.12em;color:#1d2a44}
.wa{font:500 1rem "IBM Plex Sans Arabic";color:#1d2a44;margin-top:.2rem}
.tg{margin:.8rem 0 0;font:400 1.05rem "DM Serif Display";font-style:italic;color:#1d2a44}
.info{font-size:.76rem;color:#6e7383;margin:.2rem 0 0}
/* the stitched copper leather band from their shopfront */
.band{position:relative;margin:1.4rem -1.2rem 0;padding:.75rem 1rem;background:linear-gradient(180deg,#bd7646,#a35d31 55%,#8f4f28);color:#f6e6d2;font:400 1.05rem "DM Serif Display";letter-spacing:.32em;direction:ltr;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),inset 0 -2px 0 rgba(0,0,0,.15)}
.band::before,.band::after{content:"";position:absolute;left:10px;right:10px;border-top:1.5px dashed rgba(246,230,210,.6)}
.band::before{top:5px}.band::after{bottom:5px}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--navy);background:none;color:var(--navy);border-radius:4px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .84rem "IBM Plex Sans Arabic"}
.chip[aria-pressed="true"]{background:#b0683a;border-color:#b0683a;color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2.2rem;scroll-margin-top:120px}
h2{margin:0 0 .9rem;text-align:center;font:400 1.75rem/1.2 "DM Serif Display";color:var(--navy);direction:ltr}
h2 small{display:block;font:500 .9rem "IBM Plex Sans Arabic";color:var(--copper);margin-top:.2rem}
h2::after{content:"";display:block;width:56px;height:3px;margin:.55rem auto 0;background:var(--copper);border-radius:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.it{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.75rem .8rem;border-top:3px solid var(--copper)}
.it .en{display:block;font:400 1.02rem/1.25 "DM Serif Display";color:var(--navy);direction:ltr;text-align:left}
.it .ar{display:block;font:400 .82rem "IBM Plex Sans Arabic";color:var(--soft);margin-top:.3rem;text-align:right;direction:rtl}
.nt{margin:1.8rem 0 0;text-align:center;font-size:.76rem;color:var(--soft)}
.hrs{margin:1.2rem auto 0;max-width:280px;text-align:center;border:1px solid var(--copper);border-radius:6px;padding:.6rem;font:500 .9rem "IBM Plex Sans Arabic"}
.hrs b{display:block;font:400 1.3rem "DM Serif Display";color:var(--copper);direction:ltr}
.visit a{border-radius:4px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
