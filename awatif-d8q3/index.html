<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو عواطف</title>
<meta name="description" content="دكان وكلٍ له مكان">
<meta property="og:title" content="منيو عواطف">
<meta property="og:description" content="دكان وكلٍ له مكان">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/awatif-d8q3/">
<meta property="og:image" content="https://khashab12.github.io/menus/awatif-d8q3/logo.png">
<meta name="theme-color" content="#4d1c24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600&family=Marcellus&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--mar:#4d1c24;--mar2:#6b2a33;--beige:#e9dfcf;--paper:#f6f1e8;--card:#fbf7f0;--ink:#3a151b;--soft:#7d6460;--line:#e2d5c3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1a0c0f;--card:#241216;--ink:#f1e7da;--soft:#c0a99f;--line:#3a2126;--mar:#e3b9a8}}
:root[data-theme="dark"]{--paper:#1a0c0f;--card:#241216;--ink:#f1e7da;--soft:#c0a99f;--line:#3a2126;--mar:#e3b9a8}
body{background:var(--paper);color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif;font-weight:400}
.demo-note{background:#4d1c24;color:#fff}
/* maroon frame with the beige board inside, like their menu */
header{position:relative;text-align:center;background:#4d1c24;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.4rem;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#e9dfcf;color:#4d1c24;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "Readex Pro";z-index:2}
.mn{font:400 1rem "Marcellus";letter-spacing:.3em;color:#e9dfcf;margin:0 0 .9rem;direction:ltr}
.board{position:relative;max-width:420px;margin:0 auto;background:#e9dfcf;color:#4d1c24;padding:1.4rem 1rem 4.6rem;overflow:hidden}
/* line drawing of old Riyadh mud houses behind the logo */
.mud{position:absolute;inset:auto 0 0 0;width:100%;height:64px;opacity:.35}
#logo{position:relative;display:inline-block;padding:.2rem 1rem;background:transparent;direction:ltr}
.wm{font:400 4rem/1 "Lalezar";color:#4d1c24}
.ws{font:400 .95rem "Marcellus";letter-spacing:.42em;margin-inline-start:.42em;color:#4d1c24;margin-top:-.2rem}
.tg{position:relative;margin:.6rem 0 0;font:500 .98rem "Readex Pro"}
.info{position:relative;font-size:.75rem;color:#7d6460;margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--mar);background:none;color:var(--mar);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .84rem "Readex Pro"}
.chip[aria-pressed="true"]{background:#4d1c24;border-color:#4d1c24;color:#e9dfcf}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--mar);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{margin:0 0 .5rem;font:600 1.15rem "Readex Pro";color:var(--mar);display:flex;align-items:baseline;gap:.6rem}
h2 small{font:400 .8rem "Marcellus";letter-spacing:.14em;color:var(--soft);direction:ltr}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:baseline;padding:.5rem 0;border-bottom:1px solid var(--line)}
.nm .a{font-weight:500}
.nm .e{display:block;font:400 .8rem "Marcellus";color:var(--soft);direction:ltr;text-align:right}
html[dir=ltr] .nm .e{text-align:left}
.pr{font:600 1rem "Readex Pro";color:var(--mar);direction:ltr;white-space:nowrap}
.pr small{font-size:.6rem;color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.sz{display:block;font-size:.64rem;color:var(--soft);text-align:end}
.wmk{margin:2.4rem 0 0;text-align:center;font:400 3.6rem/1 "Lalezar";color:transparent;-webkit-text-stroke:1px var(--mar);opacity:.5}
.wmk span{display:block;font:400 .9rem "Marcellus";letter-spacing:.5em;-webkit-text-stroke:0;color:var(--mar);opacity:.8;direction:ltr}
.nt{margin:1.2rem 0 0;text-align:center;font-size:.76rem;color:var(--soft)}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

</header>

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "tg": "دكان وكلٍ له مكان", "sz": "صغير / كبير", "nt": "الأصناف والأسعار من قائمة أسعار عواطف المنشورة"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "tg": "A little shop with a place for everyone", "sz": "Small / Large", "nt": "Items and prices from Awatif's published price list"}};
let lang="ar", active="all", query="";
const KEY="awatif-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}${lang==="ar"?`<small>${esc(c.en.toUpperCase())}</small>`:""}</h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}</span><span><span class="pr">${P(i)}<small>${cur()}</small></span>${i.p2!=null?`<span class="sz">${T[lang].sz}</span>`:""}</span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<div class="wmk">عواطف<span>AWATIF</span></div><p class="nt">${T[lang].nt}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
