<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو BRW</title>
<meta name="description" content="Ur Favorite Specialty Coffee Bar">
<meta property="og:title" content="منيو BRW">
<meta property="og:description" content="Ur Favorite Specialty Coffee Bar">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/brw-t9c5/">
<meta name="theme-color" content="#7A5A4C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--wh:#fff;--br:#7A5A4C;--br2:#A48676;--tint:#F6F1EE;--muted:#8d776b;--line:rgba(122,90,76,.35);
 --display:"Playfair Display",Georgia,serif;--body:"Almarai",system-ui,sans-serif}
body{background:var(--wh);color:var(--br);font-family:var(--body)}
.demo-note{background:var(--br);color:#fff}
header.hero{position:relative;text-align:center;padding:1.6rem 1rem 1rem;max-width:640px;margin:0 auto}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;background:#fff;color:var(--br);border:1px solid var(--br);border-radius:999px;padding:.2rem .75rem;font:700 .78rem var(--body);cursor:pointer;z-index:2}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.oval{position:absolute;inset:27% 22%;border-radius:50%;background:var(--br);display:grid;place-items:center;color:#fff}
.oval b{direction:ltr;font:700 clamp(2.4rem,11vw,3.2rem)/1 var(--display);letter-spacing:.04em}
.oval small{direction:ltr;display:block;font:700 .5rem var(--body);letter-spacing:.28em;margin-top:.2rem}
.tag{direction:ltr;font:italic 700 1rem var(--display);margin:.6rem 0 0}
.info{color:var(--muted);font-size:.86rem;margin:.25rem 0 0}
.route{max-width:600px;margin:1.1rem auto 0;border:1px solid var(--line);border-radius:14px;padding:.9rem .9rem .8rem;text-align:start;background:var(--tint)}
.route h3{margin:0 0 .6rem;font:700 1rem var(--body)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;counter-reset:s}
.step{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem .45rem;font-size:.76rem;line-height:1.45}
.step svg{display:block;width:34px;height:34px;margin-bottom:.25rem}
.step b{display:block;font-size:.8rem}
.route a{display:block;margin-top:.7rem;text-align:center;background:var(--br);color:#fff;border-radius:10px;padding:.6rem;font-weight:700;text-decoration:none}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem;margin-top:1rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1px solid var(--line);background:var(--tint);color:var(--br);border-radius:999px;padding:.6rem 1.1rem;font:1rem var(--body)}
.search input:focus-visible{outline:2px solid var(--br)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--br);background:#fff;color:var(--br);border-radius:999px;padding:.28rem .9rem;font:700 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--br);color:#fff}
.chip:focus-visible{outline:2px solid var(--br2);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.4rem;border:1.5px solid var(--br);border-radius:4px;padding:1rem 1rem .5rem;position:relative}
section.cat::before{content:"";position:absolute;inset:4px;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.ch{text-align:center;margin-bottom:.4rem}
.ch h2{margin:0;font:700 1.35rem var(--body)}
.ch .en{direction:ltr;display:block;font:700 1.05rem var(--display);letter-spacing:.06em}
.rule{display:flex;align-items:center;gap:.4rem;justify-content:center;margin:.35rem 0 .2rem}
.rule i{display:block;width:54px;height:1px;background:var(--br)}
.rule b{width:6px;height:6px;border-radius:50%;background:var(--br)}
.it{display:grid;grid-template-columns:1fr auto;gap:0 .8rem;padding:.55rem .2rem;border-bottom:1px solid rgba(122,90,76,.14)}
.it:last-child{border-bottom:0}
.it .nm{font-weight:700}
.it .en{direction:ltr;display:block;font:700 .66rem var(--body);letter-spacing:.08em;color:var(--br2);text-transform:uppercase}
.it .pr{font:700 1rem var(--display);white-space:nowrap;align-self:center}
.it .ds{grid-column:1/-1;font-size:.72rem;color:var(--muted)}
.pick{display:inline-block;margin-inline-start:.4rem;font-size:.62rem;font-weight:700;background:var(--br);color:#fff;border-radius:999px;padding:.05rem .45rem;vertical-align:middle}
.visit a{background:#fff;color:var(--br);border:1px solid var(--br)}
.visit a.wa{background:var(--br);color:#fff}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem;border-top:1px solid var(--line)}
footer strong{color:var(--br)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "BRW Specialty Coffee", "nameAr": "BRW", "tagline": {"ar": "Ur Favorite Specialty Coffee Bar", "en": "Ur Favorite Specialty Coffee Bar"}, "info": {"ar": "جوه الحديقة الدولية، مدينة نصر · من ٢ الضهر لـ ١٢ بالليل", "en": "Inside the International Park, Nasr City · 2 PM – 12 AM"}, "logo": null, "colors": {"primary": "#7A5A4C", "onPrimary": "#FFFFFF", "secondary": "#A48676", "background": "#FFFFFF", "accent": "#7A5A4C"}, "fonts": {"display": "Playfair Display", "body": "Almarai"}, "pattern": "none", "currency": {"ar": "ج.م", "en": "EGP"}, "demoBanner": true, "credit": "محمد", "whatsapp": "201013318965", "mapsUrl": "https://maps.google.com/?cid=3727999730587020997", "instagram": "https://www.instagram.com/brwcoffee.eg/", "categories": [{"id": "hot", "ar": "قهوة سخنة", "en": "Hot Coffee", "items": [{"ar": "إسبريسو", "en": "Espresso", "p": 40, "dAr": "سنجل ٤٠ · دبل ٦٠", "dEn": "Single 40 · Double 60"}, {"ar": "قهوة تركي", "en": "Turkish Coffee", "p": 30, "dAr": "سنجل ٣٠ · دبل ٥٥", "dEn": "Single 30 · Double 55"}, {"ar": "قهوة فرنساوي", "en": "French Coffee", "p": 55}, {"ar": "ماكياتو", "en": "Macchiato", "p": 65}, {"ar": "أمريكانو", "en": "Americano", "p": 80}, {"ar": "كورتادو", "en": "Cortado", "p": 95}, {"ar": "فلات وايت", "en": "Flat White", "p": 100, "pick": true}, {"ar": "كابتشينو", "en": "Cappuccino", "p": 110}, {"ar": "لاتيه", "en": "Latte", "p": 120}, {"ar": "كافيه موكا", "en": "Café Mocha", "p": 140}, {"ar": "كافيه وايت موكا", "en": "Café White Mocha", "p": 140}, {"ar": "سبانش لاتيه", "en": "Spanish Latte", "p": 145}, {"ar": "سولتد كراميل لاتيه", "en": "Salted Caramel Latte", "p": 145}]}, {"id": "cold", "ar": "قهوة ساقعة", "en": "Cold Coffee", "items": [{"ar": "أمريكانو ساقع", "en": "Iced Americano", "p": 85}, {"ar": "لاتيه ساقع", "en": "Iced Latte", "p": 120}, {"ar": "موكا ساقع", "en": "Iced Mocha", "p": 120}, {"ar": "وايت موكا ساقع", "en": "Iced White Mocha", "p": 130}, {"ar": "سولتد كراميل ساقع", "en": "Iced Salted Caramel", "p": 130}, {"ar": "سبانش لاتيه ساقع", "en": "Iced Spanish Latte", "p": 140}, {"ar": "كوكونت سبانش لاتيه", "en": "Iced Coconut Spanish Latte", "p": 150}, {"ar": "بستاشيو هيزلنت لاتيه", "en": "Iced Pistachio Hazelnut Latte", "p": 160, "pick": true}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const S='fill="none" stroke="#7A5A4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const D=[
 `<g ${S}><path d="M-9-6h16v10a8 8 0 0 1-16 0z"/><path d="M7-3h3a3 3 0 0 1 0 6H6"/><path d="M-4-10c-2-3 2-4 0-7M1-10c-2-3 2-4 0-7"/></g>`,
 `<g ${S}><path d="M-7-12h14l-2 24H-5z"/><path d="M-8-12h16"/><path d="M2-16l3-6"/></g>`,
 `<g ${S}><path d="M-10 4c0-8 20-8 20 0"/><path d="M-12 4h24"/><path d="M-6-2c2-2 4-2 6 0"/></g>`,
 `<g ${S}><path d="M-8-10h16l-3 20H-5z"/><circle cx="-2" cy="2" r="1.5"/><circle cx="3" cy="-3" r="1.5"/><circle cx="2" cy="5" r="1.5"/></g>`,
 `<g ${S}><path d="M-10 6l10-14 10 14z"/><path d="M-10 6h20"/></g>`,
 `<g ${S}><path d="M-6-10h12v16a6 6 0 0 1-12 0z"/><path d="M-6-4h12"/></g>`,
 `<g ${S}><ellipse cx="0" cy="0" rx="6" ry="9" transform="rotate(30)"/><path d="M-3-6c4 3 2 9 5 12"/></g>`,
 `<g ${S}><path d="M-11 2c4-10 18-10 22 0-4 6-18 6-22 0z"/><path d="M-6 2c3-3 9-3 12 0"/></g>`];
function ring(){let g="";const n=16;for(let k=0;k<n;k++){const a=k/n*Math.PI*2-Math.PI/2,r=41;const x=50+r*Math.cos(a),y=50+r*Math.sin(a);g+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(.38) rotate(${(k*23)%40-20})">${D[k%D.length]}</g>`;}
 for(let k=0;k<16;k++){const a=(k+.5)/16*Math.PI*2,r=33+(k%2)*2;g+=`<circle cx="${(50+r*Math.cos(a)).toFixed(1)}" cy="${(50+r*Math.sin(a)).toFixed(1)}" r=".7" fill="#A48676"/>`;}
 return `<svg viewBox="0 0 100 100" aria-hidden="true">${g}</svg>`;}
const ICO={gate:`<svg viewBox="0 0 34 34" ${S}><path d="M5 30V10l12-6 12 6v20"/><path d="M11 30V16h12v14"/></svg>`,
 walk:`<svg viewBox="0 0 34 34" ${S}><path d="M4 28c6-2 8-10 14-10s8-8 12-12" stroke-dasharray="3 3"/><circle cx="30" cy="6" r="2"/><path d="M8 22c-2-4 0-8 4-8"/></svg>`,
 cup:`<svg viewBox="0 0 34 34" ${S}><path d="M8 12h16v10a8 8 0 0 1-16 0z"/><path d="M24 14h3a3 3 0 0 1 0 6h-3"/><path d="M13 8c-1-2 1-3 0-5M18 8c-1-2 1-3 0-5"/></svg>`};
function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`<div class="ring">${ring()}<div class="oval"><div><b>BRW</b><small>SPECIALTY COFFEE</small></div></div></div>
   <p class="tag">Ur Favorite Specialty Coffee Bar.</p><p class="info">${esc((C.info||{})[lang]||"")}</p>
   <div class="route"><h3>${ar?"الطريق لـ BRW في ٣ خطوات":"The way to BRW in 3 steps"}</h3><div class="steps">
    <div class="step">${ICO.gate}<b>${ar?"١. البوابة":"1. The gate"}</b>${ar?"ادخل الحديقة الدولية، مدينة نصر":"Enter the International Park, Nasr City"}</div>
    <div class="step">${ICO.walk}<b>${ar?"٢. امشي ورا الكوباية":"2. Follow the cup"}</b>${ar?"افتح اللوكيشن تحت وهيوصلك لحد الباب":"Open the pin below, it walks you to the door"}</div>
    <div class="step">${ICO.cup}<b>${ar?"٣. وصلت":"3. You're here"}</b>${ar?"قهوتك مستنياك من ٢ الضهر":"Your coffee's ready from 2 PM"}</div></div>
    <a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${ar?"افتح اللوكيشن على الخريطة":"Open the pin on Maps"}</a></div>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch">${lang==="ar"?`<h2>${esc(c.ar)}</h2>`:""}<span class="en">${esc(c.en.toUpperCase())}</span><div class="rule"><i></i><b></b><i></i></div></div>`;
    for(const i of items){const ds=L(i,"dAr","dEn");
      html+=`<div class="it"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}${lang==="ar"?`<span class="en">${esc(i.en)}</span>`:""}</div><span class="pr">${fmt(i.p)} ${cur()}</span>${ds?`<p class="ds">${esc(ds)}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${lang==="ar"?"مفيش صنف بالاسم ده، جرب كلمة تانية.":T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف والأسعار من هايلايت المنيو عندكم على انستجرام";
T.en.note="Preview: items and prices from your Instagram menu highlight";
T.ar.search="بتدور على ايه؟";
T.ar.pick="ترشيحنا";
T.ar.updated="آخر تحديث للأسعار: النهارده";
