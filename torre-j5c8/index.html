<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--brown:#4a3b33;--brown2:#3a2e28;--cream:#f2ebe1;--paper:#f7f2ea;--ink:#2e241f;--soft:#7f6f64;--line:#e2d7c8;--card:#fffaf3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1c1714;--card:#262019;--ink:#f2ebe1;--soft:#b8a898;--line:#3a312a;--brown:#cbb9a5}}
:root[data-theme="dark"]{--paper:#1c1714;--card:#262019;--ink:#f2ebe1;--soft:#b8a898;--line:#3a312a;--brown:#cbb9a5}
body{background:var(--paper);color:var(--ink);font-family:"Readex Pro","Lexend",system-ui,sans-serif}
html[lang=en] body{font-family:"Lexend","Readex Pro",sans-serif}
.demo-note{background:#2e241f;color:#f2ebe1}
/* header = the Riyadh skyline poster from their launch posts */
header{position:relative;text-align:center;background:#4a3b33;color:#f2ebe1;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 0;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#f2ebe1;color:#4a3b33;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:600 .8rem "Lexend";z-index:2}
#logo{display:inline-block;padding:.9rem 1.3rem .8rem;background:#f2ebe1;border-radius:50%;width:140px;height:140px;box-sizing:border-box;direction:ltr}
.mark{display:block;width:34px;height:40px;margin:.6rem auto .25rem}
.wm{font:800 1.45rem/1 "Lexend";letter-spacing:.12em;margin-inline-start:.12em;color:#4a3b33}
.ar{font:500 .78rem "Readex Pro";color:#7f6f64;margin-top:.15rem}
.tg{margin:1rem 0 0;font:800 1.6rem/1.1 "Lexend";letter-spacing:-.01em;direction:ltr}
html[lang=ar] .tg{font:700 1.4rem/1.4 "Readex Pro";direction:rtl}
.info{font-size:.78rem;color:#cbb9a5;margin:.35rem 0 0}
.sky{display:block;width:calc(100% + 2.4rem);height:96px;margin:1rem -1.2rem 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--line);color:var(--ink);border-radius:14px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:500 .84rem "Lexend","Readex Pro"}
.chip[aria-pressed="true"]{background:#4a3b33;color:#f2ebe1}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid #4a3b33;outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
/* each section is a floor of the tower: floor number in a lift indicator */
section{margin-top:1.8rem;scroll-margin-top:120px;display:grid;grid-template-columns:44px 1fr;gap:0 .9rem}
.lift{grid-row:span 2;display:flex;flex-direction:column;align-items:center}
.lift b{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#4a3b33;color:#f2ebe1;font:800 .95rem "Lexend"}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lift b{background:#f2ebe1;color:#4a3b33}}
.lift i{flex:1;width:2px;margin-top:.4rem;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 10px)}
h2{margin:.35rem 0 .5rem;font:800 1.3rem "Lexend";color:var(--brown);letter-spacing:-.01em}
html[lang=ar] h2{font:700 1.2rem "Readex Pro"}
h2 small{display:block;font:400 .72rem "Lexend";color:var(--soft);letter-spacing:.18em;text-transform:uppercase;direction:ltr;text-align:left}
html[dir=rtl] h2 small{text-align:right}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.2rem .95rem}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:baseline;padding:.6rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm .a{display:block;font-weight:500}
.nm .e{display:block;font:300 .78rem "Lexend";color:var(--soft);direction:ltr;text-align:start}
html[dir=rtl] .nm .e{text-align:right}
.pr{font:600 1rem "Lexend";white-space:nowrap;direction:ltr}
.pr small{font:400 .62rem "Lexend";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.love{margin:2rem 0 0;text-align:center;font:800 1.5rem/1.15 "Lexend";color:var(--brown);direction:ltr}
.love span{display:block;font:400 .8rem "Readex Pro";color:var(--soft);margin-top:.4rem;direction:rtl}
.visit a{border-radius:14px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>

const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "تصور تجريبي — الأصناف والأسعار أمثلة وليست منيو توري", "note": "", "tg": "من الرياض، بكل حبنا", "love": "With All Our Love!", "loveS": "قهوة مختصة · الروابي"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — items and prices are examples, not TORRE's menu", "note": "", "tg": "From Riyadh, With All Our Love!", "love": "Coming To You", "loveS": "Specialty coffee · Al Rawabi"}};
let lang="ar", active="all", query="";
const KEY="torre-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><div class="lift"><b>F${ci+1}</b><i></i></div><h2>${esc(L(c,"ar","en"))}${lang==="ar"?`<small>${esc(c.en)}</small>`:""}</h2><div class="list">${body}</div></section>`; }
function item(i){ return `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}</span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="love">${T[lang].love}<span>${T[lang].loveS}</span></p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
