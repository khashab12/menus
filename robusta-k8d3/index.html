<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--olive:#7c8c55;--olive2:#66754a;--leaf:#a8b685;--paper:#fbfaf5;--card:#ffffff;--ink:#3a4128;--soft:#7a8068;--line:#e3e6d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171a10;--card:#1f2316;--ink:#eef0e2;--soft:#aab097;--line:#2f3522;--olive:#a8b685}}
:root[data-theme="dark"]{--paper:#171a10;--card:#1f2316;--ink:#eef0e2;--soft:#aab097;--line:#2f3522;--olive:#a8b685}
body{background:var(--paper);color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif;font-weight:300}
.demo-note{background:#66754a;color:#fff}
/* interlocking-ring lattice like the band on their menu board */
.lattice{background-color:#7c8c55;background-image:radial-gradient(circle at 0 50%,transparent 13px,rgba(255,255,255,.22) 13.5px 14.5px,transparent 15px),radial-gradient(circle at 100% 50%,transparent 13px,rgba(255,255,255,.22) 13.5px 14.5px,transparent 15px);background-size:28px 34px}
header{position:relative;text-align:center;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 1.6rem}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#fff;color:#66754a;border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font:500 .8rem "Readex Pro";z-index:2}
#logo{display:inline-block;padding:1rem 1.6rem .9rem;background:#fbfaf5;border-radius:4px;color:#7c8c55}
.leaf{display:block;width:30px;height:38px;margin:0 auto .2rem}
.est{display:flex;direction:ltr;justify-content:center;gap:2.2rem;font:400 .55rem "Marcellus";letter-spacing:.12em;color:#7c8c55;margin-top:-1.8rem;margin-bottom:1rem}
.wm{font:500 2.3rem/1.1 "Reem Kufi";color:#7c8c55}
.sub{font:400 .7rem "Marcellus";letter-spacing:.55em;margin-inline-start:.55em;color:#7c8c55;direction:ltr}
.tg{margin:1rem 0 0;font:500 1.6rem/1.1 "Reem Kufi"}
.tg small{display:block;font:400 .78rem "Marcellus";letter-spacing:.4em;margin-top:.15rem;direction:ltr}
.info{font-size:.78rem;opacity:.9;margin:.5rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--olive);background:none;color:var(--ink);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:400 .84rem "Readex Pro"}
.chip[aria-pressed="true"]{background:#7c8c55;border-color:#7c8c55;color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2.1rem;scroll-margin-top:120px}
/* section titles: pill bullet + long rule, as on their board */
h2{display:flex;align-items:center;gap:.5rem;margin:0 0 .5rem;padding-bottom:.4rem;border-bottom:1.5px solid var(--olive);font:500 1.35rem "Reem Kufi";color:var(--olive)}
h2::before{content:"";width:18px;height:11px;border-radius:50%;background:var(--olive);transform:rotate(-20deg)}
h2 small{margin-inline-start:auto;font:400 .72rem "Marcellus";letter-spacing:.24em;color:var(--soft);direction:ltr}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:.55rem;align-items:baseline;padding:.5rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tick{width:12px;height:5px;border-radius:3px;background:var(--olive);transform:rotate(-30deg) translateY(-.15em)}
.nm{font-weight:400}
.nm small{display:block;font:300 .76rem "Readex Pro";color:var(--soft);direction:ltr;text-align:right}
html[dir=ltr] .nm small{text-align:left}
.pr{font:500 .98rem "Readex Pro";white-space:nowrap;direction:ltr}
.pr small{font:300 .62rem "Readex Pro";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.cal{font:300 .68rem "Readex Pro";color:var(--soft);white-space:nowrap;direction:ltr;min-width:3.6rem;text-align:end}
/* breakfast sits on a solid olive card with notched corners, like their breakfast page */
#cat-breakfast .list{background:#7c8c55;color:#fff;padding:.4rem 1rem;border-radius:4px;-webkit-mask:radial-gradient(10px at 0 0,#0000 98%,#000) top left,radial-gradient(10px at 100% 0,#0000 98%,#000) top right,radial-gradient(10px at 0 100%,#0000 98%,#000) bottom left,radial-gradient(10px at 100% 100%,#0000 98%,#000) bottom right;-webkit-mask-size:51% 51%;-webkit-mask-repeat:no-repeat;mask:radial-gradient(10px at 0 0,#0000 98%,#000) top left,radial-gradient(10px at 100% 0,#0000 98%,#000) top right,radial-gradient(10px at 0 100%,#0000 98%,#000) bottom left,radial-gradient(10px at 100% 100%,#0000 98%,#000) bottom right;mask-size:51% 51%;mask-repeat:no-repeat}
#cat-breakfast .row{border-color:rgba(255,255,255,.3)}
#cat-breakfast .tick{background:#fff}
#cat-breakfast .nm small,#cat-breakfast .cal,#cat-breakfast .pr small{color:#e6ead9}
.band{height:38px;margin-top:2rem;border-radius:3px}
.sign{text-align:center;margin-top:1.2rem;color:var(--olive)}
.sign b{display:block;font:500 1.6rem "Reem Kufi"}
.sign span{font:400 .66rem "Marcellus";letter-spacing:.5em;direction:ltr}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>

function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<div class="band lattice"></div><div class="sign"><b>روبيستا بيك</b><span>ROASTERY</span></div>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
