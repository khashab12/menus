<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--blue:#4a86c5;--blue2:#3a6fa8;--neon:#d9ff2e;--pink:#efc3dd;--orange:#f2733a;--paper:#f6f3ee;--card:#ffffff;--ink:#1f2a3a;--soft:#6a7180;--line:#e4e0d8}

body{background:var(--paper);color:var(--ink);font-family:"Baloo Bhaijaan 2","DM Sans",system-ui,sans-serif}
html[lang=en] body{font-family:"DM Sans","Baloo Bhaijaan 2",sans-serif}
.demo-note{background:var(--blue2);color:#fff}
/* blue poster with the giant sideways MENU word and the roller-skating palm */
header{position:relative;background:#4a86c5;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.6rem;overflow:hidden;min-height:330px;direction:ltr}
.big{position:absolute;left:-.12em;bottom:-.18em;font:400 7.6rem/.8 "Bagel Fat One";color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:-.02em;opacity:.95}
.palm{position:absolute;right:-14px;bottom:-4px;width:130px;height:172px}

#logo{position:relative;z-index:2;display:grid;place-items:center;width:104px;height:104px;margin:0 0 0 96px;border-radius:50%;background:#4a86c5;border:3px solid #fff}
.yfc{display:block;width:84px;height:84px}
.tx{position:relative;z-index:2;margin:.9rem 0 0 96px;max-width:calc(100% - 96px - 96px);text-align:left}
.tg{margin:0;font:400 1.2rem/1.15 "Bagel Fat One";color:#d9ff2e}
.tg2{margin:.35rem 0 0;font:500 .82rem/1.45 "DM Sans";color:#fff}
.info{margin:.4rem 0 0;font:500 .78rem "Baloo Bhaijaan 2";color:#e8f0ff;direction:rtl;text-align:left}
html[lang=en] .info{direction:ltr}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--blue)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:2px solid var(--blue);background:var(--card);color:var(--ink);border-radius:999px;padding:.5rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--pink);color:#1f2a3a;border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font:700 .82rem "DM Sans","Baloo Bhaijaan 2"}
.chip[aria-pressed="true"]{background:#d9ff2e;color:#1f2a3a;box-shadow:inset 0 0 0 2px #4a86c5}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2.1rem;scroll-margin-top:120px;position:relative}
h2{margin:0 0 .5rem;font:400 1.75rem/1 "Bagel Fat One";color:var(--blue);text-transform:uppercase;direction:ltr;text-align:left}
h2 small{display:inline-block;margin-left:.5rem;font:600 .9rem "Baloo Bhaijaan 2";color:var(--soft);text-transform:none;vertical-align:middle}
/* a sticker in each section's corner: alternating flower / sun */
section::after{content:"";position:absolute;top:-6px;right:0;width:40px;height:40px;background:var(--pink);
 -webkit-mask:radial-gradient(circle,#000 30%,transparent 31%),conic-gradient(from 0deg,#000 0 12.5%,transparent 0 25%,#000 0 37.5%,transparent 0 50%,#000 0 62.5%,transparent 0 75%,#000 0 87.5%,transparent 0);mask:radial-gradient(circle,#000 30%,transparent 31%),conic-gradient(from 0deg,#000 0 12.5%,transparent 0 25%,#000 0 37.5%,transparent 0 50%,#000 0 62.5%,transparent 0 75%,#000 0 87.5%,transparent 0);border-radius:50%;opacity:.9}
section:nth-of-type(2n)::after{background:#d9ff2e}
.cols{display:flex;justify-content:flex-end;gap:.6rem;padding:0 0 .15rem;direction:ltr}
.cols span{width:3.2rem;text-align:center;font:700 .62rem "DM Sans";letter-spacing:.1em;color:var(--soft)}
.list{background:var(--card);border-radius:18px;padding:.25rem .95rem;border:2px solid var(--line)}
.row{display:flex;align-items:baseline;gap:.6rem;padding:.5rem 0;border-bottom:1.5px dashed var(--line);direction:ltr}
.row:last-child{border-bottom:0}
.nm{flex:1}
.nm .e{display:block;font:500 .95rem "DM Sans"}
.nm .a{display:block;font:500 .82rem "Baloo Bhaijaan 2";color:var(--soft);direction:rtl;text-align:left}
.p{width:3.2rem;text-align:center;font:700 .98rem "DM Sans";color:var(--ink)}
section::after{display:block}
.p.l{color:var(--blue)}
.cur{margin:.5rem 0 0;text-align:right;font:500 .72rem "DM Sans";color:var(--soft)}
.zone{margin:2rem 0 0;text-align:center;font:400 1.25rem/1.2 "Bagel Fat One";color:var(--blue);direction:ltr}
.zone span{display:block;font:500 .8rem "DM Sans";color:var(--soft);margin-top:.3rem}
.visit a{border-radius:999px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

let lang="ar", active="all", query="";
const KEY="yfc-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ const two=c.items.some(i=>i.p2!=null); return `<section id="cat-${esc(c.id)}"><h2>${esc(c.en)}${lang==="ar"?`<small>${esc(c.ar)}</small>`:""}</h2>${two?`<div class="cols"><span>${T[lang].R}</span><span>${T[lang].L}</span></div>`:""}<div class="list">${body}</div></section>`; }
function item(i,k,c){ const two=c.items.some(x=>x.p2!=null); return `<div class="row"><span class="nm"><span class="e">${esc(i.en)}</span>${lang==="ar"?`<span class="a">${esc(i.ar)}</span>`:""}</span>${two?`<span class="p">${fmt(i.p)}</span><span class="p l">${i.p2!=null?fmt(i.p2):"–"}</span>`:`<span class="p">${fmt(i.p)}</span>`}</div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="cur">${T[lang].cur}</p><p class="zone">${T[lang].z}<span>${T[lang].zs}</span></p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
