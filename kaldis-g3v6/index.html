<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو KALDI’S</title>
<meta name="description" content="Specialty Coffee">
<meta property="og:title" content="منيو KALDI’S">
<meta property="og:description" content="Specialty Coffee">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/kaldis-g3v6/">
<meta name="theme-color" content="#C9A45C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--bk:#0E0D0B;--bk2:#17150f;--gold:#C9A45C;--gold2:#E7D3A3;--cream:#F1E7D0;--muted:#a39574;--line:rgba(201,164,92,.28);
 --display:"Cinzel",serif;--body:"Tajawal",system-ui,sans-serif;--ar:"Amiri",serif}
body{background:var(--bk);color:var(--cream);font-family:var(--body)}
.demo-note{background:var(--gold);color:#1a1408;font-weight:600}
header.hero{position:relative;text-align:center;padding:2.4rem 1.2rem 1.4rem;overflow:hidden}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:2px;padding:.2rem .75rem;font:700 .78rem var(--body);cursor:pointer;z-index:2}
.scene{width:min(320px,86vw);height:auto;display:block;margin:0 auto}
.medal{display:inline-grid;place-items:center;width:128px;height:128px;border-radius:50%;border:2px solid var(--gold);box-shadow:inset 0 0 0 6px var(--bk),inset 0 0 0 7px var(--gold);margin-top:-1.4rem;background:var(--bk)}
.medal span{direction:ltr;font:700 1.35rem var(--display);color:var(--gold);letter-spacing:.06em}
.medal small{display:block;direction:ltr;font:600 .5rem var(--display);letter-spacing:.3em;color:var(--gold2);margin-top:-.2rem}
.legend{max-width:440px;margin:1rem auto 0;font:400 1.05rem/1.8 var(--ar);color:var(--gold2)}
.legend em{font-style:normal;color:var(--gold)}
.info{color:var(--muted);font-size:.85rem;margin:.7rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:rgba(14,13,11,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:0;border-bottom:1px solid var(--gold);background:transparent;color:var(--cream);padding:.45rem .2rem;font:1rem var(--body)}
.search input::placeholder{color:#7d7258}
.search input:focus-visible{outline:none;border-bottom-width:2px}
.chips{display:flex;gap:.3rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--gold2);padding:.25rem .7rem;font:500 .88rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible{outline:1px solid var(--gold2)}
main{max-width:640px;margin:0 auto;padding:.4rem 1.1rem 2rem}
section.cat{margin-top:2.2rem}
.chap{text-align:center;margin-bottom:1rem}
.chap .num{direction:ltr;display:block;font:700 .72rem var(--display);letter-spacing:.4em;color:var(--gold)}
.chap h2{margin:.2rem 0 0;font:700 1.7rem var(--ar);color:var(--cream)}
.chap .ln{font:italic 400 .95rem var(--ar);color:var(--muted);margin:.1rem 0 0}
.chap .orn{display:block;width:120px;height:14px;margin:.5rem auto 0}
.it{display:flex;align-items:baseline;gap:.6rem;padding:.55rem 0}
.it .nm{font-weight:700;font-size:1.02rem}
.it .en{direction:ltr;display:block;font:600 .64rem var(--display);letter-spacing:.14em;color:var(--muted)}
.it .dots{flex:1;border-bottom:1px dotted rgba(201,164,92,.45);transform:translateY(-4px);min-width:20px}
.it .pr{font:700 1rem var(--body);color:var(--gold);white-space:nowrap}
.pick{display:inline-block;margin-inline-start:.4rem;width:10px;height:10px;border-radius:50%;background:#b8322a;box-shadow:0 0 0 2px rgba(184,50,42,.25);vertical-align:middle}
.visit a{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:2px}
.visit a.wa{background:var(--gold);color:#1a1408}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem;border-top:1px solid var(--line)}
footer strong{color:var(--gold2)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "KALDI’S Specialty Coffee", "nameAr": "KALDI’S", "tagline": {"ar": "Specialty Coffee", "en": "Specialty Coffee"}, "info": {"ar": "د. حسب الشريف، المنطقة الثامنة، مدينة نصر", "en": "Dr Hassab Elsherif, 8th District, Nasr City"}, "logo": null, "colors": {"primary": "#C9A45C", "onPrimary": "#0E0D0B", "secondary": "#E7D3A3", "background": "#0E0D0B", "accent": "#C9A45C"}, "fonts": {"display": "Cinzel", "body": "Tajawal"}, "pattern": "none", "currency": {"ar": "ج.م", "en": "EGP"}, "demoBanner": true, "credit": "محمد", "whatsapp": "201508400860", "mapsUrl": "https://maps.google.com/?cid=9692286774469144761", "reviewUrl": "https://maps.google.com/?cid=9692286774469144761", "categories": [{"id": "hot", "ar": "قهوة سخنة", "en": "Hot Coffee", "ch": "I", "lineAr": "الحكاية بدأت بحبة قهوة", "lineEn": "It began with one cherry", "items": [{"ar": "كابتشينو", "en": "Cappuccino", "p": 110}, {"ar": "كراميل ماكياتو", "en": "Caramel Macchiato", "p": 110}, {"ar": "دارك موكا", "en": "Dark Mocha", "p": 110}, {"ar": "فلات وايت", "en": "Flat White", "p": 115, "pick": true}, {"ar": "وايت موكا", "en": "White Mocha", "p": 120}]}, {"id": "iced", "ar": "قهوة ساقعة", "en": "Iced Coffee", "ch": "II", "lineAr": "وبعدين جات التلج", "lineEn": "Then came the ice", "items": [{"ar": "أمريكانو ساقع", "en": "Iced Americano", "p": 110}, {"ar": "كراميل ماكياتو ساقع", "en": "Iced Caramel Macchiato", "p": 110}, {"ar": "لاتيه ساقع", "en": "Iced Latte", "p": 120}, {"ar": "دارك موكا ساقع", "en": "Iced Dark Mocha", "p": 130}, {"ar": "وايت موكا ساقع", "en": "Iced White Mocha", "p": 130}, {"ar": "سبانش لاتيه ساقع", "en": "Iced Spanish Latte", "p": 145, "pick": true}]}, {"id": "frappe", "ar": "فرابيه", "en": "Frappé", "ch": "III", "lineAr": "مضروب مع التلج والحليب", "lineEn": "Blended with ice and milk", "items": [{"ar": "كلاسيك فرابيه", "en": "Classic Frappé", "p": 110}, {"ar": "فانيليا فرابيه", "en": "Vanilla Frappé", "p": 125}, {"ar": "موكا فرابيه", "en": "Mocha Frappé", "p": 125}, {"ar": "كراميل فرابيه", "en": "Caramel Frappé", "p": 130}, {"ar": "وايت موكا فرابيه", "en": "White Mocha Frappé", "p": 130}]}, {"id": "matcha", "ar": "ماتشا", "en": "Matcha", "ch": "IV", "lineAr": "ورقة خضرا من بعيد", "lineEn": "A green leaf from afar", "items": [{"ar": "ماتشا لاتيه سخن", "en": "Hot Matcha Latte", "p": 120}, {"ar": "ماتشا لاتيه ساقع", "en": "Iced Matcha Latte", "p": 120}, {"ar": "ماتشا بلوبيري", "en": "Blueberry Matcha Latte", "p": 135}, {"ar": "ماتشا فراولة", "en": "Strawberry Matcha Latte", "p": 135}, {"ar": "ماتشا فانيليا فرابيه", "en": "Matcha Vanilla Frappé", "p": 135}, {"ar": "ماتشا بستاشيو", "en": "Pistachio Matcha Latte", "p": 160, "pick": true}]}, {"id": "shakes", "ar": "ميلك شيك", "en": "Milkshakes", "ch": "V", "lineAr": "للي مش بيشرب قهوة", "lineEn": "For the non-coffee crowd", "items": [{"ar": "فراولة", "en": "Strawberry", "p": 95}, {"ar": "مانجا", "en": "Mango", "p": 95}, {"ar": "أوريو", "en": "Oreo", "p": 100}, {"ar": "كراميل", "en": "Caramel", "p": 105}, {"ar": "لوتس", "en": "Biscoff", "p": 105}, {"ar": "بستاشيو", "en": "Pistachio", "p": 155}]}, {"id": "combo", "ar": "كومبو", "en": "Make It a Meal", "ch": "VI", "lineAr": "اتنين مع بعض", "lineEn": "Better in pairs", "items": [{"ar": "أوريو شيك + هوت شوكليت", "en": "Oreo Shake + Hot Chocolate", "p": 165}, {"ar": "اتنين كراميل ميلك شيك", "en": "Two Caramel Milkshakes", "p": 210}, {"ar": "بستاشيو شيك + V60 ساقع", "en": "Pistachio Shake + Iced V60", "p": 250}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const SCENE=`<svg class="scene" viewBox="0 0 320 170" aria-hidden="true" fill="none" stroke="#C9A45C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<path d="M0 150c60-14 110-10 160-2s110 10 160-4" opacity=".6"/>
<path d="M232 150V96M232 110c-14-6-22-18-22-30M232 104c12-8 20-20 18-34M232 96c-2-14 4-26 12-32"/>
<path d="M210 80c-10-2-16 4-14 12 8 2 14-2 14-12zM250 70c10-4 18 2 16 10-8 2-14-2-16-10zM244 64c0-10 8-14 14-10-2 8-8 12-14 10z"/>
<g fill="#b8322a" stroke="none"><circle cx="214" cy="92" r="3.4"/><circle cx="220" cy="96" r="3.4"/><circle cx="252" cy="84" r="3.4"/><circle cx="246" cy="78" r="3.4"/><circle cx="238" cy="118" r="3.2"/></g>
<path d="M96 140l-4-30c-2-10 4-20 14-22l40-4c10-1 18 6 20 16l2 12M112 140l2-18M150 140l2-20M166 140l-2-22"/>
<path d="M168 102c6-6 14-8 22-8l10-12c2-4 0-8-4-8M190 94c4 0 8 2 8 6-2 4-8 4-12 2"/>
<path d="M200 80l6-10M194 80l2-12M186 76c-6-4-8-12-4-18"/>
<path d="M108 88c-6-4-14-2-18 4" /><path d="M60 142c0-10 8-18 18-18s18 8 18 18" opacity=".5"/>
<path d="M40 60c8-18 30-26 48-18" opacity=".35"/><circle cx="62" cy="40" r="10" opacity=".45"/>
</svg>`;
const ORN=`<svg class="orn" viewBox="0 0 120 14" aria-hidden="true"><path d="M2 7h44M74 7h44" stroke="#C9A45C" stroke-width="1"/><ellipse cx="60" cy="7" rx="7" ry="5" fill="none" stroke="#C9A45C" stroke-width="1.2"/><path d="M56 4c3 2 5 4 8 6" stroke="#C9A45C" stroke-width="1.2" fill="none"/></svg>`;
function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`${SCENE}<div class="medal"><div><span>KALDI’S</span><small>SPECIALTY COFFEE</small></div></div>
   <p class="legend">${ar?"بيقولوا إن راعي اسمه <em>كالدي</em> لاحظ معيزه بترقص بعد ما أكلت حبّات حمرا من شجرة… ومن هنا بدأت حكاية القهوة. الحكاية كاملة هنا، بالعربي والإنجليزي.":"Legend says a goat herder named <em>Kaldi</em> saw his goats dancing after eating red cherries from a bush… and coffee was born. The whole story is here, in Arabic and English."}</p>
   <p class="info">${esc((C.info||{})[lang]||"")}</p>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="chap"><span class="num">CHAPTER ${c.ch}</span><h2>${esc(L(c,"ar","en"))}</h2><p class="ln">${esc(L(c,"lineAr","lineEn"))}</p>${ORN}</div>`;
    for(const i of items){
      html+=`<div class="it"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="pick" title="${T[lang].pick}"></span>`:""}${lang==="ar"?`<span class="en">${esc(i.en.toUpperCase())}</span>`:""}</div><span class="dots"></span><span class="pr">${fmt(i.p)} ${cur()}</span></div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${lang==="ar"?"مفيش صنف بالاسم ده، جرب كلمة تانية.":T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف والأسعار من منيوكم على جوجل (منيو الأونلاين)، ونظبطها على أسعار الكافيه";
T.en.note="Preview: items and prices from your online menu on Google, to be matched to in-café prices";
T.ar.search="بتدور على ايه؟";
T.ar.pick="حبة كالدي: ترشيحنا";T.en.pick="Kaldi's cherry: our pick";
T.ar.updated="آخر تحديث للأسعار: النهارده";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"kaldis-g3v6"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
