<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو KALDI’S</title>
<meta name="description" content="Specialty Coffee">
<meta property="og:title" content="منيو KALDI’S">
<meta property="og:description" content="Specialty Coffee">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/kaldis-g3v6/">
<meta name="theme-color" content="#161412">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--wall:#FAF7F1;--white:#fff;--ink:#161412;--arch:#F1DE93;--arch2:#F7EBBE;--cane:#B98B5A;--cane2:#D9B98E;--leaf:#5E7A4A;--muted:#7b7166;--line:#e7dfd2;
 --display:"Cinzel",serif;--body:"Tajawal",system-ui,sans-serif;--ar:"Amiri",serif}
body{background:var(--wall);color:var(--ink);font-family:var(--body)}
.demo-note{background:var(--ink);color:#fff;font-weight:500}
header.hero{position:relative;text-align:center;padding:1.6rem 1.2rem 1.2rem;overflow:hidden}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:.2rem .8rem;font:700 .78rem var(--body);cursor:pointer;z-index:2}
.archwrap{position:relative;width:min(250px,64vw);margin:.6rem auto 0}
.arch{position:relative;aspect-ratio:3/4.1;border-radius:999px 999px 0 0;background:radial-gradient(120% 80% at 50% 18%,#FFF6CF 0,var(--arch) 55%,#E7CC72 100%);box-shadow:0 0 60px -10px rgba(241,222,147,.9);display:grid;place-items:center}
.arch svg{width:62%;height:auto}
.plant{position:absolute;bottom:0;width:70px;height:120px}
.plant.l{left:-56px}.plant.r{right:-56px;transform:scaleX(-1)}
.word{direction:ltr;font:700 clamp(2.4rem,11vw,3.1rem)/1 var(--display);letter-spacing:.08em;margin:1rem 0 0}
.sub{direction:ltr;font:600 .62rem var(--display);letter-spacing:.42em;margin:.35rem 0 0;padding-inline-start:.42em;color:var(--muted)}
.legend{max-width:440px;margin:1rem auto 0;font:400 1.05rem/1.85 var(--ar)}
.legend em{font-style:normal;border-bottom:2px solid var(--arch)}
.info{color:var(--muted);font-size:.85rem;margin:.6rem 0 0}
.cane{height:18px;background:
 radial-gradient(circle at 9px 9px,transparent 4px,var(--cane2) 4.5px,var(--cane2) 5.5px,transparent 6px) 0 0/18px 18px,
 linear-gradient(45deg,transparent 46%,var(--cane) 47% 53%,transparent 54%) 0 0/18px 18px,
 linear-gradient(-45deg,transparent 46%,var(--cane) 47% 53%,transparent 54%) 0 0/18px 18px,#EBD6B5;opacity:.85}
.bar{position:sticky;top:0;z-index:5;background:rgba(250,247,241,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:.6rem 1.1rem;font:1rem var(--body)}
.search input:focus-visible{outline:2px solid var(--cane)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:.28rem .9rem;font:600 .86rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--arch);border-color:#E3C866}
.chip:focus-visible{outline:2px solid var(--cane);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 2rem}
section.cat{margin-top:1.6rem;background:#fff;border:1px solid var(--line);border-radius:22px;padding:1.1rem 1rem .6rem}
.chap{text-align:center;margin-bottom:.6rem}
.chap .num{direction:ltr;display:block;font:700 .66rem var(--display);letter-spacing:.38em;color:var(--cane)}
.chap h2{margin:.15rem 0 0;font:700 1.6rem var(--ar)}
.chap .ln{font:italic 400 .95rem var(--ar);color:var(--muted);margin:0}
.it{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--line)}
.it .nm{font-weight:700;font-size:1.02rem}
.it .en{direction:ltr;display:block;font:600 .62rem var(--display);letter-spacing:.14em;color:var(--muted)}
.it .grow{flex:1}
.it .pr{font:700 .95rem var(--body);white-space:nowrap;background:var(--wall);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem}
.pick{display:inline-block;margin-inline-start:.4rem;font-size:.62rem;font-weight:700;background:var(--arch);border-radius:999px;padding:.05rem .5rem;vertical-align:middle}
.visit a{background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:999px}
.visit a.wa{background:var(--ink);color:#fff}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem;border-top:1px solid var(--line)}
footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<div class="cane" aria-hidden="true"></div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "KALDI’S Specialty Coffee", "nameAr": "KALDI’S", "tagline": {"ar": "Specialty Coffee", "en": "Specialty Coffee"}, "info": {"ar": "د. حسب الشريف، المنطقة الثامنة، مدينة نصر", "en": "Dr Hassab Elsherif, 8th District, Nasr City"}, "logo": null, "colors": {"primary": "#161412", "onPrimary": "#FFFFFF", "secondary": "#B98B5A", "background": "#FAF7F1", "accent": "#F1DE93"}, "fonts": {"display": "Cinzel", "body": "Tajawal"}, "pattern": "none", "currency": {"ar": "ج.م", "en": "EGP"}, "demoBanner": true, "credit": "محمد", "whatsapp": "201508400860", "mapsUrl": "https://maps.google.com/?cid=9692286774469144761", "reviewUrl": "https://maps.google.com/?cid=9692286774469144761", "categories": [{"id": "hot", "ar": "قهوة سخنة", "en": "Hot Coffee", "ch": "I", "lineAr": "الحكاية بدأت بحبة قهوة", "lineEn": "It began with one cherry", "items": [{"ar": "كابتشينو", "en": "Cappuccino", "p": 110}, {"ar": "كراميل ماكياتو", "en": "Caramel Macchiato", "p": 110}, {"ar": "دارك موكا", "en": "Dark Mocha", "p": 110}, {"ar": "فلات وايت", "en": "Flat White", "p": 115, "pick": true}, {"ar": "وايت موكا", "en": "White Mocha", "p": 120}]}, {"id": "iced", "ar": "قهوة ساقعة", "en": "Iced Coffee", "ch": "II", "lineAr": "وبعدين جات التلج", "lineEn": "Then came the ice", "items": [{"ar": "أمريكانو ساقع", "en": "Iced Americano", "p": 110}, {"ar": "كراميل ماكياتو ساقع", "en": "Iced Caramel Macchiato", "p": 110}, {"ar": "لاتيه ساقع", "en": "Iced Latte", "p": 120}, {"ar": "دارك موكا ساقع", "en": "Iced Dark Mocha", "p": 130}, {"ar": "وايت موكا ساقع", "en": "Iced White Mocha", "p": 130}, {"ar": "سبانش لاتيه ساقع", "en": "Iced Spanish Latte", "p": 145, "pick": true}]}, {"id": "frappe", "ar": "فرابيه", "en": "Frappé", "ch": "III", "lineAr": "مضروب مع التلج والحليب", "lineEn": "Blended with ice and milk", "items": [{"ar": "كلاسيك فرابيه", "en": "Classic Frappé", "p": 110}, {"ar": "فانيليا فرابيه", "en": "Vanilla Frappé", "p": 125}, {"ar": "موكا فرابيه", "en": "Mocha Frappé", "p": 125}, {"ar": "كراميل فرابيه", "en": "Caramel Frappé", "p": 130}, {"ar": "وايت موكا فرابيه", "en": "White Mocha Frappé", "p": 130}]}, {"id": "matcha", "ar": "ماتشا", "en": "Matcha", "ch": "IV", "lineAr": "ورقة خضرا من بعيد", "lineEn": "A green leaf from afar", "items": [{"ar": "ماتشا لاتيه سخن", "en": "Hot Matcha Latte", "p": 120}, {"ar": "ماتشا لاتيه ساقع", "en": "Iced Matcha Latte", "p": 120}, {"ar": "ماتشا بلوبيري", "en": "Blueberry Matcha Latte", "p": 135}, {"ar": "ماتشا فراولة", "en": "Strawberry Matcha Latte", "p": 135}, {"ar": "ماتشا فانيليا فرابيه", "en": "Matcha Vanilla Frappé", "p": 135}, {"ar": "ماتشا بستاشيو", "en": "Pistachio Matcha Latte", "p": 160, "pick": true}]}, {"id": "shakes", "ar": "ميلك شيك", "en": "Milkshakes", "ch": "V", "lineAr": "للي مش بيشرب قهوة", "lineEn": "For the non-coffee crowd", "items": [{"ar": "فراولة", "en": "Strawberry", "p": 95}, {"ar": "مانجا", "en": "Mango", "p": 95}, {"ar": "أوريو", "en": "Oreo", "p": 100}, {"ar": "كراميل", "en": "Caramel", "p": 105}, {"ar": "لوتس", "en": "Biscoff", "p": 105}, {"ar": "بستاشيو", "en": "Pistachio", "p": 155}]}, {"id": "combo", "ar": "كومبو", "en": "Make It a Meal", "ch": "VI", "lineAr": "اتنين مع بعض", "lineEn": "Better in pairs", "items": [{"ar": "أوريو شيك + هوت شوكليت", "en": "Oreo Shake + Hot Chocolate", "p": 165}, {"ar": "اتنين كراميل ميلك شيك", "en": "Two Caramel Milkshakes", "p": 210}, {"ar": "بستاشيو شيك + V60 ساقع", "en": "Pistachio Shake + Iced V60", "p": 250}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


const IBEX=`<svg viewBox="0 0 120 120" fill="none" stroke="#161412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M56 46c-8-14-6-32 10-38 14-5 26 6 24 20-1 8-7 12-12 10"/><path d="M62 44c-4-10-2-22 8-26 9-3 16 4 14 12"/>
<path d="M58 46c-10 2-18 10-20 20l-6 10c-2 4 2 7 6 5l10-4"/><circle cx="52" cy="60" r="1.8" fill="#161412"/>
<path d="M48 77c2 6 0 12-4 16"/><path d="M64 48c8 6 12 16 12 28 0 10 6 18 16 22"/><path d="M76 76c-10 4-18 10-20 20"/>
<path d="M56 96v14M70 94v16M86 98l2 12M96 96l4 14"/><path d="M92 98c6-2 10-8 10-14"/></svg>`;
const PLANT=`<svg class="plant PL" viewBox="0 0 70 120" aria-hidden="true"><path d="M35 120V50" stroke="#5E7A4A" stroke-width="2"/><g fill="#6E8B57"><ellipse cx="22" cy="60" rx="16" ry="7" transform="rotate(-35 22 60)"/><ellipse cx="48" cy="48" rx="16" ry="7" transform="rotate(30 48 48)"/><ellipse cx="24" cy="36" rx="14" ry="6" transform="rotate(-50 24 36)"/><ellipse cx="44" cy="26" rx="13" ry="6" transform="rotate(55 44 26)"/><ellipse cx="34" cy="16" rx="6" ry="12"/></g><path d="M20 100h30l-4 20H24z" fill="#D9B98E"/></svg>`;
function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`<div class="archwrap">${PLANT.replace("PL","l")}<div class="arch">${IBEX}</div>${PLANT.replace("PL","r")}</div>
   <h1 class="word">KALDI’S</h1><p class="sub">SPECIALTY COFFEE</p>
   <p class="legend">${ar?"بيقولوا إن راعي اسمه <em>كالدي</em> لاحظ معيزه بتتنطط بعد ما أكلت حبّات حمرا من شجرة… ومن هنا بدأت حكاية القهوة. المنيو كله هنا، عربي وإنجليزي.":"Legend says a goat herder named <em>Kaldi</em> saw his goats leaping after eating red cherries from a bush… and coffee was born. The whole menu is here, in Arabic and English."}</p>
   <p class="info">${esc((C.info||{})[lang]||"")}</p>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=(c===C.categories[0]?"":"")+`<section class="cat" id="cat-${esc(c.id)}"><div class="chap"><span class="num">CHAPTER ${c.ch}</span><h2>${esc(L(c,"ar","en"))}</h2><p class="ln">${esc(L(c,"lineAr","lineEn"))}</p></div>`;
    for(const i of items){
      html+=`<div class="it"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}${lang==="ar"?`<span class="en">${esc(i.en.toUpperCase())}</span>`:""}</div><span class="grow"></span><span class="pr">${fmt(i.p)} ${cur()}</span></div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${lang==="ar"?"مفيش صنف بالاسم ده، جرب كلمة تانية.":T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف والأسعار من منيوكم على جوجل (منيو الأونلاين)، ونظبطها على أسعار الكافيه";
T.en.note="Preview: items and prices from your online menu on Google, to be matched to in-café prices";
T.ar.search="بتدور على ايه؟";
T.ar.pick="ترشيحنا";T.en.pick="Our pick";
T.ar.updated="آخر تحديث للأسعار: النهارده";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"kaldis-g3v6"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
