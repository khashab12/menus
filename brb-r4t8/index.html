<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو BRB</title>
<meta name="description" content="Be Right Back · قهوة مختصة">
<meta property="og:title" content="منيو BRB">
<meta property="og:description" content="Be Right Back · قهوة مختصة">
<meta property="og:type" content="website">
<meta property="og:image" content="https://khashab12.github.io/menus/brb-r4t8/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://khashab12.github.io/menus/brb-r4t8/og.png">
<meta property="og:url" content="https://khashab12.github.io/menus/brb-r4t8/">
<meta name="theme-color" content="#1F3A2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--forest:#1F3A2E;--teal:#2F6F73;--teal2:#3E8A8C;--cream:#F2EEE3;--paper:#FBF8F1;--gold:#E2B867;--wood:#8B5A35;--ink:#18201C;--muted:#5f6b64;--line:rgba(31,58,46,.14);
 --display:"Outfit",system-ui,sans-serif;--body:"Tajawal",system-ui,sans-serif}
body{background:var(--cream);color:var(--ink);font-family:var(--body)}
.demo-note{background:var(--forest);color:var(--cream)}
header.hero{position:relative;overflow:hidden;background:#141a17;color:var(--cream);padding:1.2rem 1rem 1.3rem}
.tiles{position:absolute;inset:auto 0 0 0;height:46%;background-color:var(--teal);background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:34px 34px;opacity:.95}
.tiles::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#141a17 0%,transparent 40%)}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;z-index:3;background:transparent;color:var(--cream);border:1px solid rgba(242,238,227,.6);border-radius:999px;padding:.2rem .8rem;font:600 .78rem var(--body);cursor:pointer}
.hero-c{position:relative;z-index:1;text-align:center;padding-top:1.6rem}
.sign{display:inline-flex;align-items:center;gap:.8rem;padding:.6rem 1.1rem;border-radius:6px;background:linear-gradient(180deg,#2b2016,#1b140e);box-shadow:0 0 40px rgba(226,184,103,.25)}
.sign b{direction:ltr;font:800 2.6rem/1 var(--display);color:var(--gold);text-shadow:0 0 14px rgba(226,184,103,.7);letter-spacing:.04em}
.sign span{font:700 1.05rem var(--body);color:var(--gold);text-shadow:0 0 10px rgba(226,184,103,.6)}
.badge{width:34px;height:34px;border-radius:50%;background:#2d6fb0;border:2px solid #9cc4ea;display:grid;place-items:center;color:#fff;font:700 .5rem var(--display)}
.status{display:inline-flex;align-items:center;gap:.5rem;margin:1.1rem auto 0;background:rgba(242,238,227,.95);color:var(--forest);border-radius:18px 18px 18px 4px;padding:.55rem .9rem;font:600 .9rem var(--body);box-shadow:0 8px 20px -10px #000}
[dir=ltr] .status{border-radius:18px 18px 4px 18px}
.status i{width:9px;height:9px;border-radius:50%;background:#3cc37a;box-shadow:0 0 0 3px rgba(60,195,122,.25)}
.info{position:relative;z-index:1;font-size:.84rem;color:#dfe9e4;margin:.7rem 0 0;text-align:center}
.bar{position:sticky;top:0;z-index:5;background:rgba(242,238,227,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.65rem 0 .5rem}
.search{max-width:640px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1.5px solid var(--forest);background:var(--paper);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:1rem var(--body)}
.search input:focus-visible{outline:2px solid var(--teal)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 1rem .1rem;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--forest);background:transparent;color:var(--forest);border-radius:999px;padding:.25rem .85rem;font:700 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--forest);color:var(--cream)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:.4rem 1rem 1.5rem}
section.cat{margin-top:1.4rem}
.day{text-align:center;margin:.4rem 0 .9rem}
.day span{display:inline-block;background:#dfe8e3;color:var(--forest);border-radius:999px;padding:.15rem .8rem;font:700 .78rem var(--body)}
.day span em{direction:ltr;display:inline-block;font:600 .72rem var(--display);font-style:normal;opacity:.7;margin-inline-start:.5rem}
.msg{display:flex;flex-direction:column;align-items:flex-start;margin:.35rem 0}
.bub{max-width:86%;min-width:62%;background:var(--paper);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:.55rem .85rem .45rem;box-shadow:0 4px 12px -10px rgba(0,0,0,.5)}
[dir=ltr] .bub{border-radius:18px 18px 4px 18px}
.bub .nm{font:700 1rem var(--body)}
.bub .en{direction:ltr;display:block;font:500 .74rem var(--display);color:var(--muted)}
.bub .ds{font-size:.78rem;color:var(--muted);margin:.15rem 0 0}
.bub .meta{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:.25rem}
.bub .pr{font:800 1rem var(--display);color:var(--teal)}
.bub .tk{direction:ltr;font:600 .66rem var(--display);color:#3cc37a}
.msg.pk .bub{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.msg.pk .bub .en,.msg.pk .bub .ds{color:#c9d6cf}.msg.pk .bub .pr{color:var(--gold)}
.typing{display:inline-flex;gap:4px;padding:.55rem .8rem;background:var(--paper);border:1px solid var(--line);border-radius:18px;margin-top:.4rem}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--teal);opacity:.5;animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{50%{opacity:1;transform:translateY(-2px)}}
.visit a{background:var(--paper);color:var(--forest);border:1.5px solid var(--forest);border-radius:999px}
.visit a.wa{background:var(--teal);border-color:var(--teal);color:#fff}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.2rem 1rem 2.5rem}
footer strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <div class="tiles" aria-hidden="true"></div>
  <button class="lang" id="langBtn">English</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "BRB", "nameAr": "BRB", "tagline": {"ar": "Be Right Back · قهوة مختصة", "en": "Be Right Back · Specialty Coffee"}, "info": {"ar": "حي الخليج، الرياض · مفتوح ٢٤ ساعة", "en": "Al Khaleej, Riyadh · Open 24 hours"}, "logo": null, "colors": {"primary": "#1F3A2E", "onPrimary": "#F2EEE3", "secondary": "#2F6F73", "background": "#F2EEE3", "accent": "#E2B867"}, "fonts": {"display": "Outfit", "body": "Tajawal"}, "pattern": "none", "currency": {"ar": "ر.س", "en": "SAR"}, "demoBanner": true, "credit": "محمد", "whatsapp": "966507918193", "mapsUrl": "https://maps.google.com/?cid=5795097744032567714", "reviewUrl": "https://maps.google.com/?cid=5795097744032567714", "instagram": "https://www.instagram.com/brbcoffee.sa/", "categories": [{"id": "drinks", "ar": "المشروبات", "en": "Drinks", "items": [{"ar": "قهوة اليوم", "en": "Coffee of the Day", "p": 7, "dAr": "حار أو بارد", "dEn": "Hot or iced", "pick": true}, {"ar": "اسبريسو", "en": "Espresso", "p": 11}, {"ar": "اسبريسو فريدو", "en": "Espresso Freddo", "p": 14}, {"ar": "V60", "en": "V60", "p": 13, "dAr": "كولومبي أو اثيوبي", "dEn": "Colombian or Ethiopian"}, {"ar": "V60 فاخر", "en": "V60 Premium", "p": 17}, {"ar": "كركديه BRB", "en": "BRB Hibiscus", "p": 12}, {"ar": "سقنتشر ريدبول", "en": "Signature Redbull", "p": 17}, {"ar": "ماتشا", "en": "Matcha", "p": 18, "dAr": "كلاسيك، توت، فانيلا", "dEn": "Classic, strawberry, vanilla"}]}, {"id": "sweets", "ar": "الحلويات", "en": "Desserts", "items": [{"ar": "اصابع الوافل", "en": "Waffle Sticks", "p": 13, "pick": true, "dAr": "يمدحونه بالريفيوهات", "dEn": "Praised in your reviews"}, {"ar": "كوكيز شوكلت", "en": "Chocolate Cookie", "p": 7}, {"ar": "بودينغ", "en": "Pudding", "p": 13}, {"ar": "ايس كوكيز", "en": "IceCookie", "p": 13}, {"ar": "ترافل مانجو", "en": "Mango Trifle", "p": 13}, {"ar": "فرينش توست", "en": "French Toast", "p": 14}, {"ar": "بسبوسة BRB", "en": "BRB Basbousa", "p": 14}, {"ar": "ترامسيو", "en": "Tiramisu", "p": 14}]}, {"id": "box", "ar": "بوكسات القهوة", "en": "Coffee Box", "items": [{"ar": "بوكس قهوة اليوم حار", "en": "Coffee Day Box (Hot)", "p": 37, "dAr": "لتر ونص", "dEn": "1.5 Liter"}, {"ar": "بوكس قهوة اليوم بارد", "en": "Coffee Day Box (Iced)", "p": 39, "dAr": "لتر ونص", "dEn": "1.5 Liter"}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


function renderHero(){
  const ar=lang==="ar";
  $("heroInner").innerHTML=`<div class="hero-c"><div class="sign"><b>BRB</b><span>قهوة مختصة</span><i class="badge">BRB</i></div>
   <div><span class="status"><i></i>${ar?"BRB… رايحين نسوي قهوتك ☕":"BRB… brewing your coffee ☕"}</span></div></div>
   <p class="info">${esc((C.info||{})[lang]||"")}</p>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0; const ar=lang==="ar";
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="day"><span>${esc(L(c,"ar","en"))}${ar?`<em>${esc(c.en)}</em>`:""}</span></div>`;
    for(const i of items){const ds=L(i,"dAr","dEn");
      html+=`<div class="msg${i.pick?" pk":""}"><div class="bub"><span class="nm">${esc(L(i,"ar","en"))}</span>${ar?`<span class="en">${esc(i.en)}</span>`:""}${ds?`<p class="ds">${esc(ds)}</p>`:""}<div class="meta"><span class="pr">${fmt(i.p)} ${cur()}</span>${i.pick?`<span class="tk">${T[lang].pick} ✓✓</span>`:""}</div></div></div>`;}
    html+="</section>";
  }
  if(n&&!q) html+=`<div class="typing" aria-hidden="true"><i></i><i></i><i></i></div>`;
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
T.ar.note="نسخة للعرض: الأصناف والأسعار من منيوكم المطبوع، ونعدل أي شي تبونه";
T.en.note="Preview: items and prices from your printed menu, anything can be changed";
T.ar.search="وش تبي تطلب؟";
T.ar.pick="ترشيحنا";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"brb-r4t8"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
