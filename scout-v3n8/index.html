<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو سكاوت</title>
<meta name="description" content="كل كوب يحمل رحلة">
<meta property="og:title" content="منيو سكاوت">
<meta property="og:description" content="كل كوب يحمل رحلة">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/scout-v3n8/">
<meta property="og:image" content="https://khashab12.github.io/menus/scout-v3n8/logo.png">
<meta name="theme-color" content="#2f2723">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Oswald:wght@200;300;400&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}
.visit{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:560px;margin:1rem auto 0;padding:0 1.2rem}
.visit[hidden]{display:none}
.visit a{flex:1 1 auto;text-align:center;text-decoration:none;font-size:.85rem;padding:.55rem .9rem;min-height:40px;border-radius:999px;border:1px solid currentColor;color:inherit}
.visit a.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}

:root{--bg:#2f2723;--bg2:#3a312c;--cream:#efe6d2;--soft:#b9ab95;--line:rgba(239,230,210,.18);--trail:rgba(239,230,210,.35)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3ecdf;--bg2:#ebe2d1;--cream:#2f2723;--soft:#7a6d5f;--line:rgba(47,39,35,.15);--trail:rgba(47,39,35,.3)}}
:root[data-theme="light"]{--bg:#f3ecdf;--bg2:#ebe2d1;--cream:#2f2723;--soft:#7a6d5f;--line:rgba(47,39,35,.15);--trail:rgba(47,39,35,.3)}
body{background:var(--bg);color:var(--cream);font-family:"IBM Plex Sans Arabic","Oswald",system-ui,sans-serif;font-weight:300}
html[lang=en] body{font-family:"Oswald","IBM Plex Sans Arabic",sans-serif;letter-spacing:.02em}
.demo-note{background:var(--cream);color:var(--bg)}
header{position:relative;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1rem;background:#2f2723;color:#efe6d2}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:none;color:#efe6d2;border:1px solid rgba(239,230,210,.5);border-radius:0;padding:.25rem .9rem;cursor:pointer;min-height:36px;font:300 .8rem "Oswald";letter-spacing:.1em;z-index:2}
.mn{font:200 2.4rem/1 "Oswald";letter-spacing:.04em;margin:0}
/* the single thin vertical line from their printed menu */
.ln{width:1px;height:70px;margin:.9rem auto;background:linear-gradient(#efe6d2,transparent)}
#logo{display:inline-block;padding:.2rem 1rem .5rem;background:#2f2723}
.wm{font:400 3.4rem/1 "Fraunces",serif;letter-spacing:-.01em;color:#efe6d2;direction:ltr}
.tg{margin:.4rem 0 0;font-size:.95rem;color:#cbbfa9}
.info{font-size:.78rem;color:#9f937f;margin:.3rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:540px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:0;border-bottom:1px solid var(--trail);background:transparent;color:var(--cream);border-radius:0;padding:.5rem .1rem;font:inherit}
.search input::placeholder{color:var(--soft)}
.chips{display:flex;gap:1.2rem;overflow-x:auto;padding:.55rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:none;color:var(--soft);padding:.3rem 0;cursor:pointer;min-height:36px;font:300 .9rem "Oswald","IBM Plex Sans Arabic";letter-spacing:.06em;text-transform:uppercase}
.chip[aria-pressed="true"]{color:var(--cream);box-shadow:inset 0 -1px 0 var(--cream)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:1px solid var(--cream);outline-offset:3px}
/* "every cup carries a journey": sections sit on one dotted trail with waypoints */
main{max-width:540px;margin:0 auto;padding:1rem 1.4rem 1.5rem;position:relative}
main::before{content:"";position:absolute;top:1.6rem;bottom:2rem;inset-inline-start:1.4rem;border-inline-start:1px dashed var(--trail)}
section{position:relative;margin-top:2.1rem;padding-inline-start:1.6rem;scroll-margin-top:110px}
section::before{content:"";position:absolute;inset-inline-start:-5px;top:.55rem;width:9px;height:9px;border:1px solid var(--cream);background:var(--bg);transform:rotate(45deg)}
h2{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 .6rem;gap:1rem}
h2 .en{font:200 1.9rem/1 "Oswald";text-transform:uppercase;direction:ltr}
h2 .ar{font:500 1.15rem "IBM Plex Sans Arabic";text-align:end}
h2 .ar small,h2 .en small{display:block;font:300 .62rem "Oswald","IBM Plex Sans Arabic";letter-spacing:.14em;color:var(--soft);text-transform:uppercase}
.sz{text-align:end;font:300 .7rem "Oswald";letter-spacing:.14em;color:var(--soft);margin:-.2rem 0 .2rem;direction:ltr}
html[dir=rtl] .sz{text-align:start}
.row{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:baseline;padding:.42rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm{font-size:1rem}
.nm .e{display:block;font:300 .8rem "Oswald";color:var(--soft);letter-spacing:.04em;direction:ltr;text-align:start}
html[dir=rtl] .nm .e{text-align:right}
.pr{font:400 1.1rem "Oswald";white-space:nowrap;direction:ltr}
.pr small{font:300 .62rem "Oswald";color:var(--soft);margin-inline-start:.25rem;letter-spacing:.08em}
.sl{margin:0 .25rem;color:var(--soft)}
.visit a{border-radius:0}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--cream)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <p class="mn">MENU</p>
  <div class="ln" aria-hidden="true"></div>
  <div id="logo"><div class="wm">scout</div></div>
  <p class="tg">كل كوب يحمل رحلة</p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<nav class="visit" id="visit" hidden></nav>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>

    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستقرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
