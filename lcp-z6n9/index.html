<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو LOADING COFFEE</title>
<meta name="description" content="Loading Coffee Premium">
<meta property="og:title" content="منيو LOADING COFFEE">
<meta property="og:description" content="Loading Coffee Premium">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khashab12.github.io/menus/lcp-z6n9/">
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:140px}
body{margin:0;-webkit-font-smoothing:antialiased;line-height:1.6}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem;font-weight:500}
.pat{display:none}
.visit{max-width:720px;margin:0 auto;padding:0 1rem 2rem;display:grid;gap:.6rem}
.visit a{display:block;text-align:center;padding:.9rem 1rem;border-radius:12px;font-weight:600;text-decoration:none}
.empty{text-align:center;padding:3rem 1rem;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--bk:#0B0B0C;--bk2:#161618;--bk3:#222226;--wh:#fff;--pink:#F2667A;--muted:#9a9aa2;--line:#2a2a2f;
 --display:"IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
body{background:var(--bk);color:var(--wh);font-family:var(--body)}
.demo-note{background:var(--pink);color:#1a0508}
header.hero{position:relative;text-align:center;padding:3rem 1.2rem 2rem}
.lang{position:absolute;top:1rem;inset-inline-end:1rem;background:transparent;color:#fff;border:1px solid #444;border-radius:8px;padding:.3rem .8rem;font:600 .8rem var(--mono);cursor:pointer}
.word{direction:ltr;font:800 clamp(3rem,17vw,4.6rem)/.95 "Archivo Black","IBM Plex Sans Arabic",sans-serif;letter-spacing:-.01em;margin:0}
.sub{direction:ltr;font:700 .95rem var(--mono);letter-spacing:.42em;margin:.35rem 0 0;padding-inline-start:.42em}
.boot{direction:ltr;max-width:320px;margin:1.6rem auto 0;text-align:start;font:500 .78rem var(--mono);color:var(--muted)}
.track{height:10px;border:1px solid #3a3a40;border-radius:6px;padding:2px;margin-top:.4rem}
.fill{height:100%;width:100%;border-radius:3px;background:repeating-linear-gradient(90deg,var(--pink) 0 10px,#ff8a9a 10px 12px);animation:load 2.2s cubic-bezier(.3,.8,.3,1) both}
@keyframes load{from{width:4%}}
.ready{display:flex;justify-content:space-between;margin-top:.35rem}
.ready b{color:var(--pink)}
.info{color:var(--muted);font-size:.86rem;margin:1.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.95);backdrop-filter:blur(6px);padding:.7rem 0 .55rem;border-bottom:1px solid var(--line)}
.search{max-width:660px;margin:0 auto;padding:0 1rem}
.search input{width:100%;border:1px solid var(--line);background:var(--bk2);color:#fff;border-radius:10px;padding:.6rem 1rem;font:1rem var(--body)}
.search input::placeholder{color:#6f6f78}
.search input:focus-visible{outline:2px solid var(--pink)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.6rem 1rem .1rem;max-width:660px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--bk2);color:#ddd;border-radius:8px;padding:.35rem .9rem;font:600 .86rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.chip:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
main{max-width:660px;margin:0 auto;padding:.4rem 1rem 2rem}
section.cat{margin-top:1.8rem}
.ch{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.7rem;margin-bottom:.5rem}
.ch h2{margin:0;font:700 1.35rem var(--display)}
.ch .mini{height:6px;background:var(--bk3);border-radius:4px;overflow:hidden}
.ch .mini i{display:block;height:100%;width:100%;background:var(--pink)}
.ch .pc{direction:ltr;font:600 .75rem var(--mono);color:var(--pink)}
.it{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.8rem .9rem;background:var(--bk2);border:1px solid var(--line);border-radius:12px;margin-bottom:.45rem}
.it .nm{font-weight:700}
.it .en{direction:ltr;display:block;font:500 .72rem var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.it .pr{direction:ltr;font:700 .95rem var(--mono);white-space:nowrap}
.pick{display:inline-block;margin-inline-start:.45rem;font-size:.66rem;font-weight:700;border:1px solid var(--pink);color:var(--pink);border-radius:4px;padding:0 .35rem;vertical-align:middle}
.visit a{background:var(--bk2);color:#fff;border:1px solid var(--line)}
.visit a.wa{background:#fff;color:#000;border-color:#fff}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:1.5rem 1rem 2.5rem;border-top:1px solid var(--line)}
footer strong{color:#fff}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>
<div class="pat" id="pat" aria-hidden="true"></div>

<header class="hero">
  <button class="lang" id="langBtn">EN</button>
  <div id="heroInner"></div>
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>
<main id="menu"></main>
<section class="visit" id="visit" hidden></section>
<footer><p id="updated"></p><p id="credit"></p></footer>

<script>

const CONFIG = {"name": "LOADING COFFEE", "nameAr": "LOADING COFFEE", "tagline": {"ar": "Loading Coffee Premium", "en": "Loading Coffee Premium"}, "info": {"ar": "سوديك، شارع الـ Strip، الشيخ زايد · من ٨ الصبح", "en": "SODIC, Strip Rd, Sheikh Zayed · From 8 AM"}, "logo": null, "colors": {"primary": "#0B0B0C", "onPrimary": "#FFFFFF", "secondary": "#F2667A", "background": "#0B0B0C", "accent": "#F2667A"}, "fonts": {"display": "IBM Plex Sans Arabic", "body": "IBM Plex Sans Arabic"}, "pattern": "none", "currency": {"ar": "ج.م", "en": "EGP"}, "demoBanner": true, "credit": "محمد", "whatsapp": "201080805539", "mapsUrl": "https://maps.google.com/?cid=7051242952450569157", "categories": [{"id": "coffee", "ar": "قهوة", "en": "Coffee", "items": [{"ar": "إسبريسو", "en": "Espresso", "p": 65}, {"ar": "كابتشينو", "en": "Cappuccino", "p": 95, "pick": true}, {"ar": "لاتيه", "en": "Latte", "p": 100}, {"ar": "سبانيش لاتيه", "en": "Spanish Latte", "p": 120}, {"ar": "أمريكانو", "en": "Americano", "p": 80}]}, {"id": "cold", "ar": "ساقع وشيكات", "en": "Cold & Shakes", "items": [{"ar": "ميلك شيك فراولة", "en": "Strawberry Milkshake", "p": 130, "pick": true}, {"ar": "بروتين شيك", "en": "Protein Shake", "p": 150}, {"ar": "آيس لاتيه", "en": "Iced Latte", "p": 105}]}, {"id": "sweets", "ar": "حلو", "en": "Desserts", "items": [{"ar": "تشيز كيك بلوبيري", "en": "Blueberry Cheesecake", "p": 140, "pick": true}, {"ar": "كيكة جزر", "en": "Carrot Cake", "p": 125}]}]};

const C = CONFIG || {name:"Menu",categories:[]};
const root = document.documentElement.style;
const col = C.colors || {};
[["--primary",col.primary],["--on-primary",col.onPrimary],["--secondary",col.secondary],["--bg",col.background],["--accent",col.accent]]
  .forEach(([k,v]) => { if (v) root.setProperty(k, v); });
const F = C.fonts || {};
const fams = [F.display, F.body].filter(Boolean);
if (fams.length){
  document.getElementById("fontlink").href = "https://fonts.googleapis.com/css2?" +
    [...new Set(fams)].map(f => "family=" + f.trim().replace(/ /g,"+") + ":wght@400;500;600;700").join("&") + "&display=swap";
  if (F.display) root.setProperty("--display", `"${F.display}", "${F.body||F.display}", system-ui, sans-serif`);
  if (F.body) root.setProperty("--body", `"${F.body}", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`);
}

const PATTERNS = {
  tiles:`<svg width="100%" height="100%"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L36 20 L52 28 L36 36 L28 52 L20 36 L4 28 L20 20 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="28" cy="28" r="5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  dots:`<svg width="100%" height="100%"><defs><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="3.5" fill="currentColor"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  lines:`<svg width="100%" height="100%"><defs><pattern id="p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="22" stroke="currentColor" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`,
  none:""
};
const pat = document.getElementById("pat");
pat.innerHTML = PATTERNS[C.pattern || "none"] || "";
pat.style.color = (C.colors && C.colors.accent) || "#fff";

const T = {
  ar:{dir:"rtl",lang:"English",search:"ابحث عن صنف…",pick:"ترشيحنا",empty:"ما فيه صنف بهالاسم. جرّب كلمة ثانية.",all:"الكل",
      note:`نسخة تجريبية للعرض — الأصناف والأسعار أمثلة وتتغير لأصناف ${C.name} الحقيقية`,updated:"آخر تحديث للأسعار: اليوم",credit:n=>`منيو ديجيتال من تصميم <strong>${n}</strong>`},
  en:{dir:"ltr",lang:"العربية",search:"Search the menu…",pick:"Our pick",empty:"No dish matches that. Try another word.",all:"All",
      note:`Demo version — items and prices are samples, to be replaced with ${C.name}'s real menu`,updated:"Prices last updated: today",credit:n=>`Digital menu designed by <strong>${n}</strong>`}
};
let lang="ar", active="all", query="";
try{const s=localStorage.getItem("menu-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"ر.س",en:"SAR"})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");

function renderHero(){
  const t=C.tagline||{}, info=C.info||{};
  const logo = C.logo ? `<img class="logo" src="${C.logo}" alt="${esc(C.name)} logo">` : "";
  $("heroInner").innerHTML = `${logo}<h1 class="brand${C.logo?" small":""}">${esc(lang==="ar"&&C.nameAr?C.nameAr:C.name)}</h1>
    ${t[lang]?`<p class="tag">${esc(t[lang])}</p>`:""}${info[lang]?`<p class="info">${esc(info[lang])}</p>`:""}`;
}
function renderChips(){
  const cats=[{id:"all",ar:T[lang].all,en:T[lang].all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    const sub=L(c,"subAr","subEn");
    html+=`<section class="cat" id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}`;
    for(const i of items){const d=L(i,"dAr","dEn");
      html+=`<div class="item"><div class="name">${esc(L(i,"ar","en"))}${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}</div><div class="price">${fmt(i.p)} ${cur()}</div>${d?`<p class="desc">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${lang==="ar"?"سعرة حرارية":"kcal"}</p>`:""}</div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.note;
  $("updated").textContent=t.updated; $("credit").innerHTML=t.credit(esc(C.credit||"محمد"));
  const V={ar:{wa:"اطلب على واتساب",map:"اللوكيشن",rev:"قيّمنا على جوجل",ig:"انستجرام"},en:{wa:"Order on WhatsApp",map:"Location",rev:"Rate us on Google",ig:"Instagram"}}[lang];
  const links=[C.whatsapp&&`<a class="wa" href="https://wa.me/${esc(String(C.whatsapp).replace(/\D/g,""))}" target="_blank" rel="noopener">${V.wa}</a>`,
    C.mapsUrl&&`<a href="${esc(C.mapsUrl)}" target="_blank" rel="noopener">${V.map}</a>`,
    C.reviewUrl&&`<a href="${esc(C.reviewUrl)}" target="_blank" rel="noopener">${V.rev}</a>`,
    C.instagram&&`<a href="${esc(C.instagram)}" target="_blank" rel="noopener">${V.ig}</a>`].filter(Boolean);
  const vs=$("visit"); vs.hidden=!links.length; vs.innerHTML=links.join("");
  renderHero(); renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("menu-lang",lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});


function renderHero(){
  const info=C.info||{};
  $("heroInner").innerHTML=`<h1 class="word">LOADING</h1><p class="sub">COFFEE</p>
   <div class="boot">loading menu...<div class="track"><div class="fill"></div></div><div class="ready"><span>${lang==="ar"?"المنيو كامل، من غير ما تختار منطقة":"Full menu, no area to pick"}</span><b>100%</b></div></div>
   <p class="info">${esc(info[lang]||"")}</p>`;
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0;
  for(const c of C.categories){
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) continue; n+=items.length;
    html+=`<section class="cat" id="cat-${esc(c.id)}"><div class="ch"><h2>${esc(L(c,"ar","en"))}</h2><div class="mini"><i></i></div><span class="pc">${items.length}/${c.items.length} ready</span></div>`;
    for(const i of items){
      html+=`<div class="it"><div><span class="nm">${esc(L(i,"ar","en"))}</span>${i.pick?`<span class="pick">${T[lang].pick}</span>`:""}${lang==="ar"?`<span class="en">${esc(i.en)}</span>`:""}</div><span class="pr">${fmt(i.p)} ${cur()}</span></div>`;}
    html+="</section>";
  }
  $("menu").innerHTML=n?html:`<p class="empty">${lang==="ar"?"مفيش صنف بالاسم ده، جرب كلمة تانية.":T[lang].empty}</p>`;
}
T.ar.lang="EN"; T.en.lang="ع";
T.ar.note="نسخة تجريبية للعرض: الأصناف من صوركم وريفيوهاتكم على جوجل، والأسعار أمثلة لحد ما نحط أسعاركم";
T.ar.search="بتدور على ايه؟";
T.ar.pick="جرّبه";
T.ar.updated="آخر تحديث للأسعار: النهارده";

apply();
</script>
<script>if(location.hash!=="#preview"){window.goatcounter={path:"lcp-z6n9"};var s=document.createElement("script");s.async=1;s.dataset.goatcounter="https://khashab.goatcounter.com/count";s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);}</script>
</body>
</html>
